<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vector Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Precalculus", "unit": "Vectors", "title": "Vector Explorer", "intro": "Drag the tips of u and v. Add them tip to tail, subtract them, or stretch u by a scalar, and compare the components, magnitudes and directions."});
/* Vectors u and v drawn from the origin with draggable tips (snapped to the half-unit grid).
   Modes: u + v (tip-to-tail and parallelogram), u − v = u + (−v), and k·u. */
var st = { u: [4, 1], v: [1, 3], mode: 'sum', k: 2, seen: {} };
var g = L.graph(P.stage, { xmin: -10, xmax: 10, ymin: -10, ymax: 10, width: 600, height: 600, label: 'Vectors on the coordinate plane' });
var legend = L.h('div', { class: 'legend', style: 'margin:6px' }, P.stage);
L.chips(P.panel, { label: 'Operation', value: st.mode, options: [{ value: 'sum', label: 'u + v' }, { value: 'diff', label: 'u − v' }, { value: 'scale', label: 'k · u' }], onChange: function (v) { st.mode = v; sk.el.hidden = v !== 'scale'; draw(); } });
var sk = L.slider(P.panel, { id: 'scalar-k', label: 'scalar k', min: -3, max: 3, step: 0.25, value: st.k, color: 'purple', format: function (v) { return L.nice(v, 4); }, onInput: function (v) { st.k = v; draw(); } });
sk.el.hidden = true;
var read = L.h('div', { class: 'readout small', 'aria-live': 'polite' }, P.panel);
var tbl = L.table(P.panel);
var fb = L.feedback(P.panel);
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st.u = [4, 1]; st.v = [1, 3]; st.k = 2; sk.set(2, true); draw(); });
L.h('p', { class: 'sub' }, P.panel, 'Drag the tips of u (blue) and v (orange), or click a tip and use the arrow keys (half-unit steps).');
var ch = L.challenges(P.panel, [
  { text: 'Make u have magnitude exactly 5 with <b>neither</b> component equal to 0.', check: function () { return st.seen.mag5; } },
  { text: 'In u + v, make the sum the zero vector ⟨0, 0⟩ (with u ≠ ⟨0, 0⟩). How are u and v related?', check: function () { return st.seen.zero; } },
  { text: 'Predict, then test: when is |u + v| exactly equal to |u| + |v|? Build an example with both vectors nonzero.', check: function () { return st.seen.equalMag; } },
  { text: 'A classmate says |u + v| = |u| + |v| always. Find a <b>counterexample</b> where |u + v| is less than half of |u| + |v|.', check: function () { return st.seen.lessHalf; } },
  { text: 'In u − v, make u − v = ⟨4, 0⟩ when neither u nor v is horizontal. Where does u − v point on the picture?', check: function () { return st.seen.diff40; } },
  { text: 'In k · u, choose u and k so that k · u is a <b>unit vector</b> (magnitude 1).', check: function () { return st.seen.unit; } }
]);
L.notice(P.below, '<p><b>Vectors add component by component:</b> ⟨a, b⟩ + ⟨c, d⟩ = ⟨a + c, b + d⟩. Geometrically, put the tail of v at the tip of u; the sum goes from the start to the end (the diagonal of the parallelogram).</p>' +
  '<p>Magnitudes do <b>not</b> add: |u + v| ≤ |u| + |v|, with equality only when u and v point the same way. Opposite vectors add to the zero vector.</p>' +
  '<p>u − v = u + (−v) is the vector from the tip of v to the tip of u. Multiplying by k stretches the length by |k|; a negative k also reverses the direction. Dividing a vector by its magnitude gives a unit vector.</p>');
function mag(w) { return Math.sqrt(w[0] * w[0] + w[1] * w[1]); }
function comp(w) { return '⟨' + L.nice(w[0], 4) + ', ' + L.nice(w[1], 4) + '⟩'; }
function magTxt(w) {
  var m2 = w[0] * w[0] + w[1] * w[1], r = Math.sqrt(m2);
  if (Math.abs(r - Math.round(r)) < 1e-9) return L.num(r);
  var q = m2 * 4; /* components are multiples of 0.5 (or 0.25 after scaling): try m2 as a whole number first */
  if (Math.abs(m2 - Math.round(m2)) < 1e-9) { var n = Math.round(m2), out = 1, ins = n; for (var f = 2; f * f <= ins; f++) while (ins % (f * f) === 0) { ins /= f * f; out *= f; } return (out > 1 ? out : '') + '√' + ins + ' ≈ ' + L.num(r, 3); }
  return '≈ ' + L.num(r, 3);
}
function dirTxt(w) { if (mag(w) < 1e-12) return 'none (zero vector)'; var d = Math.atan2(w[1], w[0]) * 180 / Math.PI; if (d < 0) d += 360; return (Math.abs(d - Math.round(d)) < 1e-9 ? L.num(d) + '°' : '≈ ' + L.num(d, 1) + '°'); }
function arrow(from, w, color, o) {
  o = o || {};
  var to = [from[0] + w[0], from[1] + w[1]];
  if (mag(w) < 1e-12) { g.dot(from[0], from[1], { color: color, r: 6 }); return; }
  g.line(from[0], from[1], to[0], to[1], { color: color, width: o.width || 4, dash: o.dash || null, opacity: o.opacity || null });
  var X1 = g.X(to[0]), Y1 = g.Y(to[1]), ang = Math.atan2(Y1 - g.Y(from[1]), X1 - g.X(from[0])), s = 14;
  L.s('path', { d: 'M' + X1 + ' ' + Y1 + ' L' + (X1 - s * Math.cos(ang - 0.4)) + ' ' + (Y1 - s * Math.sin(ang - 0.4)) + ' L' + (X1 - s * Math.cos(ang + 0.4)) + ' ' + (Y1 - s * Math.sin(ang + 0.4)) + ' Z', fill: 'var(--' + color + ')', opacity: o.opacity || null }, g.layer);
  if (o.label) g.text((from[0] + to[0]) / 2, (from[1] + to[1]) / 2, o.label, { dx: 8, dy: -8, color: color });
}
var draw = L.scheduler(function () {
  var u = st.u, v = st.v, O = [0, 0];
  g.clear();
  var res, rows;
  if (st.mode === 'sum') {
    res = [u[0] + v[0], u[1] + v[1]];
    g.poly([O, u, res, v], { fill: 'purple', opacity: 0.08, stroke: 'ghost', width: 1.5 });
    arrow(u, v, 'orange', { dash: '8 6', opacity: 0.7 });
    arrow(v, u, 'blue', { dash: '8 6', opacity: 0.5 });
    arrow(O, res, 'purple', { width: 5, label: 'u + v' });
    legend.innerHTML = '<span><i style="background:var(--blue)"></i>u</span><span><i style="background:var(--orange)"></i>v (dashed: moved to the tip of u)</span><span><i style="background:var(--purple)"></i>u + v</span>';
  } else if (st.mode === 'diff') {
    res = [u[0] - v[0], u[1] - v[1]];
    arrow(O, [-v[0], -v[1]], 'orange', { dash: '4 6', opacity: 0.6, label: '−v' });
    arrow(u, [-v[0], -v[1]], 'orange', { dash: '8 6', opacity: 0.6 });
    arrow(v, res, 'purple', { dash: '8 6', opacity: 0.6 });
    arrow(O, res, 'purple', { width: 5, label: 'u − v' });
    legend.innerHTML = '<span><i style="background:var(--orange)"></i>−v (dashed)</span><span><i style="background:var(--purple)"></i>u − v (also drawn dashed from the tip of v to the tip of u)</span>';
  } else {
    res = [st.k * u[0], st.k * u[1]];
    arrow(O, res, 'purple', { width: 7, opacity: 0.55, label: 'k · u' });
    legend.innerHTML = '<span><i style="background:var(--blue)"></i>u</span><span><i style="background:var(--purple)"></i>k · u</span>';
  }
  arrow(O, u, 'blue', { label: 'u' });
  if (st.mode !== 'scale') arrow(O, v, 'orange', { label: 'v' });
  g.handle(u[0], u[1], { color: 'blue', snap: 0.5, label: 'Tip of u', onDrag: function (x, y) { st.u = [x, y]; draw(); } });
  if (st.mode !== 'scale') g.handle(v[0], v[1], { color: 'orange', snap: 0.5, label: 'Tip of v', onDrag: function (x, y) { st.v = [x, y]; draw(); } });
  var name = st.mode === 'sum' ? 'u + v' : st.mode === 'diff' ? 'u − v' : L.nice(st.k, 4) + 'u';
  read.innerHTML = name + ' = ' + (st.mode === 'scale' ? L.nice(st.k, 4) + comp(u) : comp(u) + (st.mode === 'sum' ? ' + ' : ' − ') + comp(v)) + ' = <b class="c-purple">' + comp(res) + '</b>';
  rows = [['u', comp(u), magTxt(u), dirTxt(u)]];
  if (st.mode !== 'scale') rows.push(['v', comp(v), magTxt(v), dirTxt(v)]);
  rows.push([name, comp(res), magTxt(res), dirTxt(res)]);
  tbl.set(['vector', 'components', 'magnitude', 'direction'], rows);
  var mu = mag(u), mv = mag(v), mr = mag(res);
  if (st.mode === 'sum') fb.set('|u| + |v| ≈ ' + L.num(mu + mv, 3) + ' but |u + v| ≈ ' + L.num(mr, 3) + (Math.abs(mr - mu - mv) < 1e-9 ? ': equal, because u and v point the same way.' : ': the sum is shorter unless u and v point the same way.'), Math.abs(mr - mu - mv) < 1e-9 ? 'good' : '');
  else if (st.mode === 'diff') fb.set('u − v goes from the tip of v to the tip of u. Its components are the differences of the components.', '');
  else fb.set(Math.abs(st.k) < 1e-12 ? '0 · u is the zero vector: no length and no direction.' : '|k · u| = |k| × |u| ≈ ' + L.num(Math.abs(st.k), 3) + ' × ' + L.num(mu, 3) + ' ≈ ' + L.num(mr, 3) + (st.k < 0 ? '. A negative k reverses the direction.' : '.'), '');
  if (Math.abs(mu - 5) < 1e-9 && u[0] !== 0 && u[1] !== 0) st.seen.mag5 = true;
  if (st.mode === 'sum' && mr < 1e-9 && mu > 0) st.seen.zero = true;
  if (st.mode === 'sum' && mu > 0 && mv > 0 && Math.abs(mr - mu - mv) < 1e-9) st.seen.equalMag = true;
  if (st.mode === 'sum' && mu > 0 && mv > 0 && mr < (mu + mv) / 2) st.seen.lessHalf = true;
  if (st.mode === 'diff' && Math.abs(res[0] - 4) < 1e-9 && Math.abs(res[1]) < 1e-9 && u[1] !== 0 && v[1] !== 0) st.seen.diff40 = true;
  if (st.mode === 'scale' && Math.abs(mr - 1) < 1e-9) st.seen.unit = true;
  ch.update();
});
draw();

})();
</script>
</body></html>
