<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recursion &amp; Closed Form Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Discrete Math", "unit": "Sequences, Mathematical Induction, and Recursion", "title": "Recursion & Closed Form Explorer", "intro": "Build a sequence from a recurrence relation and initial terms, watch the terms and partial sums grow, then type a closed-form guess and test it against the terms."});
/* Recursion & Closed Form Explorer.
   First order:  a₁ given, aₙ = c·aₙ₋₁ + d (n ≥ 2). c = 1: arithmetic, aₙ = a₁ + (n − 1)d. d = 0: geometric, aₙ = a₁·cⁿ⁻¹.
                 Otherwise aₙ = cⁿ⁻¹(a₁ − L) + L with fixed point L = d / (1 − c).
   Second order: a₁, a₂ given, aₙ = c·aₙ₋₁ + d·aₙ₋₂ (n ≥ 3); characteristic equation x² = cx + d.
   Sₙ = a₁ + … + aₙ. A closed-form guess is compared with the first 15 terms: agreement is evidence, not a proof. */
var css = L.h('style', null, document.head);
css.textContent = '.rc-in{width:100%;min-height:44px;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:1.1rem;font-weight:700;background:var(--card);color:var(--ink)}' +
  '.rc-lab{font-weight:700;display:block;margin:6px 0 4px}.rc-err{color:var(--red);font-weight:700;min-height:1.2em;font-size:.95rem}.rc-rule{font-size:1.15rem;margin:2px 0 8px}' +
  '.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rc-ok{color:var(--green);font-weight:700}.rc-no{color:var(--red);font-weight:700}';
var N = 15;
var PRE = { custom: null, arith: { o: 1, c: 1, d: 2, a1: 3, a2: 0 }, geo: { o: 1, c: 2, d: 0, a1: 3, a2: 0 }, hanoi: { o: 1, c: 2, d: 1, a1: 1, a2: 0 }, fib: { o: 2, c: 1, d: 1, a1: 1, a2: 1 } };
var START = { o: 1, c: 2, d: 1, a1: 1, a2: 0, guess: '' };
var st = Object.assign({}, START), seen = {};

/* closed-form parser: numbers, n, + − * / ^, parentheses, implicit multiplication (2n, 3(n + 1), 2^n) */
function parseF(src) {
  var s = src.replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/[×·]/g, '*').replace(/\*\*/g, '^'), i = 0;
  if (!s) throw new Error('Type a formula in n.');
  if (/[^0-9n+\-*/^().]/.test(s)) throw new Error('Use only numbers, n, + − * / ^ and parentheses.');
  function atom() {
    var c = s[i];
    if (c === '(') { i++; var e = sum(); if (s[i] !== ')') throw new Error('Missing “)”.'); i++; return e; }
    if (c === 'n') { i++; return function (n) { return n; }; }
    var m = /^\d+(\.\d+)?|^\.\d+/.exec(s.slice(i));
    if (m) { i += m[0].length; var v = parseFloat(m[0]); return function () { return v; }; }
    throw new Error(c ? 'Unexpected “' + c + '”.' : 'The formula ends too early.');
  }
  function power() { var b = atom(); if (s[i] === '^') { i++; var e = unary(); return function (n) { return Math.pow(b(n), e(n)); }; } return b; }
  function unary() { if (s[i] === '-') { i++; var u = unary(); return function (n) { return -u(n); }; } if (s[i] === '+') { i++; return unary(); } return power(); }
  function prod() {
    var l = unary();
    for (;;) {
      var c = s[i];
      if (c === '*' || c === '/') { i++; var r = unary(); l = (function (l, r, c) { return c === '*' ? function (n) { return l(n) * r(n); } : function (n) { return l(n) / r(n); }; })(l, r, c); }
      else if (c === '(' || c === 'n' || (c && /[0-9.]/.test(c) && /[n)]/.test(s[i - 1]))) { var r2 = power(); l = (function (l, r) { return function (n) { return l(n) * r(n); }; })(l, r2); }
      else return l;
    }
  }
  function sum() { var l = prod(); while (s[i] === '+' || s[i] === '-') { var c = s[i++], r = prod(); l = (function (l, r, c) { return c === '+' ? function (n) { return l(n) + r(n); } : function (n) { return l(n) - r(n); }; })(l, r, c); } return l; }
  var f = sum(); if (i < s.length) throw new Error('Unexpected “' + s[i] + '”.');
  return f;
}
function terms() { var a = [null, st.a1]; if (st.o === 2) a.push(st.a2); for (var n = a.length; n <= N; n++) a.push(st.o === 1 ? st.c * a[n - 1] + st.d : st.c * a[n - 1] + st.d * a[n - 2]); return a; }
function fmt(x) { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; var r = Math.abs(x) >= 1e9 ? x.toExponential(4) : String(Math.round(x * 1e6) / 1e6); return r.replace('-', '−'); }
function close(a, b) { return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)); }

var pre = L.chips(P.panel, { label: 'Start from', value: 'hanoi', options: [{ value: 'arith', label: 'Arithmetic' }, { value: 'geo', label: 'Geometric' }, { value: 'hanoi', label: 'Tower of Hanoi' }, { value: 'fib', label: 'Fibonacci' }, { value: 'custom', label: 'My own' }],
  onChange: function (v) { if (PRE[v]) { Object.assign(st, PRE[v]); sync(); } draw(); } });
var ord = L.chips(P.panel, { label: 'Recurrence', value: 1, options: [{ value: 1, label: 'aₙ = c·aₙ₋₁ + d' }, { value: 2, label: 'aₙ = c·aₙ₋₁ + d·aₙ₋₂' }], onChange: function (v) { st.o = v; pre.set('custom', true); sync(); draw(); } });
var g = L.h('div', { class: 'rc-grid' }, P.panel);
function nin(id, label, key) { return L.numInput(g, { id: id, label: label, min: -1000, max: 1000, step: 'any', value: st[key], onChange: function (v) { st[key] = v; pre.set('custom', true); draw(); } }); }
var iC = nin('c', 'c', 'c'), iD = nin('d', 'd', 'd'), iA1 = nin('a1', 'a₁', 'a1'), iA2 = nin('a2', 'a₂', 'a2');
L.h('label', { class: 'rc-lab', for: 'rc-guess' }, P.panel, 'Your closed-form guess: aₙ =');
var gin = L.h('input', { id: 'rc-guess', class: 'rc-in', type: 'text', placeholder: 'for example 2^n - 1', autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'rc-gerr' }, P.panel);
var gerr = L.h('div', { id: 'rc-gerr', class: 'rc-err', 'aria-live': 'polite' }, P.panel);
gin.addEventListener('input', function () { st.guess = gin.value; draw(); });
var btns = L.h('div', { class: 'btn-row' }, P.panel);
var showCF = false;
L.button(btns, 'Show a closed form', function () { showCF = !showCF; draw(); }, true);
L.reset(btns, function () { st = Object.assign({}, START); showCF = false; gin.value = ''; pre.set('hanoi', true); sync(); draw(); });
var fb = L.feedback(P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Make an <b>arithmetic</b> sequence with a₁ = 5 and a₁₀ = 32.', check: function () { return seen.ar; } },
  { text: 'Tower of Hanoi (aₙ = 2aₙ₋₁ + 1, a₁ = 1): type a closed form that matches every term shown.', check: function () { return seen.hanoi; } },
  { text: 'Find a first-order recurrence whose terms <b>alternate in sign</b> and never reach 0.', check: function () { return seen.alt; } },
  { text: 'Find a first-order recurrence with c ≠ 1 whose sequence is <b>constant</b>. How is a₁ related to c and d?', check: function () { return seen.fixed; } },
  { text: 'Use the Fibonacci recurrence (a₁ = a₂ = 1). Find a₁₂ and the sum S₁₀.', check: function () { return seen.fib; } },
  { text: 'Make any <b>geometric</b> sequence (c ≠ 0 or 1, a₁ ≠ 0) and type a closed form that matches it.', check: function () { return seen.geo; } }
]);
L.notice(P.below, '<p><b>Recursive vs closed form.</b> A recurrence gives each term from earlier ones; a closed (explicit) formula gives aₙ directly from n. A recurrence needs initial terms: the same rule with a different a₁ is a different sequence.</p>' +
  '<p><b>Matching is not proving.</b> A guess that agrees with the first 15 terms is a conjecture. To prove aₙ = f(n) for all n ≥ 1: check the <b>basis</b> f(1) = a₁, then assume aₖ = f(k) (the <b>inductive hypothesis</b>) and show c·f(k) + d = f(k + 1). For Hanoi: 2(2ᵏ − 1) + 1 = 2ᵏ⁺¹ − 1.</p>' +
  '<p><b>Patterns.</b> c = 1 adds d every time (arithmetic). d = 0 multiplies by c every time (geometric). When |c| < 1 the terms approach the fixed point L = d/(1 − c); when |c| > 1 they grow away from it; a negative c makes them alternate around it.</p>' +
  '<p>Second-order recurrences like Fibonacci need two initial terms. Their closed forms come from the roots of x² = cx + d (for Fibonacci, (1 ± √5)/2).</p>');

var rule = L.h('div', { class: 'rc-rule', 'aria-live': 'polite' }, P.stage);
var gr = L.graph(P.stage, { width: 640, height: 300, xmin: 0, xmax: N + 1, ymin: -10, ymax: 10, label: 'Graph of the first 15 terms' });
var tbl = L.table(P.stage);
function sync() { ord.set(st.o, true); iC.set(st.c); iD.set(st.d); iA1.set(st.a1); iA2.set(st.a2); iA2.el.style.display = st.o === 2 ? '' : 'none'; }
function cf() {
  var c = st.c, d = st.d, a1 = st.a1;
  if (st.o === 1) {
    if (c === 1) return 'aₙ = ' + fmt(a1) + ' + ' + fmt(d) + '(n − 1)  (arithmetic)';
    if (d === 0) return 'aₙ = ' + fmt(a1) + ' · ' + fmt(c) + '<sup>n − 1</sup>  (geometric)';
    var Lp = d / (1 - c);
    return 'aₙ = ' + fmt(c) + '<sup>n − 1</sup>(' + fmt(a1) + ' − ' + fmt(Lp) + ') + ' + fmt(Lp) + '  (fixed point L = d/(1 − c) = ' + fmt(Lp) + ')';
  }
  var disc = c * c + 4 * d;
  if (disc > 0) { var r1 = (c + Math.sqrt(disc)) / 2, r2 = (c - Math.sqrt(disc)) / 2; return 'Characteristic equation x² = ' + fmt(c) + 'x + ' + fmt(d) + ' has roots ' + fmt(r1) + ' and ' + fmt(r2) + ', so aₙ = A·(' + fmt(r1) + ')ⁿ + B·(' + fmt(r2) + ')ⁿ for constants A, B fixed by a₁ and a₂.'; }
  if (disc === 0) return 'x² = ' + fmt(c) + 'x + ' + fmt(d) + ' has a double root ' + fmt(c / 2) + ', so aₙ = (A + Bn)(' + fmt(c / 2) + ')ⁿ.';
  return 'x² = ' + fmt(c) + 'x + ' + fmt(d) + ' has no real roots; the closed form uses complex numbers (beyond this tool).';
}

var draw = L.scheduler(function () {
  var a = terms(), S = [0], i;
  for (i = 1; i <= N; i++) S.push(S[i - 1] + a[i]);
  rule.innerHTML = (st.o === 1 ? 'a₁ = ' + fmt(st.a1) + ', &nbsp; aₙ = ' + fmt(st.c) + '·aₙ₋₁ + ' + fmt(st.d) + ' for n ≥ 2' : 'a₁ = ' + fmt(st.a1) + ', a₂ = ' + fmt(st.a2) + ', &nbsp; aₙ = ' + fmt(st.c) + '·aₙ₋₁ + ' + fmt(st.d) + '·aₙ₋₂ for n ≥ 3') +
    (showCF ? '<div class="sub" style="margin-top:6px;font-size:1rem">' + cf() + '</div>' : '');
  var f = null, gOK = null, firstBad = 0;
  if (st.guess.trim()) {
    try { f = parseF(st.guess); gerr.textContent = ''; gin.removeAttribute('aria-invalid'); } catch (e) { gerr.textContent = e.message; gin.setAttribute('aria-invalid', 'true'); }
    if (f) { gOK = true; for (i = 1; i <= N; i++) if (!close(f(i), a[i])) { gOK = false; firstBad = i; break; } }
  } else { gerr.textContent = ''; gin.removeAttribute('aria-invalid'); }
  /* graph */
  var vals = a.slice(1).filter(isFinite), lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
  if (f) for (i = 1; i <= N; i++) { var v = f(i); if (isFinite(v) && Math.abs(v) < 1e12) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (hi - lo < 1e-9) { hi += 5; lo -= 5; }
  var padY = (hi - lo) * 0.08; gr.setView({ xmin: 0, xmax: N + 1, ymin: lo - padY, ymax: hi + padY }); gr.clear();
  for (i = 1; i <= N; i++) if (isFinite(a[i])) { gr.line(i, 0, i, a[i], { color: 'blue', width: 3, opacity: 0.35 }); gr.dot(i, a[i], { color: 'blue', r: 6 }); }
  if (f) for (i = 1; i <= N; i++) { var y = f(i); if (isFinite(y)) gr.dot(i, y, { open: true, color: close(y, a[i]) ? 'green' : 'red', r: 9 }); }
  gr.text(0.2, hi + padY * 0.2, 'aₙ (filled)' + (f ? ' · your formula (rings)' : ''), { size: 13, dy: 14 });
  tbl.set(['n', 'aₙ', 'Sₙ = a₁ + … + aₙ'].concat(f ? ['your f(n)'] : []), a.slice(1).map(function (x, k) {
    var n = k + 1, row = [n, fmt(x), fmt(S[n])];
    if (f) { var y = f(n); row.push('<span class="' + (close(y, x) ? 'rc-ok' : 'rc-no') + '">' + fmt(y) + '</span>'); }
    return row;
  }));
  /* feedback */
  var kind = st.o === 1 ? (st.c === 1 ? 'arithmetic (common difference ' + fmt(st.d) + ')' : st.d === 0 ? 'geometric (common ratio ' + fmt(st.c) + ')' : 'neither arithmetic nor geometric') : 'second order';
  if (gOK === true) fb.set('Your formula matches all ' + N + ' terms shown. That is strong evidence, <b>not a proof</b>: prove it by induction (basis n = 1, then show the recurrence turns f(k) into f(k + 1)).', 'good');
  else if (gOK === false) fb.set('Your formula first disagrees at n = ' + firstBad + ': it gives ' + fmt(f(firstBad)) + ' but a<sub>' + firstBad + '</sub> = ' + fmt(a[firstBad]) + '.', 'warn');
  else fb.set('This sequence is ' + kind + '. Type a closed-form guess to test it.', '');
  /* challenges */
  var o1 = st.o === 1;
  if (o1 && st.c === 1 && st.a1 === 5 && close(a[10], 32)) seen.ar = true;
  if (o1 && st.c === 2 && st.d === 1 && st.a1 === 1 && gOK) seen.hanoi = true;
  var alt = true; for (i = 1; i < N; i++) if (!(a[i] * a[i + 1] < 0)) alt = false; if (o1 && alt) seen.alt = true;
  if (o1 && st.c !== 1 && a.slice(1).every(function (x) { return close(x, st.a1); }) && st.c !== 0) seen.fixed = true;
  if (!o1 && st.c === 1 && st.d === 1 && st.a1 === 1 && st.a2 === 1) seen.fib = true;
  if (o1 && st.d === 0 && st.c !== 0 && st.c !== 1 && st.a1 !== 0 && gOK) seen.geo = true;
  ch.update();
});
sync(); draw();

})();
</script>
</body></html>
