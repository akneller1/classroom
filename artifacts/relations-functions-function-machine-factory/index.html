<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Machine Factory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Function Machine Factory</h1>
        <p>Level <span id="level-display">1</span> - <span id="mode-display">Build Mode</span></p>
    </div>

    <div class="game-container">
        <!-- Left: Input/Output Data -->
        <div class="panel data-panel">
            <h2>Target Data</h2>
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Input (x)</th>
                        <th>Target Output (y)</th>
                        <th>Your Output</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            <div id="feedback-message" class="feedback"></div>
        </div>

        <!-- Center: The Machine -->
        <div class="panel machine-panel">
            <h2>The Machine</h2>
            <div class="conveyor-belt">
                <div class="machine">
                    <p class="machine-title" id="machine-instruction">Insert Gears Here</p>
                    <div id="machine-slots" class="slots-container">
                        <!-- Slots generated by JS -->
                    </div>
                </div>
            </div>
            <button id="test-btn" class="action-btn">Test Machine</button>
            <button id="next-btn" class="action-btn hidden">Next Level</button>
        </div>

        <!-- Right: Inventory -->
        <div class="panel inventory-panel">
            <h2>Available Gears</h2>
            <p class="instruction" id="inventory-instruction">Drag and drop gears into the machine.</p>
            <div id="gear-inventory" class="inventory-container">
                <!-- Gears populated by JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
