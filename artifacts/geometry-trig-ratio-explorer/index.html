<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trig Ratio Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/geo.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Geometry", "unit": "Right Triangles and Trigonometry", "title": "Trig Ratio Explorer", "intro": "Change the angle and the size of a right triangle. The size changes the sides, but only the angle changes sine, cosine and tangent."});
var Gm = L.geo, R = Math.PI / 180;
var st = { mode: 'ratios', th: 35, hyp: 8, sp: '306090', leg: 3, seen: {}, sizes: {} };
L.tabs(P.stage, [{ id: 'ratios', label: 'Trig ratios' }, { id: 'special', label: 'Special right triangles' }], function (id) { st.mode = id; build(); draw(); });
var g = L.graph(P.stage, { xmin: -1.5, xmax: 13.5, ymin: -1.8, ymax: 11, width: 620, height: 530, noGrid: true, label: 'Right triangle' });
var gg = L.geoGraph(g);
var read = L.h('div', { class: 'readout small', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var info = L.h('dl', { class: 'kv' }, P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Keep the angle the same and change the size. Do sin, cos and tan change?', check: function () { return Object.keys(st.sizes).some(function (k) { return Object.keys(st.sizes[k]).length >= 2; }); } },
  { text: 'Find the angle where sin θ = cos θ.', check: function () { return st.seen.eq; } },
  { text: 'Find the angle where sin θ = ' + L.frac(1, 2) + '.', check: function () { return st.seen.half; } },
  { text: 'Make tan θ greater than 1. What do you notice about θ?', check: function () { return st.seen.tan1; } },
  { text: 'Build a 30°-60°-90° triangle with a short leg of 4. How long is the hypotenuse?', check: function () { return st.mode === 'special' && st.sp === '306090' && st.leg === 4; } }
]);
function build() {
  ctrl.innerHTML = '';
  if (st.mode === 'ratios') {
    L.slider(ctrl, { id: 'th', label: 'Angle θ', min: 5, max: 85, step: 1, value: st.th, color: 'orange', format: L.deg, onInput: function (v) { st.th = v; draw(); } });
    L.slider(ctrl, { id: 'hyp', label: 'Size (hypotenuse)', min: 3, max: 12, step: 0.5, value: st.hyp, color: 'purple', format: L.nice, onInput: function (v) { st.hyp = v; draw(); } });
  } else {
    L.chips(ctrl, { label: 'Triangle', value: st.sp, options: [{ value: '454590', label: '45°-45°-90°' }, { value: '306090', label: '30°-60°-90°' }], onChange: function (v) { st.sp = v; draw(); } });
    L.slider(ctrl, { id: 'leg', label: 'Short leg', min: 1, max: 6, step: 1, value: st.leg, color: 'blue', format: L.num, onInput: function (v) { st.leg = v; draw(); } });
  }
}
function exactRatio(n, d) { return L.frac(n, d); }
var draw = L.scheduler(function () {
  g.clear();
  if (st.mode === 'ratios') {
    var th = st.th, h = st.hyp, adj = h * Math.cos(th * R), opp = h * Math.sin(th * R);
    var A = [0, 0], C = [adj, 0], B = [adj, opp], cen = [(adj * 2) / 3, opp / 3];
    var s = Math.min(1, 12.5 / Math.max(adj, 1), 10.5 / Math.max(opp, 1));
    var Ad = A, Cd = [adj * s, 0], Bd = [adj * s, opp * s], cenD = [cen[0] * s, cen[1] * s];
    gg.polygon([Ad, Cd, Bd], { stroke: 'ink', fill: 'blue', fillOpacity: 0.06, width: 3 });
    g.line(Ad[0], Ad[1], Cd[0], Cd[1], { color: 'green', width: 6 }); g.line(Cd[0], Cd[1], Bd[0], Bd[1], { color: 'orange', width: 6 }); g.line(Ad[0], Ad[1], Bd[0], Bd[1], { color: 'purple', width: 6 });
    gg.angle(Cd, Ad, Bd, { r: 1.3, color: 'orange', fill: true, label: 'θ = ' + th + '°', labelGap: 1.1 });
    gg.angle(Ad, Cd, Bd, { r: 0.7, color: 'ink', width: 2 });
    gg.sideLabel(Ad, Cd, cenD, 'adjacent = ' + L.num(adj, 2), { color: 'green' });
    gg.sideLabel(Cd, Bd, cenD, 'opposite = ' + L.num(opp, 2), { color: 'orange', gap: 1.8 });
    gg.sideLabel(Ad, Bd, cenD, 'hypotenuse = ' + L.num(h, 2), { color: 'purple', gap: 0.9 });
    var sn = Math.sin(th * R), cs = Math.cos(th * R), tn = Math.tan(th * R);
    read.innerHTML = 'sin ' + th + '° = ' + L.frac('<span class="c-orange">opp</span>', '<span class="c-purple">hyp</span>') + ' = ' + L.frac(L.num(opp, 2), L.num(h, 2)) + ' ≈ ' + L.num(sn, 3) +
      '<br>cos ' + th + '° = ' + L.frac('<span class="c-green">adj</span>', '<span class="c-purple">hyp</span>') + ' = ' + L.frac(L.num(adj, 2), L.num(h, 2)) + ' ≈ ' + L.num(cs, 3) +
      '<br>tan ' + th + '° = ' + L.frac('<span class="c-orange">opp</span>', '<span class="c-green">adj</span>') + ' = ' + L.frac(L.num(opp, 2), L.num(adj, 2)) + ' ≈ ' + L.num(tn, 3);
    info.innerHTML = '<dt>Pythagorean check</dt><dd>' + L.num(adj, 2) + '² + ' + L.num(opp, 2) + '² ≈ ' + L.num(adj * adj + opp * opp, 1) + ' = ' + L.num(h, 2) + '²</dd><dt>Other acute angle</dt><dd>' + (90 - th) + '°: sin ' + (90 - th) + '° = cos ' + th + '°</dd>';
    st.sizes[th] = st.sizes[th] || {}; st.sizes[th][h] = true;
    if (th === 45) st.seen.eq = true; if (th === 30) st.seen.half = true; if (tn > 1) st.seen.tan1 = true;
  } else {
    var x = st.leg, is45 = st.sp === '454590', L1 = x, L2 = is45 ? x : x * Math.sqrt(3), H = is45 ? x * Math.SQRT2 : 2 * x;
    var sc = Math.min(12 / L2, 10 / L1), Ad2 = [0, 0], Cd2 = [L2 * sc, 0], Bd2 = [L2 * sc, L1 * sc], cen2 = [L2 * sc * 2 / 3, L1 * sc / 3];
    gg.polygon([Ad2, Cd2, Bd2], { stroke: 'blue', fill: 'blue', fillOpacity: 0.08 });
    gg.angle(Ad2, Cd2, Bd2, { r: 0.7, color: 'ink', width: 2 });
    gg.angle(Cd2, Ad2, Bd2, { r: 1.2, color: 'orange', label: is45 ? '45°' : '30°' });
    gg.angle(Ad2, Bd2, Cd2, { r: 1.0, color: 'green', label: is45 ? '45°' : '60°' });
    gg.sideLabel(Cd2, Bd2, cen2, (is45 ? 'leg ' : 'short leg ') + x, { color: 'blue' });
    gg.sideLabel(Ad2, Cd2, cen2, is45 ? 'leg ' + x : 'long leg ' + (x === 1 ? '' : x) + '√3', { color: 'blue' });
    gg.sideLabel(Ad2, Bd2, cen2, 'hypotenuse ' + (is45 ? (x === 1 ? '' : x) + '√2' : 2 * x), { color: 'purple', gap: 0.9 });
    read.innerHTML = is45 ? 'leg : leg : hypotenuse = ' + L.V('x') + ' : ' + L.V('x') + ' : ' + L.V('x') + '√2<div class="sub" style="margin-top:6px">' + x + ' : ' + x + ' : ' + (x === 1 ? '' : x) + '√2 ≈ ' + L.num(H, 2) + '</div>'
      : 'short : long : hypotenuse = ' + L.V('x') + ' : ' + L.V('x') + '√3 : 2' + L.V('x') + '<div class="sub" style="margin-top:6px">' + x + ' : ' + (x === 1 ? '' : x) + '√3 : ' + 2 * x + ' (√3 ≈ 1.732)</div>';
    info.innerHTML = is45 ? '<dt>sin 45°</dt><dd>' + L.frac(1, '√2') + ' = ' + L.frac('√2', 2) + '</dd><dt>tan 45°</dt><dd>1</dd>' : '<dt>sin 30°</dt><dd>' + L.frac(1, 2) + '</dd><dt>cos 30°</dt><dd>' + L.frac('√3', 2) + '</dd><dt>tan 60°</dt><dd>√3</dd>';
  }
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
