<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Garden Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Polynomial Garden Planner</h1>
        <p>Level <span id="level-display">1</span> - <span id="mode-display">Area Expansion Mode</span></p>
    </div>

    <div class="game-container">
        <!-- Left: Requirements Data -->
        <div class="panel data-panel">
            <h2>Garden Requirements</h2>
            <div id="requirements-container">
                <!-- Populated by JS -->
            </div>
            <div id="feedback-message" class="feedback"></div>
        </div>

        <!-- Center: The Garden Grid -->
        <div class="panel garden-panel">
            <h2>The Plot</h2>
            
            <div class="garden-wrapper">
                <div class="top-headers-container">
                    <!-- Top left corner blank -->
                    <div class="corner-spacer"></div>
                    <div id="grid-headers-top" class="grid-headers grid-headers-x"></div>
                </div>
                
                <div class="garden-main-row">
                    <div id="grid-headers-left" class="grid-headers grid-headers-y"></div>
                    
                    <div class="garden-area" id="garden-area">
                        <!-- Drop zones / Locked plots generated by JS -->
                    </div>
                </div>
            </div>

            <button id="test-btn" class="action-btn">Inspect Garden</button>
            <button id="next-btn" class="action-btn hidden">Next Level</button>
        </div>

        <!-- Right: Inventory (Plots) -->
        <div class="panel inventory-panel">
            <h2>Available Plots</h2>
            <p class="instruction" id="inventory-instruction">Drag plots to form the correct area.</p>
            <div id="plot-inventory" class="inventory-container">
                <!-- Plots populated by JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
