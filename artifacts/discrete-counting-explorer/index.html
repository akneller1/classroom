<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Counting Outcomes Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Discrete Math", "unit": "Counting and Probability", "title": "Counting Outcomes Explorer", "intro": "Choose how many items, how many to select, whether order matters and whether repetition is allowed. See the formula, the count and the actual list of outcomes, then find probabilities by counting."});
/* Counting Outcomes Explorer. Choose r items from n distinct letters.
   Order matters, repetition allowed: n^r.  Order matters, no repetition: P(n, r) = n!/(n − r)!.
   Order does not matter, no repetition: C(n, r) = n!/(r!(n − r)!).  Order does not matter, repetition allowed: C(n + r − 1, r).
   Probabilities = favorable/total are correct only when the listed outcomes are equally likely. For multisets they are not
   (if each pick is random with replacement), so the tool also gives the correct probability from the n^r ordered outcomes. */
var css = L.h('style', null, document.head);
css.textContent = '.ct-list{display:flex;flex-wrap:wrap;gap:5px;max-height:330px;overflow:auto;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--card)}' +
  '.ct-list span{font-family:var(--display);font-weight:700;padding:2px 7px;border-radius:6px;background:var(--wash);letter-spacing:.06em}.ct-list span.hit{background:var(--green-tint);outline:2px solid var(--green)}' +
  '.ct-list .grp{display:flex;gap:4px;padding:3px 5px;border:2px solid var(--purple);border-radius:8px;background:var(--purple-tint)}.ct-list .grp span:first-child{background:var(--purple);color:#fff}' +
  '.ct-big{font-size:1.2rem;margin:2px 0 8px;line-height:1.5}.ct-big b{font-family:var(--display);font-size:1.35rem}';
var LET = 'ABCDEFG';
var START = { n: 4, r: 2, ord: 'yes', rep: 'no', ev: 'none', grp: false };
var st = Object.assign({}, START), seen = {}, combSeen = {};
function fact(k) { var x = 1; for (var i = 2; i <= k; i++) x *= i; return x; }
function C(n, r) { if (r < 0 || r > n) return 0; var x = 1; for (var i = 1; i <= r; i++) x = x * (n - r + i) / i; return Math.round(x); }
function Pn(n, r) { if (r > n) return 0; var x = 1; for (var i = 0; i < r; i++) x *= n - i; return x; }
function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
function frac(a, b) { if (!b) return '—'; var g = gcd(a, b) || 1; return a + '/' + b + (g > 1 ? ' = ' + a / g + '/' + b / g : '') + ' ≈ ' + (a / b).toFixed(3); }
function model() { return st.ord === 'yes' ? (st.rep === 'yes' ? 'tuple' : 'perm') : (st.rep === 'yes' ? 'multi' : 'comb'); }
function total(m) { var n = st.n, r = st.r; return m === 'tuple' ? Math.pow(n, r) : m === 'perm' ? Pn(n, r) : m === 'comb' ? C(n, r) : C(n + r - 1, r); }
function list(m, cap) { /* outcomes as arrays of indices, in dictionary order, at most cap of them */
  var n = st.n, r = st.r, out = [], cur = [];
  (function rec(start) {
    if (out.length >= cap) return;
    if (cur.length === r) { out.push(cur.slice()); return; }
    for (var i = (m === 'comb' ? start : m === 'multi' ? start : 0); i < n; i++) {
      if ((m === 'perm' || m === 'comb') && cur.indexOf(i) >= 0) continue;
      cur.push(i); rec(m === 'comb' ? i + 1 : i); cur.pop();
      if (out.length >= cap) return;
    }
  })(0);
  return out;
}
function word(o) { return o.map(function (i) { return LET[i]; }).join(''); }
var EV = { none: null, hasA: function (o) { return o.indexOf(0) >= 0; }, startA: function (o) { return o[0] === 0; }, distinct: function (o) { return o.every(function (x, i) { return o.indexOf(x) === i; }); }, alpha: function (o) { for (var i = 1; i < o.length; i++) if (o[i] <= o[i - 1]) return false; return true; } };
var EVNAME = { hasA: 'contains A', startA: 'starts with A', distinct: 'has no repeated letter', alpha: 'letters in strictly alphabetical order' };

var sN = L.slider(P.panel, { id: 'n', label: 'n: number of different letters', min: 2, max: 7, value: st.n, color: 'purple', format: function (v) { return v + ' (' + LET.slice(0, v).split('').join(', ') + ')'; }, onInput: function (v) { st.n = v; fixR(); draw(); } });
var sR = L.slider(P.panel, { id: 'r', label: 'r: how many are chosen', min: 1, max: 6, value: st.r, color: 'blue', onInput: function (v) { st.r = v; fixR(); draw(); } });
var cO = L.chips(P.panel, { label: 'Does order matter?', value: st.ord, options: [{ value: 'yes', label: 'Yes (arrangements)' }, { value: 'no', label: 'No (selections)' }], onChange: function (v) { st.ord = v; fixR(); draw(); } });
var cR = L.chips(P.panel, { label: 'Is repetition allowed?', value: st.rep, options: [{ value: 'yes', label: 'Yes (with replacement)' }, { value: 'no', label: 'No' }], onChange: function (v) { st.rep = v; fixR(); draw(); } });
var cE = L.chips(P.panel, { label: 'Event to count', value: st.ev, options: [{ value: 'none', label: 'None' }, { value: 'hasA', label: 'Contains A' }, { value: 'startA', label: 'Starts with A' }, { value: 'distinct', label: 'No repeats' }, { value: 'alpha', label: 'Alphabetical' }], onChange: function (v) { st.ev = v; draw(); } });
var cG = L.chips(P.panel, { label: 'Selections without repetition: show the orderings of each one?', value: 'off', options: [{ value: 'off', label: 'No' }, { value: 'on', label: 'Group the r! orderings' }], onChange: function (v) { st.grp = v === 'on'; draw(); } });
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st = Object.assign({}, START); sN.set(st.n, true); sR.set(st.r, true); cO.set(st.ord, true); cR.set(st.rep, true); cE.set('none', true); cG.set('off', true); draw(); });
var fb = L.feedback(P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Find settings where order matters, repetition is not allowed, and there are exactly <b>60</b> outcomes.', check: function () { return seen.sixty; } },
  { text: 'Show the 10 selections of 2 letters from 5 and group their orderings. How many orderings does each selection have, and how many in all?', check: function () { return seen.grp; } },
  { text: 'For selections without repetition, find <b>two different values of r</b> (same n) that give the same count. What do you notice about them?', check: function () { return seen.sym; } },
  { text: 'Arrange all 4 of A, B, C, D. Find P(the arrangement starts with A).', check: function () { return seen.start; } },
  { text: 'An ice-cream cup holds 3 scoops from 4 flavors, repeats allowed, order ignored. How many different cups are there?', check: function () { return seen.cups; } },
  { text: 'Roll a 6-sided “letter die” (A–F) twice. Find P(at least one A).', check: function () { return seen.atleast; } }
]);
L.notice(P.below, '<p><b>Decide two things first:</b> does order matter, and can an item be used more than once? The same letters and the same r give four different counts.</p>' +
  '<p><b>Why C(n, r) = P(n, r)/r!:</b> every selection of r different items can be put in order in r! ways, so the ordered list is r! times as long. Turn on grouping to see each selection with its orderings.</p>' +
  '<p><b>Probability by counting</b> uses P(E) = (outcomes in E)/(all outcomes) only when every outcome is equally likely. If each pick is random with replacement, the n^r ordered outcomes are equally likely, but multisets are not (AA can happen one way, AB two ways). The tool shows the correct probability in that case.</p>' +
  '<p><b>Complement:</b> P(at least one A) = 1 − P(no A). With replacement, that is 1 − ((n − 1)/n)^r.</p>');

var big = L.h('div', { class: 'ct-big', 'aria-live': 'polite' }, P.stage);
var box = L.h('div', { class: 'ct-list', role: 'list', 'aria-label': 'List of outcomes' }, P.stage);
var more = L.h('p', { class: 'sub', style: 'margin:6px 0' }, P.stage);
function fixR() { var max = st.rep === 'yes' ? 6 : st.n; sR.input.max = max; if (st.r > max) { st.r = max; sR.set(max, true); } }
var draw = L.scheduler(function () {
  var m = model(), n = st.n, r = st.r, T = total(m), f = EV[st.ev];
  if (st.ord === 'no' && (st.ev === 'startA' || st.ev === 'alpha')) f = null;
  var formula = { tuple: 'n<sup>r</sup> = ' + n + '<sup>' + r + '</sup>', perm: 'P(' + n + ', ' + r + ') = ' + n + '!/' + (n - r) + '!', comb: 'C(' + n + ', ' + r + ') = ' + n + '!/(' + r + '! · ' + (n - r) + '!)', multi: 'C(n + r − 1, r) = C(' + (n + r - 1) + ', ' + r + ')' }[m];
  var name = { tuple: 'ordered lists with repetition', perm: 'permutations (ordered, no repetition)', comb: 'combinations (unordered, no repetition)', multi: 'multisets (unordered, with repetition)' }[m];
  big.innerHTML = name + ': ' + formula + ' = <b>' + T.toLocaleString() + '</b>';
  var showGrp = st.grp && m === 'comb' && T * fact(r) <= 840, cap = 600, L0 = list(m, cap), hits = 0;
  box.innerHTML = '';
  L0.forEach(function (o) {
    var hit = f ? f(o) : false; if (hit) hits++;
    if (showGrp) {
      var g = L.h('div', { class: 'grp', role: 'listitem' }, box), perms = [];
      (function rec(cur, rest) { if (!rest.length) { perms.push(cur); return; } rest.forEach(function (x, i) { rec(cur.concat([x]), rest.slice(0, i).concat(rest.slice(i + 1))); }); })([], o);
      perms.forEach(function (p) { L.h('span', null, g, word(p)); });
    } else L.h('span', { class: hit ? 'hit' : '', role: 'listitem' }, box, word(o));
  });
  if (f && L0.length < T) { hits = 0; list(m, 1e6).forEach(function (o) { if (f(o)) hits++; }); }
  more.textContent = (L0.length < T ? 'Showing the first ' + L0.length + ' of ' + T.toLocaleString() + ' outcomes. ' : 'All ' + T + ' outcomes are listed. ') + (showGrp ? 'Each box is one selection (dark) with all ' + fact(r) + ' of its orderings: ' + T + ' × ' + fact(r) + ' = ' + T * fact(r) + ' = P(' + n + ', ' + r + ').' : st.grp && m === 'comb' ? 'Too many orderings to group here; try smaller n or r.' : '');
  if (f) {
    var txt = 'Outcomes that ' + EVNAME[st.ev] + ': <b>' + hits + '</b> of ' + T + '.';
    if (m === 'multi') {
      var good = 0, all = Math.pow(n, r);
      (function rec(cur) { if (cur.length === r) { var s = cur.slice().sort(); if (f(s)) good++; return; } for (var i = 0; i < n; i++) rec(cur.concat([i])); })([]);
      fb.set(txt + ' But multisets are <b>not equally likely</b> when each pick is random, so ' + hits + '/' + T + ' is not the probability. Using the ' + all + ' equally likely ordered outcomes: P = ' + frac(good, all) + '.', 'warn');
    } else fb.set(txt + ' Every outcome is equally likely if the choice is made at random, so P(' + EVNAME[st.ev] + ') = ' + frac(hits, T) + '.', 'good');
  } else if (st.ev === 'startA' || st.ev === 'alpha') fb.set('“' + EVNAME[st.ev] + '” only makes sense when order matters. Switch order to “Yes”, or choose another event.', 'warn');
  else fb.set('Choose an event to count favorable outcomes and find a probability.', '');
  /* challenges */
  if (m === 'perm' && T === 60) seen.sixty = true;
  if (m === 'comb' && n === 5 && r === 2 && showGrp) seen.grp = true;
  if (m === 'comb') { var key = n + ':' + T; combSeen[key] = combSeen[key] || {}; combSeen[key][r] = 1; if (Object.keys(combSeen[key]).length >= 2) seen.sym = true; }
  if (m === 'perm' && n === 4 && r === 4 && st.ev === 'startA') seen.start = true;
  if (m === 'multi' && n === 4 && r === 3) seen.cups = true;
  if (m === 'tuple' && n === 6 && r === 2 && st.ev === 'hasA') seen.atleast = true;
  ch.update();
});
fixR(); draw();

})();
</script>
</body></html>
