<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Red: Station Nimbus</title>
<style>
:root{--bg:#0f1226;--card:#1a1f3d;--ink:#f3efe2;--dim:#9aa0c3;--gold:#ffc857;--red:#ff5d6c;--green:#5de0a0;--blue:#6ec1ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#232859,#0f1226 60%);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#0a0c1c;border-bottom:2px solid #2b3166;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;color:var(--gold);letter-spacing:.5px}
#clock{font:700 1.6rem "Courier New",monospace;color:var(--green)}#clock.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
#dots{display:flex;gap:8px}.dot{width:14px;height:14px;border-radius:50%;background:#2b3166;border:2px solid #4a529a}.dot.done{background:var(--gold);border-color:var(--gold)}.dot.now{border-color:var(--ink)}
main{max-width:1050px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid #323a7a;border-radius:14px;padding:14px}
.panel h2{margin:0 0 6px;color:var(--gold);font-size:1.1rem}
.story{color:var(--dim);font-style:italic;margin:0 0 10px;line-height:1.4}
svg.scene{width:100%;height:auto;background:#0b0e20;border-radius:10px;display:block}
.hot{cursor:pointer}.hot:hover{filter:brightness(1.4)}
.eq{font:700 1.1rem "Courier New",monospace;background:#0b0e20;border-radius:8px;padding:8px 12px;margin:6px 0;display:inline-block;line-height:1.5}
input[type=number],input[type=text]{background:#0b0e20;color:var(--ink);border:2px solid #4a529a;border-radius:8px;padding:8px;font:700 1.1rem "Courier New",monospace;width:100px;text-align:center}
input[type=text]{width:200px;letter-spacing:2px;text-transform:uppercase}
button{background:var(--gold);color:#1a1530;border:0;border-radius:9px;padding:9px 16px;font:700 1rem inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:2px solid #4a529a}button:hover{filter:brightness(1.12)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.msg{min-height:1.4em;font-weight:700}.bad{color:var(--red)}.good{color:var(--green)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hint{background:#0b0e20;border-left:4px solid var(--blue);padding:7px 10px;margin:6px 0;border-radius:4px;color:#cfe8ff}
.note{background:#fff3a8;color:#3a2f00;padding:12px;border-radius:4px;transform:rotate(-1.5deg);font:600 1.05rem "Comic Sans MS",cursive;box-shadow:3px 4px 8px #0008;margin:8px 0;line-height:1.5}
.wheel{font:700 .9rem "Courier New",monospace;background:#0b0e20;padding:8px;border-radius:8px;overflow-x:auto;white-space:pre}
.cipher{font:700 1.4rem "Courier New",monospace;letter-spacing:3px;word-break:break-word;margin:8px 0}
.sw{display:flex;gap:6px;margin:5px 0 12px;align-items:center;flex-wrap:wrap}.sw button{background:#2b3166;color:var(--ink);padding:7px 12px}.sw button.on{background:var(--gold);color:#1a1530}
.card{display:inline-block;background:var(--gold);color:#1a1530;border-radius:8px;padding:8px 12px;margin:4px;text-align:center;font-weight:700;box-shadow:2px 3px 6px #0008}.card b{display:block;font:700 1.7rem "Courier New",monospace}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.big{text-align:center;padding:30px}.big h2{font-size:2rem}
#intro,#end{max-width:700px;margin:40px auto}
.dialbox{display:flex;flex-direction:column;align-items:center;gap:4px}.dialbox button{padding:3px 14px}.dialbox .num{font:700 2rem "Courier New",monospace;background:#0b0e20;border:2px solid var(--gold);border-radius:8px;width:56px;text-align:center}
.ord{display:flex;align-items:center;gap:8px;background:#0b0e20;border-radius:8px;padding:7px 10px;margin:5px 0}.ord span.t{flex:1}.ord button{padding:2px 10px;background:#2b3166;color:var(--ink)}
.q{margin:8px 0 2px}
#key{display:none;max-width:1050px;margin:0 auto 30px;padding:0 16px}
</style></head><body>
<header><h1>🚀 Code Red: Station Nimbus</h1><div id="dots"></div><div>Hints used: <b id="hu">0</b> &nbsp; <span id="clock">10:00</span></div></header>
<div id="app"></div>
<div id="key" class="panel"></div>
<script>
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const sup=e=>`<sup>${e}</sup>`;
const sub=e=>`<sub>${e}</sub>`;
const ROOM={
 id:'inequalities', title:'Code Red: Station Nimbus', emoji:'🚀', endEmoji:'🛸🌍',
 intro:'Station Nimbus is slowly losing oxygen thanks to a leaky valve and an overly curious robot. The escape pod is at the far end of the station and every door is locked by a math puzzle. Reach the pod in <b>10 minutes</b> before the air runs thin.',
 finalStory:'The pod hatch hisses open. Its flight computer asks for a destination: “Stack your key cards from the smallest stamp to the largest. The letters spell where the pod is headed.”',
 finalAsk:'Pod destination?', word:'ORBIT',
 outro:'The pod detaches with a whoosh and settles into a calm ORBIT. Mission Control cheers, the robot is forgiven, and the station gets patched. Fresh air never tasted so good.',
 stages:[
 {name:'The Valve Corridor',type:'fields',stamp:44,letter:'B',
  story:'The leaking valve only holds in the safe range shown on the graph. Read the number line, then tell the door how many whole-number settings are safe and the greatest one.',
  scene:{kind:'svg',viewBox:'0 0 400 300',svg:`<rect x="40" y="55" width="320" height="50" rx="10" fill="#1b2150" stroke="#ff9a3d" stroke-width="2"/><text x="200" y="87" text-anchor="middle" fill="#ff9a3d" font-size="17" font-weight="700">⚠ SAFE VALVE SETTINGS</text><line x1="40" y1="152" x2="360" y2="152" stroke="#fff" stroke-width="3"/><line x1="110" y1="152" x2="285" y2="152" stroke="#6ec1ff" stroke-width="8"/><line x1="60" y1="145" x2="60" y2="159" stroke="#fff" stroke-width="2"/><text x="60" y="182" text-anchor="middle" fill="#fff" font-size="14">−5</text><line x1="85" y1="145" x2="85" y2="159" stroke="#fff" stroke-width="2"/><text x="85" y="182" text-anchor="middle" fill="#fff" font-size="14">−4</text><line x1="110" y1="145" x2="110" y2="159" stroke="#fff" stroke-width="2"/><text x="110" y="182" text-anchor="middle" fill="#fff" font-size="14">−3</text><line x1="135" y1="145" x2="135" y2="159" stroke="#fff" stroke-width="2"/><text x="135" y="182" text-anchor="middle" fill="#fff" font-size="14">−2</text><line x1="160" y1="145" x2="160" y2="159" stroke="#fff" stroke-width="2"/><text x="160" y="182" text-anchor="middle" fill="#fff" font-size="14">−1</text><line x1="185" y1="145" x2="185" y2="159" stroke="#fff" stroke-width="2"/><text x="185" y="182" text-anchor="middle" fill="#fff" font-size="14">0</text><line x1="210" y1="145" x2="210" y2="159" stroke="#fff" stroke-width="2"/><text x="210" y="182" text-anchor="middle" fill="#fff" font-size="14">1</text><line x1="235" y1="145" x2="235" y2="159" stroke="#fff" stroke-width="2"/><text x="235" y="182" text-anchor="middle" fill="#fff" font-size="14">2</text><line x1="260" y1="145" x2="260" y2="159" stroke="#fff" stroke-width="2"/><text x="260" y="182" text-anchor="middle" fill="#fff" font-size="14">3</text><line x1="285" y1="145" x2="285" y2="159" stroke="#fff" stroke-width="2"/><text x="285" y="182" text-anchor="middle" fill="#fff" font-size="14">4</text><line x1="310" y1="145" x2="310" y2="159" stroke="#fff" stroke-width="2"/><text x="310" y="182" text-anchor="middle" fill="#fff" font-size="14">5</text><line x1="335" y1="145" x2="335" y2="159" stroke="#fff" stroke-width="2"/><text x="335" y="182" text-anchor="middle" fill="#fff" font-size="14">6</text><circle cx="110" cy="152" r="8" fill="#0b0e20" stroke="#6ec1ff" stroke-width="4"/><circle cx="285" cy="152" r="8" fill="#6ec1ff" stroke="#6ec1ff" stroke-width="4"/><text x="200" y="230" text-anchor="middle" fill="#9aa0c3" font-size="14">open circle = not included, filled = included</text>`},
  title:'Valve Controller',prompt:'<p>The graph shows all safe settings x. Count the integers that are safe, and find the largest.</p>',fields:[{label:'how many integers?',answer:7},{label:'greatest integer =',answer:4}],button:'Set the valve',
  hints:['An open circle means that number is NOT allowed. A filled circle means it IS allowed.','The range is x > −3 and x ≤ 4. List the integers starting at −2.','−2, −1, 0, 1, 2, 3, 4. Count them.'],key:'Safe settings: −3 < x ≤ 4. Integers: −2, −1, 0, 1, 2, 3, 4, which is 7 integers. Greatest is 4.'},
 {name:'The Robot Lab',type:'cipher',stamp:88,letter:'T',
  story:'The curious robot scrambled the pod-bay code with a cipher. A sticky note in this lab holds the shift. Click things to find it.',
  scene:{kind:'emoji',bg:'#0a1230',floor:'#1c2547',items:[{e:'🤖',x:90,y:200,s:64,msg:'The robot beeps: “I did not touch anything.”'},{e:'🔋',x:310,y:205,s:44,clue:`Stuck to the battery:<br>3 − 2x ≤ −9<br>Shift = the smallest whole number x that works`,msg:'A sticky note on the battery pack!'},{e:'🛰️',x:200,y:105,s:50,msg:'A model satellite. Not helpful, just cute.'},{e:'🔧',x:230,y:210,s:36,msg:'A wrench. It has been chewed.'}]},
  plain:'ESCAPE PODS ARE ON DECK NINE',shift:6,answer:'NINE',askLabel:'Which deck?',
  hints:['Click the battery.','Subtract 3 from both sides: −2x ≤ −12.','Divide by −2 and FLIP the sign: x ≥ 6. The smallest whole number that works is the shift.'],key:'3 − 2x ≤ −9 gives −2x ≤ −12, so x ≥ 6. Smallest whole number is 6, so the shift is 6. Message: pods are on deck NINE.'},
 {name:'The Airlock Panels',type:'classify',stamp:12,letter:'O',
  story:'Four airlock panels each show an inequality. Match every one to its solution. Watch out for negative numbers.',
  scene:{kind:'emoji',bg:'#0a1230',floor:'#1c2547',items:[{e:'🚪',x:70,y:150,s:56},{e:'🚪',x:150,y:150,s:56},{e:'🚪',x:230,y:150,s:56},{e:'🚪',x:310,y:150,s:56}],caption:'four airlocks, four solutions'},
  title:'Airlock Panels',prompt:'<p style="color:var(--dim)">Pick the solution for each inequality.</p>',
  items:['−3x < 12','2x + 5 > 13','4 − 2x > 12',`${fr('x','−2')} > −2`],options:['x < −4','x > −4','x < 4','x > 4'],answer:[1,3,0,2],
  hints:['Dividing or multiplying by a NEGATIVE number flips the inequality sign.','Panel 2 is the only one with no negative coefficient. Solve it normally.','Panel 3: subtract 4 first, then divide by −2. Panel 4: multiply both sides by −2.'],key:'1: x > −4 (flip). 2: x > 4. 3: −2x > 8 gives x < −4. 4: multiply by −2 and flip, x < 4.'},
 {name:'The Oxygen Plant',type:'order',stamp:63,letter:'I',
  story:'The oxygen plant restarts when you solve the inequality in the correct order. The robot scrambled the steps again. Sort them out!',
  scene:{kind:'emoji',bg:'#0a1230',floor:'#1c2547',items:[{e:'🌿',x:120,y:180,s:70,msg:'The station garden. Still alive, barely.'},{e:'💨',x:270,y:170,s:60,msg:'Oxygen is escaping. Hurry!'}],caption:'put the steps in order'},
  title:'Solve It In Order',prompt:'<div class="eq">−2(x − 1) + 3 > 9</div><p>Place the steps from first to last.</p>',
  steps:['Distribute the −2: −2x + 2 + 3 &gt; 9','Combine like terms: −2x + 5 &gt; 9','Subtract 5 from both sides: −2x &gt; 4','Divide both sides by −2 and flip the sign: x &lt; −2','Graph: open circle at −2, shade to the left'],
  hints:['Clear the parentheses first.','Combine the plain numbers before moving anything.','Flip the sign at the very moment you divide by a negative. Graph last.'],key:'Distribute, combine (−2x + 5 > 9), subtract 5 (−2x > 4), divide by −2 and flip (x < −2), graph an open circle at −2 shaded left. Check x = −3: 11 > 9.'},
 {name:'The Pod Hatch',type:'fields',stamp:29,letter:'R',ui:'dial',
  story:'The hatch has two dials. Dial A needs the smallest whole number solving the first inequality. Dial B needs the count of integers solving the compound inequality.',
  scene:{kind:'emoji',bg:'#0a1230',floor:'#1c2547',items:[{e:'🛸',x:200,y:170,s:110,msg:'The escape pod. So close.'}],caption:'dial A, then dial B'},
  title:'Hatch Dials',prompt:'<div class="eq">A: 4x − 7 > 2x + 9</div><br><div class="eq">B: −3 < 2y − 1 ≤ 9</div><p>A = smallest whole number x that works. B = how many integers y work.</p>',fields:[{label:'A',answer:9},{label:'B',answer:6}],button:'Open the hatch',
  hints:['For A, get all the x terms on one side first.','A: 2x > 16 gives x > 8. Since 8 itself is NOT allowed, the smallest whole number is next.','For B, add 1 to all three parts, then divide all parts by 2. List the integers.'],key:'A: 2x > 16, x > 8, so smallest whole number is 9. B: −2 < 2y ≤ 10 gives −1 < y ≤ 5, integers 0, 1, 2, 3, 4, 5, so 6.'}
 ]};

const TOTAL=10*60, HINT_COST=90, STAGES=ROOM.stages;
let t=TOTAL, used=0, stage=-1, timer=null, cards=[], hintsShown={}, st={};
const $=s=>document.querySelector(s);
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const caesar=(s,k)=>s.replace(/[A-Z]/g,c=>ALPHA[(ALPHA.indexOf(c)+k+26)%26]);
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function tick(){t--;$('#clock').textContent=fmt(t);$('#clock').classList.toggle('low',t<300);if(t<=0){clearInterval(timer);timeUp()}}
function dots(){$('#dots').innerHTML=STAGES.map((_,i)=>`<div class="dot ${i<stage?'done':''} ${i==stage?'now':''}"></div>`).join('')}
function timeUp(){const el=document.createElement('div');el.className='panel';el.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9;border-color:var(--red)';el.innerHTML='⏰ Time is up! Keep going, but note how long your team takes.<br><button onclick="this.parentNode.remove()">Keep going</button>';document.body.appendChild(el)}
function say(txt,ok){const m=$('#m');m.textContent=txt;m.className='msg '+(ok?'good':'bad');if(!ok){const p=m.closest('.panel');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}}
function getHint(){const s=STAGES[stage];hintsShown[stage]=hintsShown[stage]||0;if(hintsShown[stage]>=s.hints.length)return;t-=HINT_COST;used++;$('#hu').textContent=used;$('#clock').textContent=fmt(t);hintsShown[stage]++;$('#hints').innerHTML=s.hints.slice(0,hintsShown[stage]).map(h=>`<div class="hint">💡 ${h}</div>`).join('')}
function pass(){cards.push({stamp:STAGES[stage].stamp,letter:STAGES[stage].letter});stage++;dots();show()}
/* ---- scenes ---- */
function sceneEmoji(sc){
 const items=(sc.items||[]).map((it,i)=>`<g class="hot" data-i="${i}" onclick="hot(${i})"><text x="${it.x}" y="${it.y}" font-size="${it.s||44}" text-anchor="middle">${it.e}</text></g>`).join('');
 return `<svg class="scene" viewBox="0 0 400 300"><rect width="400" height="300" fill="${sc.bg||'#0b0e20'}"/><rect y="230" width="400" height="70" fill="${sc.floor||'#1b1f3f'}"/>${items}<text x="200" y="292" fill="#9aa0c3" font-size="12" text-anchor="middle">${sc.caption||'(click things to inspect them)'}</text></svg>`}
function hot(i){const it=STAGES[stage].scene.items[i];if(it.clue){const n=$('#note');if(n)n.innerHTML=`<div class="note">${it.clue}</div>`;say(it.msg||'You found something!',true)}else say(it.msg||'Nothing useful here.',true)}
function sceneGrid(sc){
 const W=400,H=sc.h||400,pad=26,ux=(W-2*pad)/(sc.xmax-sc.xmin),uy=(H-2*pad)/(sc.ymax-sc.ymin),u=Math.min(ux,uy);
 const X=x=>pad+(x-sc.xmin)*u,Y=y=>H-pad-(y-sc.ymin)*u,step=(sc.xmax-sc.xmin)>14?2:1;
 let g='';
 for(let x=sc.xmin;x<=sc.xmax;x++){g+=`<line x1="${X(x)}" y1="${Y(sc.ymin)}" x2="${X(x)}" y2="${Y(sc.ymax)}" stroke="#222a55"/>`;if(x%step==0&&x!=0)g+=`<text x="${X(x)}" y="${Y(Math.max(sc.ymin,Math.min(0,sc.ymax)))+13}" fill="#9aa0c3" font-size="10" text-anchor="middle">${x}</text>`}
 for(let y=sc.ymin;y<=sc.ymax;y++){g+=`<line x1="${X(sc.xmin)}" y1="${Y(y)}" x2="${X(sc.xmax)}" y2="${Y(y)}" stroke="#222a55"/>`;if(y%step==0&&y!=0)g+=`<text x="${X(Math.max(sc.xmin,Math.min(0,sc.xmax)))-4}" y="${Y(y)+4}" fill="#9aa0c3" font-size="10" text-anchor="end">${y}</text>`}
 const ax=Math.max(sc.xmin,Math.min(0,sc.xmax)),ay=Math.max(sc.ymin,Math.min(0,sc.ymax));
 g+=`<line x1="${X(ax)}" y1="${Y(sc.ymin)}" x2="${X(ax)}" y2="${Y(sc.ymax)}" stroke="#6a72c0" stroke-width="2"/><line x1="${X(sc.xmin)}" y1="${Y(ay)}" x2="${X(sc.xmax)}" y2="${Y(ay)}" stroke="#6a72c0" stroke-width="2"/>`;
 (sc.polys||[]).forEach(p=>{g+=`<polygon points="${p.pts.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" fill="${p.fill||'none'}" fill-opacity=".25" stroke="${p.color||'#ffc857'}" stroke-width="3"/>`;if(p.label)g+=`<text x="${X(p.lx)}" y="${Y(p.ly)}" fill="${p.color||'#ffc857'}" font-size="13" font-weight="700">${p.label}</text>`});
 (sc.lines||[]).forEach(l=>{g+=`<line x1="${X(l.a[0])}" y1="${Y(l.a[1])}" x2="${X(l.b[0])}" y2="${Y(l.b[1])}" stroke="${l.color||'#ff3d5a'}" stroke-width="4"/>`;if(l.label)g+=`<text x="${X(l.lx)}" y="${Y(l.ly)}" fill="${l.color||'#ff3d5a'}" font-size="13" font-weight="700">${l.label}</text>`});
 (sc.points||[]).forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.color||'#fff'}"/>`;if(p.label)g+=`<text x="${X(p.x)+7}" y="${Y(p.y)-7}" fill="#fff" font-size="13" font-weight="700">${p.label}</text>`});
 return `<svg class="scene" viewBox="0 0 ${W} ${H}">${g}</svg>`}
function scene(s){const sc=s.scene||{kind:'emoji',items:[]};return sc.kind=='grid'?sceneGrid(sc):sc.kind=='svg'?`<svg class="scene" viewBox="${sc.viewBox||'0 0 400 300'}"><rect width="100%" height="100%" fill="#0b0e20"/>${sc.svg}</svg>`:sceneEmoji(sc)}
/* ---- puzzles ---- */
const P={
fields(s){return `<h2>${s.title||'Lock'}</h2><div>${s.prompt}</div><div class="row">${s.fields.map((f,i)=>s.ui=='dial'?`<div class="dialbox"><button onclick="dl(${i},1)">▲</button><div class="num" id="d${i}">0</div><button onclick="dl(${i},-1)">▼</button><small>${f.label}</small></div>`:`<span>${f.label}</span><input id="f${i}" type="number" step="any">`).join('')}<button id="go" onclick="chkFields()">${s.button||'Unlock'}</button></div>`},
classify(s){return `<h2>${s.title||'Panels'}</h2><div>${s.prompt||''}</div>${s.items.map((it,i)=>`<div class="q">${it}</div><div class="sw" id="sw${i}">${s.options.map((o,j)=>`<button onclick="pv(${i},${j})">${o}</button>`).join('')}</div>`).join('')}<button id="go" onclick="chkClass()">${s.button||'Test the code'}</button>`},
order(s){return `<h2>${s.title||'Put in order'}</h2><div>${s.prompt||''}</div><div id="ol"></div><button id="go" onclick="chkOrder()">${s.button||'Lock it in'}</button>`},
cipher(s){return `<h2>${s.title||'The Cipher'}</h2><div id="note"></div><div class="cipher">${caesar(s.plain,s.shift)}</div><div>${s.prompt||'Each letter was moved FORWARD in the alphabet by the shift. Set the decoder to undo it.'}</div><div class="row"><button class="ghost" onclick="sh(-1)">−</button><b id="kk">shift 0</b><button class="ghost" onclick="sh(1)">+</button></div><div class="wheel" id="wheel"></div><div class="cipher" id="dec" style="color:var(--blue)"></div><div class="row">${s.askLabel||'Answer word'}: <input type="text" id="w" maxlength="14"> <button id="go" onclick="chkCipher()">Open</button></div>`}};
function show(){
 if(stage>=STAGES.length){finalStage();return}
 const s=STAGES[stage];st={};
 $('#app').innerHTML=`<main><div class="panel"><h2>Room ${stage+1}: ${s.name}</h2><p class="story">${s.story}</p>${scene(s)}</div><div class="panel">${P[s.type](s)}<div class="msg" id="m"></div><div id="hints"></div><button class="ghost" onclick="getHint()">💡 Hint (−1:30)</button>${stage?`<div style="margin-top:8px">Key cards: ${cards.map(c=>`<span class="card">${c.stamp}</span>`).join('')}</div>`:''}</div></main>`;
 if(s.type=='fields')st.dv=s.fields.map(()=>0);
 if(s.type=='classify')st.pick=s.items.map(()=>-1);
 if(s.type=='order'){let a=s.steps.map((_,i)=>i);do{a.sort(()=>Math.random()-.5)}while(a.every((v,i)=>v==i));st.ord=a;ordDraw()}
 if(s.type=='cipher'){st.k=0;sh(0)}
}
function dl(i,d){st.dv[i]=(st.dv[i]+d+10)%10;$('#d'+i).textContent=st.dv[i]}
function chkFields(){const s=STAGES[stage];const ok=s.fields.every((f,i)=>{const v=s.ui=='dial'?st.dv[i]:parseFloat($('#f'+i).value);const alts=[f.answer].concat(f.alts||[]);return alts.some(a=>Math.abs(v-a)<=(f.tol||1e-9))});ok?pass():say(s.fail||'Locked. Check your work and try again.',false)}
function pv(i,j){st.pick[i]=j;[...$('#sw'+i).children].forEach((b,x)=>b.classList.toggle('on',x==j))}
function chkClass(){const s=STAGES[stage];s.answer.every((a,i)=>st.pick[i]==a)?pass():say(s.fail||'Alarm! At least one answer is wrong.',false)}
function ordDraw(){const s=STAGES[stage];$('#ol').innerHTML=st.ord.map((v,p)=>`<div class="ord"><span class="t">${s.steps[v]}</span><button onclick="mv(${p},-1)">▲</button><button onclick="mv(${p},1)">▼</button></div>`).join('')}
function mv(p,d){const q=p+d;if(q<0||q>=st.ord.length)return;[st.ord[p],st.ord[q]]=[st.ord[q],st.ord[p]];ordDraw()}
function chkOrder(){const s=STAGES[stage];st.ord.every((v,i)=>v==i)?pass():say(s.fail||'Not quite in order. Re-read the logic.',false)}
function sh(d){const s=STAGES[stage];st.k=(st.k+d+26)%26;$('#kk').textContent='shift '+st.k;$('#wheel').textContent='written: '+ALPHA.split('').join(' ')+'\nreal   : '+ALPHA.split('').map(c=>caesar(c,-st.k)).join(' ');$('#dec').textContent=caesar(caesar(s.plain,s.shift),-st.k)}
function chkCipher(){const s=STAGES[stage];$('#w').value.trim().toUpperCase()==s.answer.toUpperCase()?pass():say('Still locked. Check your shift.',false)}
function finalStage(){clearInterval(timer);const sh=[...cards].sort(()=>Math.random()-.5);
 $('#app').innerHTML=`<main style="grid-template-columns:1fr"><div class="panel"><h2>The Final Door</h2><p class="story">${ROOM.finalStory}</p><div>${sh.map(c=>`<span class="card">${c.stamp}<b>${c.letter}</b></span>`).join('')}</div><div class="row">${ROOM.finalAsk} <input type="text" id="w" maxlength="12"> <button id="go" onclick="fin()">Open</button></div><div class="msg" id="m"></div></div></main>`}
function fin(){$('#w').value.trim().toUpperCase()==ROOM.word?victory():say('Nothing happens. Re-check the order of the cards.',false)}
function victory(){$('#app').innerHTML=`<div id="end" class="panel big"><div style="font-size:4rem">${ROOM.endEmoji}</div><h2>You escaped!</h2><p>${ROOM.outro}</p><p>Escape time: <b>${fmt(TOTAL-t)}</b> &nbsp; Hints used: <b>${used}</b></p><button onclick="location.reload()">Play again</button></div>`}
function start(){stage=0;dots();timer=setInterval(tick,1000);show()}
function intro(){$('#app').innerHTML=`<div id="intro" class="panel big"><div style="font-size:3.5rem">${ROOM.endEmoji}</div><h2>${ROOM.title}</h2><p class="story">${ROOM.intro}</p><p>Work as a team. You have <b>10 minutes</b>. Each hint costs 1:30.</p><button onclick="start()">Begin</button></div>`}
if(location.hash=='#key'){$('#key').style.display='block';$('#key').innerHTML='<h2>Teacher answer key</h2>'+STAGES.map((s,i)=>`<p><b>Room ${i+1} (${s.name}):</b> ${s.key}</p>`).join('')+`<p><b>Final:</b> sort stamps ${[...STAGES].sort((a,b)=>a.stamp-b.stamp).map(s=>s.stamp).join(', ')} to spell <b>${ROOM.word}</b>.</p>`}
intro();
</script></body></html>
