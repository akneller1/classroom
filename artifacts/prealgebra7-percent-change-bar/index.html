<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Percent Change Bar Model · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Pre-Algebra (7th)", "unit": "Ratios, Proportions, and Percentages", "title": "Percent Change Bar Model", "intro": "Each bar is split into 10% sections of the amount it starts from. Apply a markup or a discount, then a second change, and watch what each percent is a percent of."});
/* Percent bar model. Original amount A (100%), first change ±p%, optional second change ±q% applied to the NEW amount.
   All bars share one dollar scale so a percent of a bigger amount looks bigger. */
var st = { A: 80, s1: 1, p: 25, two: 0, q: 20, seen: {} };
function after1() { return st.A * (1 + st.s1 * st.p / 100); }
function after2() { return after1() * (1 + st.two * st.q / 100); }
function money(v) { return '$' + (Math.round(v * 100) / 100).toFixed(2); }
function pct(v) { return L.num(v, 2) + '%'; }
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var sA = L.slider(P.panel, { id: 'original-amount', label: 'Original amount (100%)', min: 10, max: 200, step: 5, value: st.A, color: 'blue', format: money, onInput: function (v) { st.A = v; draw(); } });
var c1 = L.chips(P.panel, { label: 'First change', value: st.s1, options: [{ value: 1, label: 'Increase (markup, tax, tip)' }, { value: -1, label: 'Decrease (discount)' }], onChange: function (v) { st.s1 = v; draw(); } });
var sp = L.slider(P.panel, { id: 'first-percent', label: 'First change (percent of the original)', min: 0, max: 100, step: 5, value: st.p, color: 'orange', format: function (v) { return v + '%'; }, onInput: function (v) { st.p = v; draw(); } });
var c2 = L.chips(P.panel, { label: 'Second change (percent of the new amount)', value: st.two, options: [{ value: 0, label: 'None' }, { value: 1, label: 'Then increase' }, { value: -1, label: 'Then decrease' }], onChange: function (v) { st.two = v; sq.el.hidden = !v; draw(); } });
var sq = L.slider(P.panel, { id: 'second-percent', label: 'Second change', min: 0, max: 100, step: 5, value: st.q, color: 'purple', format: function (v) { return v + '%'; }, onInput: function (v) { st.q = v; draw(); } });
sq.el.hidden = true;
var fb = L.feedback(P.panel);
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st.A = 80; st.s1 = 1; st.p = 25; st.two = 0; st.q = 20; sA.set(80, true); sp.set(25, true); sq.set(20, true); c1.set(1, true); c2.set(0, true); sq.el.hidden = true; draw(); });
var ch = L.challenges(P.panel, [
  { text: 'Make a discount where the sale price is 70% of the original. What percent is the discount?', check: function () { return st.seen.sale70; } },
  { text: 'Make a markup that adds exactly $24 to the original price. Find two different ways.', check: function () { return st.seen.add24; } },
  { text: 'Predict, then test: increase by 20%, then decrease by 20%. Are you back to the original?', check: function () { return st.seen.updown; } },
  { text: 'After a 25% increase, find the second change that brings the price exactly back to the original.', check: function () { return st.seen.undo; } },
  { text: 'Find two increases whose percents do <b>not</b> add to 32 but whose total increase is exactly 32%.', check: function () { return st.seen.p32; } }
]);
L.notice(P.below, '<p><b>A percent change is always a percent of the amount you start from.</b> A 25% increase multiplies by 1.25 (100% + 25%); a 30% discount multiplies by 0.70 (100% − 30%).</p>' +
  '<p>In a second change the starting amount is the <b>new</b> amount, so 20% of it is a different number of dollars. That is why +20% then −20% does not get you back: 1.2 × 0.8 = 0.96.</p>' +
  '<p>Percent changes in a row <b>multiply</b>; they do not add. +10% then +20% is 1.1 × 1.2 = 1.32, a 32% increase.</p>');

var W = 640, H = 330, X0 = 20, X1 = 620;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Percent bar model' }, P.stage);
function t(x, y, s, o) { o = o || {}; var e = L.s('text', { x: x, y: y, 'text-anchor': o.anchor || 'start', class: 'g-label', 'font-size': o.size || 14, fill: o.color || null }, svg); e.textContent = s; return e; }
function bar(y, base, amount, label, color, tenColor) {
  /* base = the 100% amount for this bar's ticks; amount = what this bar shows */
  var S = scale;
  var xb = X0 + Math.min(base, amount) * S, xa = X0 + amount * S, xfull = X0 + base * S;
  t(X0, y - 8, label, { color: 'var(--' + color + ')' });
  if (amount >= base) {
    L.s('rect', { x: X0, y: y, width: xfull - X0, height: 34, fill: 'var(--blue-tint)', stroke: 'var(--blue)', 'stroke-width': 2.5 }, svg);
    if (amount > base) L.s('rect', { x: xfull, y: y, width: xa - xfull, height: 34, fill: 'var(--' + tenColor + '-tint)', stroke: 'var(--' + tenColor + ')', 'stroke-width': 2.5 }, svg);
  } else {
    L.s('rect', { x: X0, y: y, width: xa - X0, height: 34, fill: 'var(--blue-tint)', stroke: 'var(--blue)', 'stroke-width': 2.5 }, svg);
    L.s('rect', { x: xa, y: y, width: xfull - xa, height: 34, fill: 'var(--red-tint)', stroke: 'var(--red)', 'stroke-width': 2.5, 'stroke-dasharray': '6 4' }, svg);
  }
  for (var i = 1; i * 10 * base / 100 < Math.max(amount, base) - 1e-9; i++) {
    var x = X0 + i * base / 10 * S;
    L.s('line', { x1: x, x2: x, y1: y + (i % 10 ? 8 : 0), y2: y + (i % 10 ? 26 : 34), stroke: 'var(--ink)', 'stroke-width': i % 5 ? 1 : 2 }, svg);
  }
  t(Math.min(xa, W - 4), y + 52, money(amount) + ' = ' + L.num(amount / base * 100, 2) + '%', { anchor: xa > W - 110 ? 'end' : 'middle', size: 15 });
  if (amount > base + 1e-9) L.s('line', { x1: xfull, x2: xfull, y1: y - 4, y2: y + 38, stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
}
var scale = 1;
var draw = L.scheduler(function () {
  var A = st.A, B = after1(), C = after2();
  var maxAmt = Math.max(A, B, st.two ? C : 0) * 1.04;
  scale = (X1 - X0) / maxAmt;
  svg.innerHTML = ''; svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (st.two ? 330 : 230));
  bar(40, A, A, 'Original: 100% = ' + money(A) + '  (each section is 10% = ' + money(A / 10) + ')', 'blue', 'orange');
  bar(140, A, B, 'After ' + (st.s1 > 0 ? '+' : '−') + st.p + '% of the original: ' + pct(100 + st.s1 * st.p) + ' of ' + money(A), 'ink', 'orange');
  if (st.two) bar(240, B, C, 'Then ' + (st.two > 0 ? '+' : '−') + st.q + '% of ' + money(B) + ' (sections are now 10% of ' + money(B) + ' = ' + money(B / 10) + ')', 'purple', 'purple');
  var m1 = 1 + st.s1 * st.p / 100, m2 = 1 + st.two * st.q / 100;
  var overall = (C / A - 1) * 100;
  read.innerHTML = money(A) + ' × ' + L.num(m1, 2) + (st.two ? ' × ' + L.num(m2, 2) : '') + ' = ' + money(C) +
    '<div class="sub" style="margin-top:6px">' + (st.two ? 'overall: × ' + L.num(m1 * m2, 4) + ' = ' : '') + (overall >= 0 ? 'increase of ' : 'decrease of ') + pct(Math.abs(overall)) + ' from the original</div>';
  if (st.two && st.s1 * st.p + st.two * st.q === 0 && st.p > 0) fb.set('The two percents “cancel” as numbers (' + (st.s1 > 0 ? '+' : '−') + st.p + '% and ' + (st.two > 0 ? '+' : '−') + st.q + '%), but the price ended at ' + money(C) + ', not ' + money(A) + '. The second percent was taken of ' + money(B) + '.', 'warn');
  else if (st.two && Math.abs(C - A) < 1e-9 && st.p > 0) fb.set('Back to exactly ' + money(A) + '. The second change was a different percent because it was a percent of ' + money(B) + '.', 'good');
  else fb.set((st.s1 > 0 ? 'Added ' : 'Took off ') + money(Math.abs(B - A)) + ', which is ' + st.p + '% of ' + money(A) + '.' + (st.two ? ' Then ' + (st.two > 0 ? 'added ' : 'took off ') + money(Math.abs(C - B)) + ', which is ' + st.q + '% of ' + money(B) + '.' : ''), '');
  if (st.s1 < 0 && st.p === 30) st.seen.sale70 = true;
  if (st.s1 > 0 && Math.abs(B - A - 24) < 1e-9) { st.seen.add24w = st.seen.add24w || {}; st.seen.add24w[A + '/' + st.p] = true; if (Object.keys(st.seen.add24w).length >= 2) st.seen.add24 = true; }
  if (st.two && st.p === 20 && st.q === 20 && st.s1 * st.two < 0) st.seen.updown = true;
  if (st.s1 > 0 && st.p === 25 && st.two < 0 && Math.abs(C - A) < 1e-9) st.seen.undo = true;
  if (st.s1 > 0 && st.two > 0 && Math.abs(overall - 32) < 1e-9 && st.p + st.q !== 32) st.seen.p32 = true;
  ch.update();
});
draw();

})();
</script>
</body></html>
