<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light;
  --bg:#eef3fc;--ink:#162640;--blue:#345bd5;--muted:#536782;--line:#d3def2;--navy:#16233f;--amber:#f2a33a;--amberd:#b36b08;--red:#b83a31;--green:#1f7a4d;--amber2:#e4752a;--glow:rgba(242,163,58,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:22px}
header.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:18px;background:var(--navy);color:#fff;border-radius:20px;padding:18px 24px;background-image:radial-gradient(circle at 92% 20%,var(--glow),transparent 40%)}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
h1{font-size:clamp(1.5rem,3.2vw,2.3rem);margin:4px 0 2px;font-family:"Courier New",ui-monospace,monospace;letter-spacing:.02em}
.sub{color:#c8d3ea;margin:0;line-height:1.45}
.pill{display:inline-flex;background:rgba(255,255,255,.12);color:#fff;padding:9px 15px;border-radius:30px;font-weight:700;font-size:.92rem;white-space:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 25px #1c366014;padding:22px}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:20px;align-items:start}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sectionhead h2{font-size:1.15rem;margin:0}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col h3{font-family:"Courier New",monospace;font-size:.95rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--amberd)}
.card{position:relative;display:flex;align-items:center;gap:9px;border:2px solid #d6e0f3;background:#f8faff;border-radius:12px;padding:7px 9px;margin-bottom:7px;font-size:.88rem;line-height:1.25;min-height:50px;transition:all .3s;text-align:left;font:inherit;font-size:.88rem;width:100%;color:var(--ink)}
.card .nm{font-weight:750}.card .rl{font-size:.74rem;color:var(--muted)}
.card svg.av{width:38px;height:38px;flex:none;border-radius:50%}
.card .ic{width:34px;height:34px;flex:none;border-radius:9px;background:#e8eefc;display:grid;place-items:center;font-weight:800;color:var(--blue);font-family:"Courier New",monospace}
.card.cleared{opacity:.5;background:#eceff5;border-style:dashed}
.card.cleared .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#b83a31}
.card.cleared::after{content:"✕";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-weight:900;font-size:.95rem;color:#b83a31}
.card.new{animation:pop .9s ease}

.card.pick{border-color:var(--blue);background:#e7eeff;box-shadow:0 0 0 3px #cfdcff}
button.card{cursor:pointer}
button.card:disabled{cursor:default}
.progress{height:10px;background:#e8eef9;border-radius:20px;overflow:hidden;margin-bottom:14px}
.bar{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));width:0;transition:width .4s}
.skill{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.problem{border-radius:15px;background:#f6f9ff;padding:18px 16px;display:grid;gap:10px}
.instr{font-size:1.05rem;font-weight:650;line-height:1.5}
.display{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:600;text-align:center;padding:4px 0;line-height:1.5}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}

.fr>span:last-child{padding:0 .2em}
.inputlabel{font-size:.9rem;font-weight:750;margin:16px 0 8px;display:block}

.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
button.action{font:inherit;padding:11px 16px;border:1px solid #cedbf1;background:#fff;color:var(--ink);border-radius:10px;font-weight:700;cursor:pointer}
button.action:hover:not(:disabled){background:#eef3ff}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover:not(:disabled){background:#2846b2}
button.amber{background:var(--amber);border-color:var(--amber);color:#2b1a02}
button.amber:hover:not(:disabled){background:#e6932a}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.feedback{min-height:24px;margin-top:12px;font-weight:700;line-height:1.4}

.story p{line-height:1.6;font-size:1.04rem;margin:0 0 12px}

roperties: add the logs of the numerators, subtract the log of the denominator.", "log<sub>3</sub> <span class=\"fr\"><span>6 · 9</span><span>2</span></span> = log<sub>3</sub> 27", "<b>3</b>"]}, {"skill": "Clue 6", "instr": "Evaluate to the nearest thousandth:", "html": "&nbsp;log<sub>3</sub> 20", "answer": {"t": "num", "v": "2.727", "tol": 0.000501}, "hint": "Start here: Change of base: log<sub>3</sub> 20 = <span class=\"fr\"><span>ln 20</span><span>ln 3</span></span>", "steps": ["Change of base: log<sub>3</sub> 20 = <span class=\"fr\"><span>ln 20</span><span>ln 3</span></span>", "≈ <span class=\"fr\"><span>2.9957</span><span>1.0986</span></span>", "<b>2.727</b>"]}, {"skill": "Clue 7", "instr": "Solve for <i>x</i>:", "html": "&nbsp;4<sup>x + 1</sup> = 8<sup>x − 1</sup>", "answer": {"t": "num", "v": "5", "single": 1}, "hint": "Start here: Write both sides with base 2: (2<sup>2</sup>)<sup>x + 1</sup> = (2<sup>3</sup>)<sup>x − 1</sup>", "steps": ["Write both sides with base 2: (2<sup>2</sup>)<sup>x + 1</sup> = (2<sup>3</sup>)<sup>x − 1</sup>", "2<sup>2x + 2</sup> = 2<sup>3x − 3</sup>, so the exponents are equal: 2x + 2 = 3x − 3", "<b>x = 5</b>"]}, {"skill": "Clue 8", "instr": "Solve for <i>x</i> to the nearest thousandth:", "html": "&nbsp;6 · 2<sup>x</sup> = 150", "answer": {"t": "num", "v": "4.644", "tol": 0.000501}, "hint": "Start here: Isolate the power first: divide both sides by 6, so 2<sup>x</sup> = 25", "steps": ["Isolate the power first: divide both sides by 6, so 2<sup>x</sup> = 25", "Take the natural log of both sides: x · ln 2 = ln 25", "<b>x ≈ 4.644</b>"]}, {"skill": "Clue 9", "instr": "Solve for <i>x</i> and check for extraneous solutions:", "html": "&nbsp;log<sub>2</sub> x + log<sub>2</sub>(x − 2) = 3", "answer": {"t": "num", "v": "4", "single": 1}, "hint": "Start here: Product property: log<sub>2</sub>[x(x − 2)] = 3, so x(x − 2) = 2<sup>3</sup> = 8", "steps": ["Product property: log<sub>2</sub>[x(x − 2)] = 3, so x(x − 2) = 2<sup>3</sup> = 8", "x<sup>2</ /* compound inequality answers: parsed into a true/false test for any x, then compared with the key */
function ineqPred(raw){
  const s=String(raw==null?'':raw).toLowerCase().replace(/[−–—]/g,'-').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/=</g,'<=').replace(/=>/g,'>=').replace(/\s+/g,'');
  if(!s) return null;
  const num=t=>{ if(/^[-+]?\d+(\.\d+)?$/.test(t)) return parseFloat(t); const m=t.match(/^([-+]?\d+)\/(\d+)$/); return m&&+m[2]?parseInt(m[1],10)/parseInt(m[2],10):NaN; };
  const clauses=[];
  for(const c of s.split('or')){
    const atoms=[];
    for(const a of c.split('and')){
      const parts=a.split(/(<=|>=|<|>)/);
      if(parts.length<3||parts.length%2===0) return null;
      const ops=[], opd=[];
      for(let i=0;i<parts.length;i++){
        if(i%2){ ops.push(parts[i]); continue; }
        if(parts[i]==='x') opd.push('x'); else { const v=num(parts[i]); if(isNaN(v)) return null; opd.push(v); }
      }
      if(!opd.includes('x')) return null;
      atoms.push({ops,opd});
    }
    clauses.push(atoms);
  }
  return xv=>clauses.some(atoms=>atoms.every(a=>{
    for(let i=0;i<a.ops.length;i++){
      const L=a.opd[i]==='x'?xv:a.opd[i], R=a.opd[i+1]==='x'?xv:a.opd[i+1], o=a.ops[i];
      if(!(o==='<'?L<R:o==='<='?L<=R:o==='>'?L>R:L>=R)) return false;
    }
    return true;
  }));
}
function ineqCheck(raw,A){
  const f=ineqPred(raw);
  if(!f) return {ok:false,parse:true,msg:"I couldn't read that. Write it like 0 < x ≤ 9, or x < -1 or x ≥ 8. You can use the symbol buttons."};
  const g=ineqPred(A.v), bad=[];
  for(let k=-80;k<=80;k++){ const p=k/2; if(f(p)!==g(p)) bad.push(p); }
  if(!bad.length) return {ok:true};
  if(bad.every(Number.isInteger)) return {ok:false,msg:'Close! Check each endpoint: use < or > when the number is NOT included, and <= or >= when it IS included.'};
  const wantOr=A.v.indexOf('or')>=0, gotOr=String(raw).toLowerCase().indexOf('or')>=0;
  if(wantOr&&!gotOr) return {ok:false,msg:'This problem has two separate pieces. Join them with OR.'};
  if(!wantOr&&gotOr) return {ok:false,msg:'Both conditions must be true at the same time. Write one inequality like a < x < b.'};
  if(A.flip) return {ok:false,msg:'Not quite. Remember: multiplying or dividing by a negative number reverses the inequality symbol.'};
  return {ok:false,msg:'Not quite. Check your work and try again.'};
}

    ${CASE.preview?'<div class="pv" id="pv" aria-live="off"></div>':''}
    <p class="hint">${esc(CASE.inputHint)}</p>
    <div class="actions"><button class="action primary" id="check">Check answer</button>${S.miss>=2&&!S.hintShown?'<button class="action" id="hint">Get a hint</button>':''}${S.miss>=4&&!S.stepsShown?'<button class="action" id="steps">Show the steps</button>':''}</div>
    <div class="feedback ${S.msg?'bad':''}" id="fb" role="status" aria-live="polite">${S.msg}</div>
    ${S.hintShown?`<div class="solution"><h3>Hint</h3><div>${q.hint}</div></div>`:''}
    ${S.stepsShown?`<div class="solution"><h3>Worked solution</h3>${q.steps.map(s=>`<div class="st">${s}</div>`).join('')}<p class="hint">Now type the answer to earn the clue.</p></div>`:''}`;
  }
  if(S.phase==='reveal'){
    const cl=CASE.clues[S.i], last=S.i===N-1;
    return `<div class="sectionhead"><h2>Clue ${S.i+1} unlocked</h2></div><div class="progress"><div class="bar" style="width:${(S.i+1)/N*100}%"></div></div>
    <div class="clue"><div class="tag">New evidence</div><p>${esc(cl.text)}</p><div class="eff">${esc(effectText(cl))}</div></div>
    <div class="actions"><button class="action ${last?'amber':'primary'}" id="next">${last?'Make your accusation':'Next problem'}</button></div>`;
  }
  if(S.phase==='accuse'){
    const ok=S.sel.p&&S.sel.l&&S.sel.m;
    return `<div class="sectionhead"><h2>Make your accusation</h2></div>
    <p style="line-height:1.55;margin-top:0">All ${N} clues are in. Look at your case board: tap the one ${esc(CASE.labels.p.toLowerCase().replace(/^the /,'').replace(/s$/,''))}, the one ${esc(CASE.labels.l.toLowerCase().replace(/^the /,'').replace(/s$/,''))} and the one ${esc(CASE.labels.m.toLowerCase().replace(/^the /,'').replace(/s$/,''))} that were <b>not</b> cleared.</p>
    <div class="clue" style="animation:none"><div class="tag">Your accusation</div><p>${accuseLine()}</p></div>
    <div class="actions"><button class="action amber" id="accuse" ${ok?'':'disabled'}>Accuse!</button></div>
    <div class="feedback ${S.msg?'bad':''}" role="status" aria-live="polite">${S.msg}</div>`;
  }
  return '';
}
function accuseLine(){
  const f=(arr,id,ph)=>{const x=arr.find(a=>a.id===id);return x?`<b>${esc(x.name)}</b>`:`<span style="color:var(--muted)">${ph}</span>`;};
  return CASE.accuseTemplate.replace('{p}',f(CASE.suspects,S.sel.p,'(choose a suspect)')).replace('{l}',f(CASE.places,S.sel.l,'(choose a place)')).replace('{m}',f(CASE.methods,S.sel.m,'(choose a method)'));
}
function won(){
  const e=CASE.ending;
  return `<div class="panel win" style="max-width:860px;margin:0 auto"><h2>Case closed!</h2><p style="font-size:1.1rem;line-height:1.6">${e}</p>
  <div class="stats"><div class="stat"><b>${N} of ${N}</b>clues earned</div><div class="stat"><b>${S.tm}</b>wrong tries</div><div class="stat"><b>${S.hn+S.sn}</b>hints and steps used</div></div>
  ${board(false)}
  <div class="actions" style="justify-content:center"><button class="action primary" id="again">Play again</button></div></div>`;
}
function wire(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('start',()=>{S.phase='ask';S.i=0;save();render();});
  on('restart',()=>{if(confirm('Start the case over? Your clues will be cleared.')){reset();S.phase='ask';S.i=0;save();render();}});
  on('again',reset);
  on('check',check);on('hint',()=>{S.hintShown=true;S.hn++;save();render();keepVal();});
  on('steps',()=>{S.stepsShown=true;S.sn++;save();render();});
  on('next',()=>{if(S.i===N-1){S.phase='accuse';S.i=N;}else{S.i++;S.phase='ask';}S.miss=0;S.hintShown=false;S.stepsShown=false;S.msg='';save();render();});
  on('accuse',accuse);
  const inp=$('#ans');if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  document.querySelectorAll('.sym').forEach(b=>b.addEventListener('click',()=>{const i=$('#ans');if(!i)return;const t=b.dataset.sym;const a=i.selectionStart??i.value.length,z=i.selectionEnd??a;const ins=t==='or'?' or ':t;const bk=+(b.dataset.back||0);i.value=i.value.slice(0,a)+ins+i.value.slice(z);i.focus();i.selectionStart=i.selectionEnd=a+ins.length-bk;pv();}));
  if(inp)inp.addEventListener('input',pv);
  document.querySelectorAll('button.card[data-t]').forEach(b=>b.addEventListener('click',()=>{S.sel[b.dataset.t]=b.dataset.id;S.msg='';render();}));
}
function keepVal(){}
function pretty(raw){
  let s=esc(raw);
  s=s.replace(/log_(\d+(?:\.\d+)?|e)/gi,'log<sub>$1</sub>').replace(/log([₀-₉]+)/g,(m,d)=>'log<sub>'+d.split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(c)).join('')+'</sub>');
  s=s.replace(/sqrt/g,'√').replace(/\bpi\b/g,'π').replace(/(\d)-(?=\d)/g,'$1−').replace(/(^|[^\w)])-/g,'$1−');
  s=s.replace(/\^\(([^()]*)\)/g,'<sup>$1</sup>').replace(/\^(−?[\w.]+)/g,'<sup>$1</sup>');
  const tok='(−?\\d+(?:\\.\\d+)?|\\([^()]*\\)|[a-z]+(?:<sub>[^<]*<\\/sub>)?\\s*\\d*)';
  s=s.replace(new RegExp(tok+'\\s*\\/\\s*'+tok,'g'),(m,a,b)=>'<span class="fr"><span>'+a.replace(/^\((.*)\)$/,'$1')+'</span><span>'+b.replace(/^\((.*)\)$/,'$1')+'</span></span>');
  return s;
}
function pv(){const i=$('#ans'),p=$('#pv');if(!i||!p)return;const v=i.value.trim();p.innerHTML=v?'<small>Reads as</small>'+pretty(v):'';}
function check(){
  const i=$('#ans');if(!i)return;const q=CASE.questions[S.i];const r=checkAns(i.value,q.answer);
  if(r.ok){S.phase='reveal';S.msg='';save();render();return;}
  if(r.parse){S.msg=r.msg;const v=i.value;render();$('#ans').value=v;$('#ans').focus();pv();return;}
  S.miss++;S.tm++;S.msg=r.msg;const v=i.value;save();render();$('#ans').value=v;$('#ans').focus();pv();
}
function accuse(){
  const t=CASE.culprit;
  if(S.sel.p===t.p&&S.sel.l===t.l&&S.sel.m===t.m){S.phase='won';save();render();confetti();return;}
  const wrong=[];if(S.sel.p!==t.p)wrong.push(CASE.labels.p.toLowerCase().replace(/^the /,'').replace(/s$/,''));if(S.sel.l!==t.l)wrong.push(CASE.labels.l.toLowerCase().replace(/^the /,'').replace(/s$/,''));if(S.sel.m!==t.m)wrong.push(CASE.labels.m.toLowerCase().replace(/^the /,'').replace(/s$/,''));
  S.tm++;S.msg='Not quite: check your evidence log. At least one choice ('+wrong.join(', ')+') has already been cleared by a clue.';S.sel={p:null,l:null,m:null};save();render();
}
function reset(){S={phase:'intro',i:0,tm:0,hn:0,sn:0,miss:0,hintShown:false,stepsShown:false,sel:{p:null,l:null,m:null},msg:''};try{localStorage.removeItem(KEY);}catch(e){}render();}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#f2a33a','#345bd5','#1f7a4d','#b83a31','#7a3fb0'];for(let k=0;k<70;k++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[k%cols.length];e.style.animationDuration=(2.2+Math.random()*2.4)+'s';e.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(e);}document.body.appendChild(c);setTimeout(()=>c.remove(),6000);}
TeacherSkills.bank(CASE.questions, TeacherSkills.questionLabel, selected=>{
teacherQuestions=new Set(selected);
if(selected.length!==CASE.questions.length){KEY+='|skills|'+JSON.stringify(selected.map(q=>CASE.questions.indexOf(q))); reset();}
render();
}, 'Choose the skills to practice. Evidence for omitted questions is provided automatically so the mystery remains solvable.');
</script>
