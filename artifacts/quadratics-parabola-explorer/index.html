<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parabola Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Algebra 1", "unit": "Quadratic Functions and Equations", "title": "Parabola Explorer", "intro": "Change a, h and k in vertex form and watch the parabola move, flip and stretch. Switch to standard form to see the discriminant at work."});
var st = { mode: 'vertex', a: 1, h: 0, k: 0, A: 1, B: -2, C: -3, seen: {} };
L.tabs(P.stage, [{ id: 'vertex', label: 'Vertex form' }, { id: 'standard', label: 'Standard form' }], function (id) { st.mode = id; build(); draw(); });
var g = L.graph(P.stage, { xmin: -10, xmax: 10, ymin: -10, ymax: 10, width: 600, height: 600, label: 'Parabola' });
L.h('div', { class: 'legend' }, P.stage, '<span><i style="background:var(--ghost)"></i>parent ' + L.V('y') + ' = ' + L.V('x') + '²</span><span><i style="background:var(--blue)"></i>your parabola</span><span><i style="background:var(--orange)"></i>vertex and axis of symmetry</span>');
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var info = L.h('dl', { class: 'kv' }, P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Make the parabola open <b>down</b>.', check: function () { return st.seen.down; } },
  { text: 'Move the vertex to (3, −2).', check: function () { return st.seen.v32; } },
  { text: 'Make it <b>narrower</b> than the parent graph, then <b>wider</b>.', check: function () { return st.seen.narrow && st.seen.wide; } },
  { text: 'In standard form, make a parabola with <b>no</b> ' + L.V('x') + '-intercepts.', check: function () { return st.seen.none; } },
  { text: 'In standard form, make a parabola with exactly <b>one</b> ' + L.V('x') + '-intercept.', check: function () { return st.seen.one; } }
]);
function fa(v) { return L.nice(v, 4); }
function build() {
  ctrl.innerHTML = '';
  if (st.mode === 'vertex') {
    L.slider(ctrl, { id: 'a', label: 'a (stretch and direction)', min: -3, max: 3, step: 0.25, value: st.a, color: 'purple', format: fa, onInput: function (v) { st.a = v; draw(); } });
    L.slider(ctrl, { id: 'h', label: 'h (left or right)', min: -8, max: 8, value: st.h, color: 'orange', format: L.num, onInput: function (v) { st.h = v; draw(); } });
    L.slider(ctrl, { id: 'k', label: 'k (up or down)', min: -8, max: 8, value: st.k, color: 'green', format: L.num, onInput: function (v) { st.k = v; draw(); } });
  } else {
    L.slider(ctrl, { id: 'A', label: 'a', min: -3, max: 3, step: 0.5, value: st.A, color: 'purple', format: fa, onInput: function (v) { st.A = v; draw(); } });
    L.slider(ctrl, { id: 'B', label: 'b', min: -8, max: 8, value: st.B, color: 'orange', format: L.num, onInput: function (v) { st.B = v; draw(); } });
    L.slider(ctrl, { id: 'C', label: 'c', min: -8, max: 8, value: st.C, color: 'green', format: L.num, onInput: function (v) { st.C = v; draw(); } });
  }
}
var draw = L.scheduler(function () {
  g.clear();
  g.fn(function (x) { return x * x; }, { color: 'ghost', width: 3, dash: '8 6' });
  var a, h, k, eq, rows = [];
  if (st.mode === 'vertex') {
    a = st.a; h = st.h; k = st.k;
    eq = L.V('y') + ' = ' + (a === 1 ? '' : a === -1 ? '−' : fa(a)) + L.shift('x', h) + '²' + (k ? (k > 0 ? ' + ' : ' − ') + L.num(Math.abs(k)) : '');
    if (a < 0) st.seen.down = true; if (h === 3 && k === -2) st.seen.v32 = true;
    if (Math.abs(a) > 1) st.seen.narrow = true; if (a !== 0 && Math.abs(a) < 1) st.seen.wide = true;
  } else {
    a = st.A; var b = st.B, c = st.C;
    eq = L.V('y') + ' = ' + L.terms([[a, 'x²'], [b, 'x'], [c, '']]);
    if (a !== 0) { h = -b / (2 * a); k = c - b * b / (4 * a); }
  }
  if (a === 0) {
    g.fn(function (x) { return st.mode === 'vertex' ? st.k : st.B * x + st.C; }, { color: 'blue' });
    read.innerHTML = eq + '<div class="sub c-red" style="margin-top:6px">With ' + L.V('a') + ' = 0 there is no ' + L.V('x') + '² term, so this is a line, not a parabola.</div>';
    info.innerHTML = ''; ch.update(); return;
  }
  g.fn(function (x) { return a * (x - h) * (x - h) + k; }, { color: 'blue' });
  g.line(h, -11, h, 11, { color: 'orange', width: 2, dash: '6 6' });
  g.dot(h, k, { color: 'orange', r: 9, stroke: 'ink', strokeWidth: 3 });
  g.text(h, k, '(' + L.num(h) + ', ' + L.num(k) + ')', { dx: 14, dy: a > 0 ? 22 : -12, color: 'orange' });
  var disc = st.mode === 'standard' ? st.B * st.B - 4 * st.A * st.C : -4 * a * k;
  var roots = [];
  if (disc > 1e-9) { var r = Math.sqrt(disc / (a * a)) / 2; roots = [h - r, h + r]; }
  else if (Math.abs(disc) <= 1e-9) roots = [h];
  roots.forEach(function (z) { g.dot(z, 0, { color: 'green', r: 8 }); });
  var n = roots.length;
  if (st.mode === 'standard') { if (n === 0) st.seen.none = true; if (n === 1) st.seen.one = true; }
  read.innerHTML = eq + '<div class="sub" style="margin-top:6px">opens ' + (a > 0 ? 'up' : 'down') + ' · ' + (Math.abs(a) > 1 ? 'narrower than' : Math.abs(a) < 1 ? 'wider than' : 'same width as') + ' ' + L.V('y') + ' = ' + L.V('x') + '²</div>';
  info.innerHTML = '<dt>Vertex</dt><dd>(' + L.nice(h, 8) + ', ' + L.nice(k, 8) + ')</dd><dt>Axis of symmetry</dt><dd>' + L.V('x') + ' = ' + L.nice(h, 8) + '</dd>' +
    (st.mode === 'standard' ? '<dt>Vertex x from ' + L.frac('−' + L.V('b'), '2' + L.V('a')) + '</dt><dd>' + L.frac(L.num(-st.B), L.num(2 * st.A)) + ' = ' + L.nice(h, 8) + '</dd><dt>Discriminant ' + L.V('b') + '² − 4' + L.V('ac') + '</dt><dd>' + L.num(disc) + (disc > 0 ? ' (positive)' : disc < 0 ? ' (negative)' : ' (zero)') + '</dd>' : '') +
    '<dt>' + L.V('x') + '-intercepts</dt><dd>' + (n ? roots.map(function (z) { return L.nice(z, 8, 2); }).join(' and ') : 'none') + ' (' + n + ')</dd>';
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
