<style>
/* Layout: a single-screen game-show board: scoreboard strip on top, a tile grid, and a full-screen clue card on click.
   Deliberately one dark look (stage lighting), so no light theme. */

/* Layout: a single-screen game-show board — scoreboard strip on top, 3×5 tile grid, full-screen clue card on click.
   Deliberately one dark look (stage lighting), so no light theme. */
:root{
  --stage:#0b1626;      /* page ground */
  --tile:#173a63;       /* clue tile */
  --tile-hi:#215089;    /* tile hover */
  --tile-used:#101f33;  /* answered tile */
  --gold:#f3c24f;       /* point values, highlights */
  --chalk:#eef3f9;      /* main text */
  --muted:#93a8c0;      /* secondary text */
  --line:#2a4466;       /* borders */
  --shade:#62d3bf;      /* number-line solution */
  --shade2:#f08a6c;     /* second ray (for "no solution" picture) */
  --good:#4fcf8a; --bad:#ef6b6b;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #17304f 0%, transparent 70%);}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vw,58px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
h1 .sym{color:var(--gold)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1405}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:var(--chalk);background:#12263f;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Board */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.cat{background:var(--tile);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(17px,2.6vw,28px);line-height:1;
  padding:14px 8px;min-height:78px;border-bottom:3px solid var(--gold)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tile);border-radius:6px;display:flex;align-items:center;justify-content:center;
  height:clamp(64px,11vh,104px);font-family:var(--f-display);font-weight:900;color:var(--gold);font-size:clamp(32px,5.5vw,60px);
  text-shadow:0 3px 0 rgba(0,0,0,.45);transition:background .15s, transform .15s;font-variant-numeric:tabular-nums}
.tile:hover{background:var(--tile-hi);transform:translateY(-2px)}
.tile.used{background:var(--tile-used);color:#3a5579;text-shadow:none;font-size:clamp(16px,2vw,20px);font-family:var(--f-body);font-weight:400}
.tile.used:hover{color:var(--muted)}
.foot{color:var(--muted);font-size:13px;text-align:center}

/* Clue card */
.overlay{position:fixed;inset:0;background:rgba(5,10,18,.86);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.card{background:linear-gradient(180deg,#1b4171,#132f53);border:1px solid #2f5b8f;border-radius:14px;width:min(900px,100%);margin:auto 0;
  padding:22px clamp(16px,4vw,40px) 26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-cat{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:20px;color:var(--muted)}
.card-cat b{color:var(--gold);margin-left:8px}
.prompt{color:var(--muted);font-size:clamp(16px,2vw,20px);text-align:center;margin:0}
.problem{font-size:clamp(26px,5vw,46px);text-align:center;line-height:1.3;padding:8px 0 4px;overflow-x:auto}
.reveal-btn{align-self:center;background:var(--gold);color:#1a1405;border:0;font-weight:700;font-size:18px;padding:12px 28px;border-radius:10px}
.reveal-btn:hover{filter:brightness(1.08)}
.solution{display:flex;flex-direction:column;gap:16px;border-top:1px solid #2f5b8f;padding-top:18px;animation:rise .3s ease}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:6px 14px;text-align:center}
.answer .label{color:var(--gold)}
.answer .m{font-size:clamp(26px,4.5vw,40px);font-weight:700}
.nl{overflow-x:auto;background:#0e223a;border-radius:10px;padding:8px 6px}
.nl svg{display:block;width:100%;min-width:420px;height:auto}
.nl-note{color:var(--muted);font-size:14px;text-align:center;margin:4px 0 2px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:baseline}
ol.steps li::before{content:counter(s);grid-row:span 2;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold);text-align:right}
.say{color:#cfdbe8;font-size:17px}
.step-m{font-size:clamp(20px,3vw,26px);overflow-x:auto;padding:2px 0}
.tip{background:rgba(243,194,79,.1);border:1px solid rgba(243,194,79,.35);border-radius:8px;padding:10px 14px;font-size:16px}
.tip b{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--gold);color:#1a1405;font-weight:700;padding:8px 16px;border-radius:999px;z-index:30}

/* Math typesetting comes from the shared formatter (see FM_CSS) */
.m{font-family:var(--f-body)}
.m i,.problem i,.answer i,.step-m i,.say i,.tip i{font-style:italic;font-family:Georgia,'Times New Roman',serif;font-size:1.06em}
.story{font-size:clamp(18px,2.4vw,24px);line-height:1.45;text-align:center;margin:0 auto;max-width:44ch;color:var(--chalk)}
.figbox{background:#0e223a;border-radius:10px;padding:10px;--fg:#eef3f9;--acc:#62d3bf;--acc2:#f08a6c;--fillc:rgba(98,211,191,.22);--fillc2:rgba(240,138,108,.2);--gridc:rgba(238,243,249,.16);--bgc:#0e223a;color:#eef3f9}
.figbox svg.fig{max-width:min(100%,460px)}
.say .m{font-size:1em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.board{gap:5px}.cat{min-height:64px;padding:8px 4px}}

<script>
/*FM-START*/
/* Math mini-syntax -> HTML.
   <= >= != -> ≤ ≥ ≠     - -> −     * -> ·     -> -> →     ' -> ′
   [[top ; bottom]]       stacked fraction (nestable)
   x^2  x^-3  x^{n+1}     superscript (after ^: optional -, then digits or ONE letter, or a {group})
   x_1  x_{ab}            subscript
   rt{...}  cbrt{...}     square / cube root
   ov{AB}                 overline (segment)
   sys{eq1 ;; eq2}        system of equations with a left brace
   tbl{x&&0&&1 ;; y&&3&&5} horizontal table, rows split by ;; cells by &&
   @{text}                upright text, no formatting
   v{Ipr}                 each letter italic (variable run the automatic rules would treat as a word)
   Single letters are italic variables. 2-4 capital letters are italic point names (AB, ABC)
   except known names (SSS, SAS, ASA, AAS, HL, AA, CPCTC, SOH, CAH, TOA ...). Runs of 2 lowercase
   letters are products of variables (xy) except unit words (cm, ft, in, ln ...). Longer words are upright.
   "or" and "and" become connector words. "pi" becomes π. */
const FM_UPRIGHT_CAPS=new Set(['SSS','SAS','ASA','AAS','HL','AA','SSA','SAA','CPCTC','SOH','CAH','TOA','LL','LA','HA','AAA','NO','IF','OR','AND','II','III','IV','QI','ZPP','FOIL','GCF','LCD','LCM','PEMDAS','SA','RHS','RSH','SOHCAHTOA','AM','PM']);
const FM_UNITS=new Set(['cm','mm','km','ft','in','yd','mi','ln','if','is','no','of','to','at','or','as','by','on','so','up','it','be','we','my','us','am','pm','mph','sq','cu']);
function fmEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmMatch(s,i,open,close){ /* s[i..] starts with open; return index just after the matching close */
  let d=0;
  for(let j=i;j<s.length;){
    if(s.startsWith(open,j)){d++;j+=open.length;}
    else if(s.startsWith(close,j)){d--;j+=close.length;if(d===0)return j;}
    else j++;
  }
  return s.length;
}
function fmSplit(s,sep){ /* split at top level only */
  const out=[];let d=0,b=0,last=0;
  for(let j=0;j<s.length;j++){
    if(s.startsWith('[[',j)){d++;j++;}
    else if(s.startsWith(']]',j)){d--;j++;}
    else if(s[j]==='{')b++;
    else if(s[j]==='}')b--;
    else if(!d&&!b&&s.startsWith(sep,j)){
      if(sep===';'&&(s[j+1]===';'||s[j-1]===';'))continue;
      out.push(s.slice(last,j));last=j+sep.length;j+=sep.length-1;
    }
  }
  out.push(s.slice(last));return out;
}
function fm(s){
  s=String(s);let out='',i=0;const n=s.length;
  const grp=(open)=>{ /* read a {group} starting at s[i]==='{' */
    const e=fmMatch(s,i,'{','}');const inner=s.slice(i+1,e-1);i=e;return inner;};
  while(i<n){
    const c=s[i];
    if(s.startsWith('[[',i)){
      const e=fmMatch(s,i,'[[',']]'),inner=s.slice(i+2,e-2),parts=fmSplit(inner,';');
      out+=`<span class="fr"><span class="fn">${fm(parts[0].trim())}</span><span class="fd">${fm((parts[1]||'').trim())}</span></span>`;i=e;continue;
    }
    if(s.startsWith('rt{',i)){i+=2;out+=`<span class="rt"><span class="rts">√</span><span class="rtc">${fm(grp())}</span></span>`;continue;}
    if(s.startsWith('cbrt{',i)){i+=4;out+=`<span class="rt"><sup class="rti">3</sup><span class="rts">√</span><span class="rtc">${fm(grp())}</span></span>`;continue;}
    if(s.startsWith('v{',i)&&!/[A-Za-z]/.test(s[i-1]||' ')){i+=1;out+=grp().split('').map(ch=>/[A-Za-z]/.test(ch)?`<i>${ch}</i>`:fmEsc(ch)).join('');continue;}
    if(s.startsWith('ov{',i)){i+=2;out+=`<span class="ov">${fm(grp())}</span>`;continue;}
    if(s.startsWith('@{',i)){i+=1;out+=`<span class="tx">${fmEsc(grp())}</span>`;continue;}
    if(s.startsWith('sys{',i)){i+=3;const rows=fmSplit(grp(),';;');
      out+=`<span class="sys"><span class="eqs">${rows.map(r=>`<span>${fm(r.trim())}</span>`).join('')}</span></span>`;continue;}
    if(s.startsWith('tbl{',i)){i+=3;const rows=fmSplit(grp(),';;');
      out+=`<table class="tbl">${rows.map((r,k)=>`<tr>${r.split('&&').map(x=>k?`<td>${fm(x.trim())}</td>`:`<th>${fm(x.trim())}</th>`).join('')}</tr>`).join('')}</table>`.replace(/<tr>(<t[hd]>.*?<\/t[hd]>)/g,(m,a)=>'<tr>'+a.replace(/<td>/,'<th scope="row">').replace(/<\/td>/,'</th>'));continue;}
    if(c==='^'||c==='_'){
      i++;let inner='';
      if(s[i]==='{')inner=grp();
      else{let m=/^-?(?:\d+(?:\.\d+)?|[A-Za-z])/.exec(s.slice(i));if(m){inner=m[0];i+=inner.length;}}
      out+=`<${c==='^'?'sup':'sub'} class="s">${fm(inner)}</${c==='^'?'sup':'sub'}>`;continue;
    }
    if(/[A-Za-z]/.test(c)){
      let m=/^[A-Za-z]+/.exec(s.slice(i))[0];
      /* a trailing digit-free run; handle special words */
      if(m==='or'||m==='and'){out+=`<span class="w">${m}</span>`;}
      else if(m==='pi'){out+='π';}
      else if(m.length===1){out+=`<i>${m}</i>`;}
      else if(FM_UPRIGHT_CAPS.has(m)||FM_UNITS.has(m)){out+=`<span class="tx">${m}</span>`;}
      else if(/^[A-Z]{2,4}$/.test(m)){out+=`<i>${m}</i>`;}
      else if(/^[a-z]{2}$/.test(m)||/^[a-z]{3,4}$/.test(m)&&!/[aeiouy]/.test(m)){out+=m.split('').map(ch=>`<i>${ch}</i>`).join('');}
      else{out+=`<span class="tx">${m}</span>`;}
      i+=m.length;continue;
    }
    if(s.startsWith('<=',i)){out+='≤';i+=2;continue;}
    if(s.startsWith('>=',i)){out+='≥';i+=2;continue;}
    if(s.startsWith('!=',i)){out+='≠';i+=2;continue;}
    if(s.startsWith('->',i)){out+='→';i+=2;continue;}
    if(c==='<'){out+='&lt;';i++;continue;}
    if(c==='>'){out+='&gt;';i++;continue;}
    if(c==='&'){out+='&amp;';i++;continue;}
    if(c==='-'){out+='−';i++;continue;}
    if(c==='*'){out+='·';i++;continue;}
    if(c==="'"){out+='′';i++;continue;}
    if(c==='\n'){out+='<br>';i++;continue;}
    if(c===' '&&s[i+1]===' '){out+='&ensp;';i+=2;continue;}
    out+=c;i++;
  }
  return out;
}
/* plain text with inline math in {{ ... }} */
function inl(s){
  s=String(s);let out='',i=0;
  while(i<s.length){
    const j=s.indexOf('{{',i);
    if(j<0){out+=fmEsc(s.slice(i));break;}
    out+=fmEsc(s.slice(i,j));
    let k=j+2,d=0,end=-1;
    for(;k<s.length;k++){
      if(s[k]==='{')d++;
      else if(s[k]==='}'){if(d===0&&s[k+1]==='}'){end=k;break;}d--;}
    }
    if(end<0){out+=fmEsc(s.slice(j));break;}
    out+=`<span class="m">${fm(s.slice(j+2,end))}</span>`;i=end+2;
  }
  return out;
}

const VALUES = [100,200,300,400,500];
let KEY = "mrk-jeop-triangles-congruence";
document.getElementById("board").style.setProperty("--cols", CATS.length);

/* ---------- State ---------- */
let state = load() || fresh();
function fresh(){ return { used:{} }; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); return s&&s.used?s:null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ---------- Board ---------- */
const $=id=>document.getElementById(id);
function renderBoard(){
  let h=CATS.map(c=>`<div class="cat">${fmEsc(c.name)}</div>`).join("");
  VALUES.forEach((v,r)=>{
    CATS.forEach((c,ci)=>{
      const k=ci+"-"+r, used=state.used[k];
      h+=`<button class="tile ${used?"used":""}" data-k="${k}" aria-label="${fmEsc(c.name)} for ${v}${used?", already played":""}">${used?"review":v}</button>`;
    });
  });
  $("board").innerHTML=h;
}
$("board").addEventListener("click",e=>{ const t=e.target.closest(".tile"); if(t) openClue(t.dataset.k); });

/* ---------- Clue card ---------- */
let current=null, lastFocus=null;
function openClue(k){
  const [ci,r]=k.split("-").map(Number), c=CATS[ci], q=c.qs[r];
  current={k,ci,r,q,v:VALUES[r]}; lastFocus=document.activeElement;
  $("cardCat").innerHTML=`${fmEsc(c.name)}<b>${VALUES[r]}</b>`;
  $("prompt").innerHTML=inl(q.p||"");
  $("story").hidden=!q.s; if(q.s) $("story").innerHTML=inl(q.s);
  $("problem").hidden=!q.q; $("problem").innerHTML=q.q?fm(q.q):"";
  $("figbox").hidden=!q.fig; $("figbox").innerHTML=q.fig?figSvg(q.fig):"";
  $("solution").hidden=true; $("revealBtn").hidden=false;
  $("overlay").hidden=false; $("overlay").scrollTop=0;
  $("revealBtn").focus();
}
function reveal(){
  if(!current||!$("solution").hidden) return;
  const q=current.q;
  let h=`<div class="answer"><span class="label">Answer</span><span class="m" style="font-size:clamp(26px,4.5vw,40px);font-weight:700">${fm(q.a)}</span></div>`;
  if(q.afig) h+=`<div class="figbox">${figSvg(q.afig)}</div>`;
  h+=`<div><div class="label" style="margin-bottom:8px">How to solve it</div><ol class="steps">`+q.steps.map(s=>
    `<li><div class="say">${inl(s.say)}</div>${s.m?`<div class="step-m m">${fm(s.m)}</div>`:"<div></div>"}</li>`).join("")+`</ol></div>`;
  if(q.tip) h+=`<div class="tip"><b>Tip:</b> ${inl(q.tip)}</div>`;
  $("solution").innerHTML=h; $("solution").hidden=false; $("revealBtn").hidden=true;
}
$("revealBtn").addEventListener("click",reveal);
function closeClue(){
  if(!current) return;
  state.used[current.k]=true; save();
  $("overlay").hidden=true; current=null; renderBoard();
  if(lastFocus&&document.body.contains(lastFocus)) lastFocus.focus();
}
$("closeBtn").addEventListener("click",closeClue);
$("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) closeClue(); });
document.addEventListener("keydown",e=>{
  if($("overlay").hidden) return;
  if(e.key==="Escape") closeClue();
  else if((e.key===" "||e.key==="Enter") && $("solution").hidden){ e.preventDefault(); reveal(); }
});

/* ---------- Reset (two-tap confirm) ---------- */
let armed=null;
$("resetBtn").addEventListener("click",()=>{
  if(!armed){ $("resetBtn").textContent="Tap again to reset"; armed=setTimeout(()=>{armed=null;$("resetBtn").textContent="Reset board";},3000); return; }
  clearTimeout(armed); armed=null; $("resetBtn").textContent="Reset board";
  state=fresh(); save(); renderBoard(); toast("Board reset: all tiles are open again");
});
let tt=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1600); }

TeacherSkills.bank(CATS, c=>c.name, selected=>{
if(selected.length!==CATS.length)KEY+='|skills|'+JSON.stringify(selected.map(c=>c.name));
CATS.splice(0,CATS.length,...selected); state=load()||fresh(); save();
document.getElementById("board").style.setProperty("--cols",CATS.length);
renderBoard();
});
</script>
