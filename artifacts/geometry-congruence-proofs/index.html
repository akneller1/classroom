<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangle Congruence Proofs · Geometry</title>
<style>
:root{--navy:#1F3A5F;--teal:#2B8A9E;--bg:#F4F6FB;--ink:#1d2433;--ok:#1e7d43;--bad:#b3261e;--line:#d5dbe6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
header.hero{background:var(--navy);color:#fff;border-radius:16px;padding:16px 20px;border-bottom:6px solid var(--teal);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.kicker{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#BFD7F2;font-weight:700}
h1{margin:.15em 0;font-size:1.7rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.92rem;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}.btn.light{border-color:#fff;background:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.setcode{font-size:.85rem;color:#E8EEF5}
.progress{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--navy)}
.dot.s1{border-color:#7fb3e0}.dot.s2{border-color:#6cc3b5}.dot.s3{border-color:#e0b25c}.dot.s4{border-color:#d9826a}.dot.s5{border-color:#a07cc5}
.dot.cur{outline:3px solid var(--navy);outline-offset:1px}.dot.done{background:#dff3e6}.dot.shown{background:#fde9d6}
.stagebar{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin:6px 0 12px}
.stagebar h2{margin:0;font-size:1.25rem;color:var(--navy)}.stagebar p{margin:0;color:#4a5568}
.grid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;align-items:start}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px}
svg.fig{width:100%;height:auto;display:block;background:#fff}
.gp{margin-top:10px;font-size:1rem;line-height:1.55}.gp b{color:var(--navy)}
.small{font-size:.85rem;color:#4a5568}
table.proof{width:100%;border-collapse:collapse;font-size:1rem}
table.proof th{background:var(--navy);color:#fff;text-align:left;padding:8px}
table.proof td{border:1px solid var(--line);padding:6px;vertical-align:middle;height:52px}
table.proof td.num{width:34px;text-align:center;font-weight:700;color:var(--navy)}
td.st{width:52%}
.slot{min-height:40px;border:2px dashed #9fb0c8;border-radius:8px;padding:8px;cursor:pointer;background:#f8fafd;display:flex;align-items:center}
.slot.filled{border-style:solid;border-color:var(--navy);background:#eef3fa}
.slot.target{background:#fff8dc;border-color:#d4a017}
.fixed{padding:8px;font-weight:500}
td input{width:100%;font-size:1rem;padding:8px;border:1px solid #9fb0c8;border-radius:8px}
tr.good td{background:#effaf2}tr.badrow td{background:#fdf0ef}
.msg{font-size:.82rem;margin-top:4px}.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bank h3{margin:0 0 6px;font-size:.95rem;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #9fb0c8;background:#fff;border-radius:8px;padding:7px 10px;cursor:grab;font-size:.95rem;user-select:none}
.chip.sel{background:#fff1b8;border-color:#d4a017;box-shadow:0 0 0 2px #f3d36b}
.chip.used{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;display:none}
.feedback.good{display:block;background:#dff3e6;color:#14532d}.feedback.bad{display:block;background:#fde8e6;color:#7f1d1d}
.symbols[hidden]{display:none}.symbols{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.symbols button{font-size:1.05rem;min-width:40px;padding:5px 8px;border:1px solid #9fb0c8;border-radius:8px;background:#fff;cursor:pointer}
.legend{font-size:.8rem;color:#4a5568;margin-top:6px}
#summary{display:none}
.teacher{margin-top:18px}.teacher input{padding:7px 9px;border:1px solid #bbb;border-radius:8px;width:110px}
#printArea{display:none}
@media (max-width:860px){.grid,.banks{grid-template-columns:1fr}}
@media print{
  body{background:#fff}.wrap>*:not(#printArea){display:none!important}#printArea{display:block}
  .pp{page-break-inside:avoid;break-inside:avoid;border:1px solid #999;border-radius:8px;padding:10px;margin:0 0 12px}
  .pp .row{display:flex;gap:14px}.pp svg{width:240px;height:auto;flex:none}
  .pp table{width:100%;border-collapse:collapse;font-size:11pt}.pp td,.pp th{border:1px solid #777;padding:4px 6px;height:30px}
  .pp th{background:#eee}.pp .bk{font-size:9.5pt;margin-top:4px}
  .ph{font-size:13pt;font-weight:700;margin:0 0 6px}
}
</style></head>
<body><div class="wrap">
<header class="hero">
  <div><div class="kicker">Geometry · Triangle Congruence</div><h1>Triangle Congruence Proofs</h1>
  <div class="setcode">Set <span id="seedLbl"></span> · 12 proofs from drag-and-drop to written CPCTC</div></div>
  <div class="tools">
    <button class="btn light" id="newSet">↻ New set</button>
    <button class="btn light" id="printWs">🖨 Print worksheet</button>
  </div>
</header>

<nav class="progress" id="progress" aria-label="Proofs"></nav>
<div class="stagebar"><h2 id="stageTitle"></h2><p id="stageHow"></p></div>

<div class="grid">
  <section class="card">
    <svg class="fig" id="fig" viewBox="0 0 400 330" role="img"></svg>
    <label class="small"><input type="checkbox" id="marks"> Mark the given information on the diagram</label>
    <div class="legend">Diagram is drawn accurately from the given information.</div>
    <div class="gp" id="gp"></div>
  </section>
  <section class="card">
    <div class="symbols" id="symbols" hidden>
      <span class="small" style="align-self:center">Insert:</span>
      <button type="button" data-s="≅" title="is congruent to">≅</button><button type="button" data-s="∠" title="angle">∠</button>
      <button type="button" data-s="△" title="triangle">△</button><button type="button" data-s="∥" title="parallel">∥</button><button type="button" data-s="⊥" title="perpendicular">⊥</button>
    </div>
    <table class="proof"><thead><tr><th>#</th><th>Statements</th><th>Reasons</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="banks" id="banks"></div>
    <div class="actions">
      <button class="btn primary" id="check">Check my proof</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="showAns" disabled>Show a correct proof</button>
      <span style="flex:1"></span>
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
    <div class="feedback" id="fb" role="status"></div>
  </section>
</div>

<section class="card" id="summary" style="margin-top:16px"></section>

<section class="card teacher">
  <b>Teacher resources</b> <span class="small">Print the answer key or share this set with students.</span>
  <div id="tlinks" style="margin-top:8px"><button class="btn" id="printKey">🖨 Print answer key</button> <span class="small">Students' link: <a id="shareLink"></a></span></div>
</section>
<div id="printArea"></div>
</div>
<script src="proofs.js"></script>
<script>
(function(){
'use strict';
var P=window.MK_PROOFS, $=function(id){return document.getElementById(id)};
var studentMode=new URLSearchParams(location.search).get('student')==='1';
if(studentMode){document.querySelector('.teacher').hidden=true;$('showAns').hidden=true;}
var seed=Number((location.hash.match(/seed=(\d+)/)||[])[1])||Math.floor(Math.random()*900000)+100000;
var set, cur=0, state=[], sel=null, lastFocus=null;
var STORE='mk-proofs:'+seed+(studentMode?':student':':teacher');

function save(){try{localStorage.setItem(STORE,JSON.stringify({cur:cur,state:state}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.state&&s.state.length===set.length){state=s.state;cur=s.cur||0;return true}}catch(e){}return false}

function init(){
  if(!/seed=/.test(location.hash))history.replaceState(null,'','#seed='+seed);
  set=P.makeSet(seed);STORE='mk-proofs:'+seed+(studentMode?':student':':teacher');
  $('seedLbl').textContent=seed;
  if(!load()){state=set.map(function(p){return {rows:p.rows.map(function(){return {statement:'',reason:''}}),status:'',tries:0}});cur=0}
  render();
}
function blankFor(p){return p.rows.map(function(){return {statement:'',reason:''}})}

/* ---------------- diagram */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function drawFig(p,marks,W,H){
  W=W||400;H=H||330;var pad=34,ks=Object.keys(p.points),xs=ks.map(function(k){return p.points[k][0]}),ys=ks.map(function(k){return p.points[k][1]});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var sc=Math.min((W-2*pad)/(x1-x0||1),(H-2*pad)/(y1-y0||1)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  function T(k){var q=p.points[k];return [ox+(q[0]-x0)*sc,H-(oy+(q[1]-y0)*sc)]}
  var out=[];
  p.segs.forEach(function(s){var a=T(s[0]),b=T(s[1]);out.push('<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#1F3A5F" stroke-width="2.4" stroke-linecap="round"/>')});
  if(marks)out.push(markSvg(p,T));
  var cx=xs.reduce(function(a,b){return a+b},0)/xs.length,cy=ys.reduce(function(a,b){return a+b},0)/ys.length;
  ks.forEach(function(k){
    var q=T(k);
    // label direction: the open direction farthest (in angle) from every segment through this point
    var rays=[];p.segs.forEach(function(sg){var A=T(sg[0]),B=T(sg[1]);
      if(sg[0]===k||sg[1]===k){var o=T(sg[0]===k?sg[1]:sg[0]);rays.push(Math.atan2(o[1]-q[1],o[0]-q[0]))}
      else if(onSeg(p,sg,k)){rays.push(Math.atan2(A[1]-q[1],A[0]-q[0]));rays.push(Math.atan2(B[1]-q[1],B[0]-q[0]))}});
    var gx=q[0]-(ox+(cx-x0)*sc),gy=q[1]-(H-(oy+(cy-y0)*sc)),best=null,bestScore=-1;
    for(var c=0;c<36;c++){var t=c*Math.PI/18,gap=Math.PI;rays.forEach(function(r){var d=Math.abs(Math.atan2(Math.sin(t-r),Math.cos(t-r)));if(d<gap)gap=d});
      var score=gap+0.15*((Math.cos(t)*gx+Math.sin(t)*gy)/(Math.hypot(gx,gy)||1));if(score>bestScore){bestScore=score;best=t}}
    var v=[Math.cos(best),Math.sin(best)];
    out.push('<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4" fill="#1F3A5F"/>');
    out.push('<text x="'+(q[0]+v[0]*17).toFixed(1)+'" y="'+(q[1]+v[1]*17+6).toFixed(1)+'" text-anchor="middle" font-size="18" font-weight="700" font-family="system-ui,Arial" fill="#111">'+k+'</text>');
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+out.join('')+'</svg>';
}
function onSeg(p,s,k){var a=p.points[s[0]],b=p.points[s[1]],x=p.points[k];if(s[0]===k||s[1]===k)return false;return Math.abs(Math.hypot(a[0]-x[0],a[1]-x[1])+Math.hypot(x[0]-b[0],x[1]-b[1])-Math.hypot(a[0]-b[0],a[1]-b[1]))<1e-6}

function markSvg(p,T){
  var out=[],segN=0,angN=0;
  /* place a mark at fraction t along AB, moving it away from crossings and labeled points */
  function spot(A,B,pref){var obs=[];p.segs.forEach(function(sg){var C=T(sg[0]),D=T(sg[1]);var r=(B[0]-A[0])*(D[1]-C[1])-(B[1]-A[1])*(D[0]-C[0]);if(Math.abs(r)<1e-9)return;
      var t=((C[0]-A[0])*(D[1]-C[1])-(C[1]-A[1])*(D[0]-C[0]))/r,u=((C[0]-A[0])*(B[1]-A[1])-(C[1]-A[1])*(B[0]-A[0]))/r;if(t>0.02&&t<0.98&&u>-0.02&&u<1.02)obs.push(t)});
    Object.keys(p.points).forEach(function(k){var X=T(k),L=Math.hypot(B[0]-A[0],B[1]-A[1]),t=((X[0]-A[0])*(B[0]-A[0])+(X[1]-A[1])*(B[1]-A[1]))/(L*L);var dd=Math.abs((X[0]-A[0])*(B[1]-A[1])-(X[1]-A[1])*(B[0]-A[0]))/L;if(t>0.02&&t<0.98&&dd<2)obs.push(t)});
    var L=Math.hypot(B[0]-A[0],B[1]-A[1]),best=pref,bs=-1;[pref,0.5,0.35,0.65,0.25,0.75].forEach(function(t){var g=obs.reduce(function(m,o){return Math.min(m,Math.abs(o-t)*L)},1e9);if(g>=22&&bs<0){best=t;bs=g}});
    if(bs<0){var bg=-1;[0.5,0.35,0.65,0.25,0.75].forEach(function(t){var g=obs.reduce(function(m,o){return Math.min(m,Math.abs(o-t)*L)},1e9);if(g>bg){bg=g;best=t}})}
    return [A[0]+(B[0]-A[0])*best,A[1]+(B[1]-A[1])*best]}
  function ticks(a,b,n){if(Object.keys(p.points).some(function(k){return k!==a&&k!==b&&onSeg(p,[a,b],k)}))return; /* a segment with a labeled point inside it: marks would be ambiguous */
    var A=T(a),B=T(b),m=spot(A,B,0.5),d=[B[0]-A[0],B[1]-A[1]],L=Math.hypot(d[0],d[1]),u=[d[0]/L,d[1]/L],nn=[-u[1],u[0]];
    for(var i=0;i<n;i++){var off=(i-(n-1)/2)*6;var c=[m[0]+u[0]*off,m[1]+u[1]*off];out.push('<line x1="'+(c[0]-nn[0]*7).toFixed(1)+'" y1="'+(c[1]-nn[1]*7).toFixed(1)+'" x2="'+(c[0]+nn[0]*7).toFixed(1)+'" y2="'+(c[1]+nn[1]*7).toFixed(1)+'" stroke="#b23a3a" stroke-width="2"/>')}}
  function arcs(a,v,b,n){var V=T(v),A=T(a),B=T(b);var t1=Math.atan2(A[1]-V[1],A[0]-V[0]),t2=Math.atan2(B[1]-V[1],B[0]-V[0]);var d=Math.atan2(Math.sin(t2-t1),Math.cos(t2-t1));
    for(var i=0;i<n;i++){var r=20+i*5;var s=[V[0]+r*Math.cos(t1),V[1]+r*Math.sin(t1)],e=[V[0]+r*Math.cos(t1+d),V[1]+r*Math.sin(t1+d)];out.push('<path d="M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A'+r+' '+r+' 0 0 '+(d>0?1:0)+' '+e[0].toFixed(1)+' '+e[1].toFixed(1)+'" fill="none" stroke="#2e7d32" stroke-width="2"/>')}}
  function arrow(a,b,n){var A=T(a),B=T(b),m=spot(A,B,0.3),d=[B[0]-A[0],B[1]-A[1]],L=Math.hypot(d[0],d[1]),u=[d[0]/L,d[1]/L],nn=[-u[1],u[0]];
    for(var i=0;i<n;i++){var c=[m[0]+u[0]*(i*8),m[1]+u[1]*(i*8)];out.push('<path d="M'+(c[0]-u[0]*9+nn[0]*7).toFixed(1)+' '+(c[1]-u[1]*9+nn[1]*7).toFixed(1)+' L'+c[0].toFixed(1)+' '+c[1].toFixed(1)+' L'+(c[0]-u[0]*9-nn[0]*7).toFixed(1)+' '+(c[1]-u[1]*9-nn[1]*7).toFixed(1)+'" fill="none" stroke="#7b3fa0" stroke-width="2.4"/>')}}
  p.givens.forEach(function(g){
    if(g.st&&g.st.t==='seg'){segN++;ticks(g.st.a[0],g.st.a[1],segN);ticks(g.st.b[0],g.st.b[1],segN)}
    else if(g.st&&g.st.t==='ang'){angN++;arcs(g.st.a[0],g.st.a[1],g.st.a[2],angN);arcs(g.st.b[0],g.st.b[1],g.st.b[2],angN)}
    else if(g.mark){var m=g.mark;
      if(m.mid){segN++;ticks(m.mid[0],m.mid[1],segN);ticks(m.mid[1],m.mid[2],segN)}
      if(m.bis){angN++;arcs(m.bis[0],m.bis[1],m.bis[3],angN);arcs(m.bis[3],m.bis[1],m.bis[2],angN)}
      if(m.par){arrow(m.par[0][0],m.par[0][1],1);arrow(m.par[1][0],m.par[1][1],1)}
      if(m.par2){arrow(m.par2[0][0],m.par2[0][1],2);arrow(m.par2[1][0],m.par2[1][1],2)}
      if(m.right){var V=T(m.right[1]),A=T(m.right[0]),B=T(m.right[2]);function u(X){var d=[X[0]-V[0],X[1]-V[1]],L=Math.hypot(d[0],d[1]);return [d[0]/L*11,d[1]/L*11]}var a=u(A),b=u(B);out.push('<path d="M'+(V[0]+a[0]).toFixed(1)+' '+(V[1]+a[1]).toFixed(1)+' L'+(V[0]+a[0]+b[0]).toFixed(1)+' '+(V[1]+a[1]+b[1]).toFixed(1)+' L'+(V[0]+b[0]).toFixed(1)+' '+(V[1]+b[1]).toFixed(1)+'" fill="none" stroke="#b23a3a" stroke-width="1.8"/>')}
    }});
  return out.join('');
}

/* ---------------- rendering a proof */
function render(){
  var p=set[cur],st=state[cur],S=P.STAGES[p.stage];
  // progress
  $('progress').innerHTML=set.map(function(q,i){return '<button class="dot s'+q.stage+(i===cur?' cur':'')+(state[i].status==='done'?' done':state[i].status==='shown'?' shown':'')+'" data-i="'+i+'" title="Proof '+(i+1)+' · Stage '+q.stage+(q.cpctc?' · CPCTC':'')+'">'+(i+1)+'</button>'}).join('');
  $('stageTitle').textContent='Proof '+p.n+' of '+set.length+' · Stage '+p.stage+': '+S.title+(p.cpctc&&p.stage<5?' (with CPCTC)':'');
  $('stageHow').textContent=S.how;
  $('marks').checked=st.marks!=null?st.marks:p.stage<=3;
  $('fig').outerHTML='<svg class="fig" id="fig" viewBox="0 0 400 330" role="img" aria-label="'+esc(figAlt(p))+'">'+drawFig(p,$('marks').checked).replace(/^<svg[^>]*>|<\/svg>$/g,'')+'</svg>';
  $('gp').innerHTML='<div><b>Given:</b> '+p.givens.map(function(g){return esc(g.text)}).join('; ')+'</div><div><b>Prove:</b> '+esc(p.proveText)+'</div>';
  var writing=p.stage>=4;
  $('symbols').hidden=!writing;
  var body='';
  p.rows.forEach(function(r,i){
    var model=P.modelRows(p)[i],cell=st.rows[i];
    var sCell,rCell;
    if(writing){sCell='<input data-i="'+i+'" data-f="statement" value="'+esc(cell.statement)+'" aria-label="Statement '+(i+1)+'" autocomplete="off">';rCell='<input data-i="'+i+'" data-f="reason" value="'+esc(cell.reason)+'" aria-label="Reason '+(i+1)+'" autocomplete="off">'}
    else{
      var sFixed=p.stage===2,rFixed=p.stage===1;
      if(sFixed)cell.statement=model.statement;if(rFixed)cell.reason=model.reason;
      sCell=sFixed?'<div class="fixed">'+esc(model.statement)+'</div>':'<div class="slot'+(cell.statement?' filled':'')+'" data-i="'+i+'" data-f="statement" tabindex="0">'+(cell.statement?esc(cell.statement):'<span class="small">Drop a statement</span>')+'</div>';
      rCell=rFixed?'<div class="fixed">'+esc(model.reason)+'</div>':'<div class="slot'+(cell.reason?' filled':'')+'" data-i="'+i+'" data-f="reason" tabindex="0">'+(cell.reason?esc(cell.reason):'<span class="small">Drop a reason</span>')+'</div>';
    }
    body+='<tr id="r'+i+'"><td class="num">'+(i+1)+'</td><td class="st">'+sCell+'<div class="msg" id="m'+i+'"></div></td><td>'+rCell+'</td></tr>';
  });
  $('rows').innerHTML=body;
  // banks
  var bh='';
  if(!writing){
    if(p.stage!==2)bh+='<div class="bank"><h3>Statement bank</h3><div class="chips">'+p.bank.statements.map(function(s){var used=st.rows.some(function(c){return c.statement===s});return '<span class="chip'+(used?' used':'')+'" draggable="true" data-f="statement" data-v="'+esc(s)+'">'+esc(s)+'</span>'}).join('')+'</div></div>';
    if(p.stage!==1)bh+='<div class="bank"><h3>Reason bank <span class="small">(a reason can be used more than once)</span></h3><div class="chips">'+p.bank.reasons.map(function(s){return '<span class="chip" draggable="true" data-f="reason" data-v="'+esc(s)+'">'+esc(s)+'</span>'}).join('')+'</div></div>';
  }
  $('banks').innerHTML=bh;
  $('banks').style.gridTemplateColumns=(p.stage===3)?'1fr 1fr':'1fr';
  $('fb').className='feedback';$('fb').textContent='';
  $('showAns').disabled=!(st.tries>0||st.status);
  $('prev').disabled=cur===0;$('next').textContent=cur===set.length-1?'Finish →':'Next →';
  sel=null;
  if(st.last)paintResult(st.last,true);
  renderSummary();
}
function figAlt(p){return 'Diagram with points '+Object.keys(p.points).join(', ')+'; segments '+p.segs.map(function(s){return s.join('')}).join(', ')+'.'}

/* ---------------- drag, tap, type */
document.addEventListener('click',function(e){
  var d=e.target.closest('.dot');if(d){go(+d.dataset.i);return}
  var chip=e.target.closest('.chip');
  if(chip){if(sel===chip){chip.classList.remove('sel');sel=null;markTargets();return}if(sel)sel.classList.remove('sel');sel=chip;chip.classList.add('sel');markTargets();return}
  var slot=e.target.closest('.slot');
  if(slot){var i=+slot.dataset.i,f=slot.dataset.f;
    if(sel&&sel.dataset.f===f){place(i,f,sel.dataset.v);return}
    if(state[cur].rows[i][f]){state[cur].rows[i][f]='';clearResult();save();render();}
    return}
  var sb=e.target.closest('#symbols button');if(sb){insertSym(sb.dataset.s);return}
});
function markTargets(){document.querySelectorAll('.slot').forEach(function(s){s.classList.toggle('target',!!sel&&s.dataset.f===sel.dataset.f)})}
function place(i,f,v){var rows=state[cur].rows;if(f==='statement')rows.forEach(function(r){if(r.statement===v)r.statement=''});rows[i][f]=v;clearResult();save();render()}
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.chip');if(!c)return;e.dataTransfer.setData('text/plain',JSON.stringify({f:c.dataset.f,v:c.dataset.v}));e.dataTransfer.effectAllowed='copy'});
document.addEventListener('dragover',function(e){var s=e.target.closest&&e.target.closest('.slot');if(s){e.preventDefault();s.classList.add('target')}});
document.addEventListener('dragleave',function(e){var s=e.target.closest&&e.target.closest('.slot');if(s)s.classList.remove('target')});
document.addEventListener('drop',function(e){var s=e.target.closest&&e.target.closest('.slot');if(!s)return;e.preventDefault();try{var d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.f===s.dataset.f)place(+s.dataset.i,d.f,d.v)}catch(x){}});
document.addEventListener('keydown',function(e){var s=e.target.closest&&e.target.closest('.slot');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();s.click()}});
document.addEventListener('input',function(e){var t=e.target;if(t.matches('td input')){state[cur].rows[+t.dataset.i][t.dataset.f]=t.value;save()}});
document.addEventListener('focusin',function(e){if(e.target.matches('td input'))lastFocus=e.target});
function insertSym(s){var t=lastFocus;if(!t)return;var a=t.selectionStart||t.value.length,b=t.selectionEnd||a;t.value=t.value.slice(0,a)+s+t.value.slice(b);t.focus();t.setSelectionRange(a+s.length,a+s.length);state[cur].rows[+t.dataset.i][t.dataset.f]=t.value;save()}

/* ---------------- checking */
function clearResult(){state[cur].last=null}
function paintResult(r,quiet){
  var p=set[cur];
  r.rows.forEach(function(x,i){var tr=$('r'+i),m=$('m'+i);if(!tr)return;tr.className=x.ok?'good':'badrow';m.className='msg '+(x.ok?'good':'bad');m.textContent=x.ok?'✓':x.msg});
  var fb=$('fb');
  if(r.ok){fb.className='feedback good';fb.textContent=state[cur].status==='shown'?'This is a correct proof.':'Correct! Every statement is true, every reason justifies it, and the rows prove '+p.proveText+'.'}
  else{fb.className='feedback bad';fb.textContent=r.correct+' of '+r.rows.length+' rows are right. Fix the rows marked in red and check again.'}
}
$('check').onclick=function(){
  var st=state[cur],p=set[cur];
  var r=P.check(p,st.rows);st.tries++;st.last=r;
  if(r.ok&&st.status!=='shown')st.status='done';
  save();render();
};
$('clear').onclick=function(){state[cur].rows=blankFor(set[cur]);state[cur].last=null;save();render()};
$('showAns').onclick=function(){if(studentMode)return;var st=state[cur];st.rows=P.modelRows(set[cur]);if(st.status!=='done')st.status='shown';st.last=P.check(set[cur],st.rows);save();render()};
$('prev').onclick=function(){go(cur-1)};
$('next').onclick=function(){if(cur<set.length-1)go(cur+1);else{$('summary').scrollIntoView({behavior:'smooth'})}};
$('marks').onchange=function(){state[cur].marks=$('marks').checked;save();render()};
function go(i){if(i<0||i>=set.length)return;cur=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
$('newSet').onclick=function(){seed=Math.floor(Math.random()*900000)+100000;history.replaceState(null,'','#seed='+seed);updateShareLink();init()};
window.addEventListener('hashchange',function(){var s=Number((location.hash.match(/seed=(\d+)/)||[])[1]);if(s&&s!==seed){seed=s;init()}});

function renderSummary(){
  var done=state.filter(function(s){return s.status==='done'}).length,shown=state.filter(function(s){return s.status==='shown'}).length;
  var el=$('summary');if(done+shown===0){el.style.display='none';return}
  el.style.display='block';
  el.innerHTML='<b>Progress:</b> '+done+' of '+set.length+' proofs completed'+(shown?', '+shown+' answer'+(shown>1?'s':'')+' shown':'')+'. '+
    set.map(function(p,i){var s=state[i];return '<span class="small" style="margin-right:10px">#'+(i+1)+' '+(s.status==='done'?'✓'+(s.tries===1?' first try':' ('+s.tries+' checks)'):s.status==='shown'?'shown':'—')+'</span>'}).join('');
}

/* ---------------- printing */
function printSet(key){
  if(key&&studentMode)return;
  var html='<div class="ph">Triangle Congruence Proofs · Set '+seed+(key?' · ANSWER KEY':'')+'</div>'+(key?'':'<div style="margin-bottom:8px">Name: ____________________ &nbsp; Date: __________</div>');
  set.forEach(function(p){
    var model=P.modelRows(p),PT={1:'Fill in the statements (use the statement bank)',2:'Fill in the reasons (use the reason bank)',3:'Statements and reasons (use the banks)',4:'Write the proof (no word bank)',5:'Write a CPCTC proof (no word bank)'};
    html+='<div class="pp"><div class="ph">Proof '+p.n+' · Stage '+p.stage+': '+PT[p.stage]+'</div><div class="row">'+drawFig(p,p.stage<=3,400,330).replace('<svg ','<svg style="width:240px;height:198px" ')+'<div style="flex:1"><div><b>Given:</b> '+p.givens.map(function(g){return esc(g.text)}).join('; ')+'</div><div><b>Prove:</b> '+esc(p.proveText)+'</div>';
    html+='<table><tr><th>#</th><th>Statements</th><th>Reasons</th></tr>'+model.map(function(m,i){var showS=key||p.stage===2,showR=key||p.stage===1;return '<tr><td>'+(i+1)+'</td><td>'+(showS?esc(m.statement):'')+'</td><td>'+(showR?esc(m.reason):'')+'</td></tr>'}).join('')+'</table>';
    if(!key&&p.stage<=3){html+='<div class="bk">'+(p.stage!==2?'<b>Statement bank:</b> '+p.bank.statements.map(esc).join(' &nbsp;|&nbsp; ')+'<br>':'')+(p.stage!==1?'<b>Reason bank:</b> '+p.bank.reasons.map(esc).join(' &nbsp;|&nbsp; '):'')+'</div>'}
    html+='</div></div></div>';
  });
  $('printArea').innerHTML=html;window.print();
}
$('printWs').onclick=function(){printSet(false)};
function updateShareLink(){var url=new URL(location.href);url.searchParams.set('student','1');url.hash='seed='+seed;$('shareLink').href=url.href;$('shareLink').textContent=url.href;}
updateShareLink();
window.addEventListener('hashchange',updateShareLink);
$('printKey').onclick=function(){printSet(true)};

init();
})();
</script>
</body></html>
