<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbreak Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="dashboard">
        <header class="header">
            <h1>OUTBREAK.OS // THREAT LEVEL <span id="level-display">1</span></h1>
        </header>
        
        <div class="main-panel">
            <div class="left-col">
                <div class="briefing-box">
                    <h2>[ MISSION BRIEFING ]</h2>
                    <p id="briefing-text"></p>
                </div>
                
                <div class="input-box">
                    <h2>[ SYSTEM PARAMETERS ]</h2>
                    <div class="formula">y = a &middot; b<sup class="superscript">x</sup></div>
                    <div id="inputs-container"></div>
                    
                    <button id="submit-btn" class="cyber-btn">INITIALIZE SIMULATION</button>
                    <div id="feedback"></div>
                    <button id="next-btn" class="cyber-btn hidden">NEXT PHASE</button>
                </div>
            </div>
            
            <div class="right-col">
                <div class="chart-container">
                    <canvas id="outbreakChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
