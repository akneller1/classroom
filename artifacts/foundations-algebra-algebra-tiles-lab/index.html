<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Algebra Tiles Lab · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Algebra 1", "unit": "Foundations of Algebra", "title": "Algebra Tiles Lab", "intro": "Build expressions with tiles. Matching tiles combine, and a positive tile next to its negative makes a zero pair."});
/* Tiles: x² (big square), x (long bar), 1 (small square). Red tiles are negative. */
var TYPES = { x2: { w: 64, h: 64, name: 'x²', html: L.V('x') + '²' }, x: { w: 64, h: 22, name: 'x', html: L.V('x') }, one: { w: 22, h: 22, name: '1', html: '1' } };
var ORDER = ['x2', 'x', 'one'];
var st = { mode: 'combine', tiles: [], everPair: false, cleared: 0, a: 3, c: 2 };
var uid = 0;
var tabs = L.tabs(P.stage, [{ id: 'combine', label: 'Combine like terms' }, { id: 'dist', label: 'Distributive property' }], function (id) { st.mode = id; build(); draw(); });
var W = 640, H = 470;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Algebra tile mat' }, P.stage);
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var chBox = L.h('div', null, P.panel);
var ch;
function add(type, sign) { st.tiles.push({ id: ++uid, type: type, sign: sign }); if (counts(type).pos && counts(type).neg) st.everPair = true; draw(); }
function counts(type) { var p = 0, n = 0; st.tiles.forEach(function (t) { if (t.type === type) { if (t.sign > 0) p++; else n++; } }); return { pos: p, neg: n }; }
function net(type) { var c = counts(type); return c.pos - c.neg; }
function zeroPairs() {
  var removed = 0;
  ORDER.forEach(function (type) {
    var c = counts(type), k = Math.min(c.pos, c.neg), kp = k, kn = k;
    st.tiles = st.tiles.filter(function (t) { if (t.type !== type) return true; if (t.sign > 0 && kp > 0) { kp--; removed++; return false; } if (t.sign < 0 && kn > 0) { kn--; removed++; return false; } return true; });
  });
  if (removed) st.cleared += removed / 2;
  draw();
}
function exprBuilt() {
  if (!st.tiles.length) return '0';
  var out = '';
  st.tiles.forEach(function (t, i) { var body = t.type === 'one' ? '1' : TYPES[t.type].html; out += (i === 0 ? (t.sign < 0 ? '−' : '') : (t.sign < 0 ? ' − ' : ' + ')) + body; });
  return out;
}
function exprSimple() { return L.terms([[net('x2'), 'x²'], [net('x'), 'x'], [net('one'), '']]); }

function build() {
  ctrl.innerHTML = ''; chBox.innerHTML = '';
  if (st.mode === 'combine') {
    L.h('h2', null, ctrl, 'Add tiles');
    var grid = L.h('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:6px' }, ctrl);
    ORDER.forEach(function (type) {
      L.button(grid, '+ ' + TYPES[type].html, function () { add(type, 1); }, true);
    });
    ORDER.forEach(function (type) {
      var b = L.button(grid, '− ' + TYPES[type].html, function () { add(type, -1); }, true); b.style.color = 'var(--red)';
    });
    var row = L.h('div', { class: 'btn-row' }, ctrl);
    L.button(row, 'Remove zero pairs', zeroPairs);
    L.button(row, 'Clear the mat', function () { st.tiles = []; draw(); }, true);
    L.h('p', { class: 'sub' }, ctrl, 'Tap a tile on the mat to take it off.');
    ch = L.challenges(chBox, [
      { text: 'Build 3' + L.V('x') + ' + 2 with tiles.', check: function () { return counts('x').pos === 3 && counts('x').neg === 0 && counts('one').pos === 2 && counts('one').neg === 0 && !counts('x2').pos && !counts('x2').neg; } },
      { text: 'Put a positive tile and its matching negative tile on the mat together (a <b>zero pair</b>).', check: function () { return st.everPair; } },
      { text: 'Build an expression with at least 4 tiles that is worth exactly 0.', check: function () { return st.tiles.length >= 4 && net('x2') === 0 && net('x') === 0 && net('one') === 0; } },
      { text: 'Build 2' + L.V('x') + ' + 5 − 3' + L.V('x') + ' − 1, then remove the zero pairs. What is left?', check: function () { return st.cleared >= 3 && st.tiles.length === 5 && counts('x').neg === 1 && counts('x').pos === 0 && counts('one').pos === 4; } },
      { text: 'Build ' + L.V('x') + '² − 2' + L.V('x') + ' + 3.', check: function () { return counts('x2').pos === 1 && counts('x').neg === 2 && counts('one').pos === 3 && !counts('x2').neg && !counts('x').pos && !counts('one').neg; } }
    ]);
  } else {
    L.slider(ctrl, { id: 'a', label: 'Number outside the parentheses', min: 1, max: 5, value: st.a, color: 'blue', onInput: function (v) { st.a = v; draw(); } });
    L.slider(ctrl, { id: 'c', label: 'Number inside with x', min: -5, max: 5, value: st.c, color: 'orange', onInput: function (v) { st.c = v; draw(); } });
    L.h('p', { class: 'sub' }, ctrl, 'Each row is one copy of what is inside the parentheses. Count every tile in the rectangle.');
    ch = L.challenges(chBox, [
      { text: 'Show that 3(' + L.V('x') + ' + 2) = 3' + L.V('x') + ' + 6.', check: function () { return st.a === 3 && st.c === 2; } },
      { text: 'Make the number inside negative. What happens to the sign of the constant?', check: function () { return st.c < 0; } },
      { text: 'Build 4(' + L.V('x') + ' − 3).', check: function () { return st.a === 4 && st.c === -3; } },
      { text: 'Find a(' + L.V('x') + ' + c) whose constant is −10.', check: function () { return st.a * st.c === -10; } }
    ]);
  }
}
function tileRect(x, y, t, onClick) {
  var T = TYPES[t.type], neg = t.sign < 0;
  var r = L.s('rect', { x: x, y: y, width: T.w, height: T.h, rx: 4, fill: neg ? 'var(--red-tint)' : (t.type === 'x2' ? 'var(--blue-tint)' : t.type === 'x' ? 'var(--green-tint)' : 'var(--orange-tint)'), stroke: neg ? 'var(--red)' : 'var(--ink)', 'stroke-width': 2.5 }, svg);
  var lbl = L.s('text', { x: x + T.w / 2, y: y + T.h / 2 + 5, 'text-anchor': 'middle', class: 'g-label', 'font-size': t.type === 'one' ? 12 : 15, fill: neg ? 'var(--red)' : 'var(--ink)' }, svg);
  lbl.textContent = (neg ? '−' : '') + T.name;
  if (onClick) { [r, lbl].forEach(function (e) { e.style.cursor = 'pointer'; e.addEventListener('click', onClick); }); r.setAttribute('tabindex', 0); r.setAttribute('role', 'button'); r.setAttribute('aria-label', 'Remove ' + (neg ? 'negative ' : '') + T.name + ' tile'); r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } }); }
}
function text(x, y, str, size, color, anchor) { var t = L.s('text', { x: x, y: y, class: 'g-label', 'font-size': size || 15, fill: color || null, 'text-anchor': anchor || 'start' }, svg); t.textContent = str; return t; }
var draw = L.scheduler(function () {
  svg.innerHTML = '';
  L.s('rect', { x: 2, y: 2, width: W - 4, height: H - 4, rx: 12, fill: 'var(--wash)', stroke: 'var(--line)', 'stroke-width': 2 }, svg);
  if (st.mode === 'combine') {
    var y = 18;
    ORDER.forEach(function (type) {
      var T = TYPES[type], list = st.tiles.filter(function (t) { return t.type === type; }).sort(function (a, b) { return b.sign - a.sign; });
      text(16, y + 16, T.name + ' tiles', 13, 'var(--ink-soft)');
      var x = 16, rowH = T.h, yy = y + 24;
      list.forEach(function (t) {
        if (x + T.w > W - 16) { x = 16; yy += rowH + 8; }
        tileRect(x, yy, t, function () { st.tiles = st.tiles.filter(function (q) { return q.id !== t.id; }); draw(); });
        x += T.w + 8;
      });
      y = yy + rowH + 22;
    });
    if (!st.tiles.length) text(W / 2, H / 2, 'Add tiles with the buttons', 18, 'var(--ink-soft)', 'middle');
    read.innerHTML = '<div class="sub">On the mat</div>' + exprBuilt() + '<div class="sub" style="margin-top:8px">Simplified</div><span class="c-blue">' + exprSimple() + '</span>';
  } else {
    var a = st.a, c = st.c, u = 26, xw = 110, x0 = 120, y0 = 70;
    text(x0, 40, 'Each row: x' + (c ? (c > 0 ? ' + ' : ' − ') + Math.abs(c) : ''), 18, 'var(--ink)');
    text(x0 - 30, y0 + a * (u + 8) / 2 + 4, String(a), 20, 'var(--blue)', 'middle');
    L.s('path', { d: 'M' + (x0 - 14) + ' ' + y0 + ' v ' + (a * (u + 8) - 8), stroke: 'var(--blue)', 'stroke-width': 3 }, svg);
    for (var r = 0; r < a; r++) {
      var yy2 = y0 + r * (u + 8);
      tileRect(x0, yy2 + 2, { type: 'x', sign: 1 });
      for (var k = 0; k < Math.abs(c); k++) tileRect(x0 + 74 + k * (u - 2), yy2 + 2, { type: 'one', sign: c < 0 ? -1 : 1 });
    }
    var yb = y0 + a * (u + 8) + 40;
    text(x0, yb, a + ' rows × 1 x-tile = ' + a + 'x', 17, 'var(--green)');
    text(x0, yb + 28, a + ' rows × ' + (c < 0 ? '(' + c + ')' : c) + ' = ' + (a * c), 17, c < 0 ? 'var(--red)' : 'var(--orange)');
    read.innerHTML = a + '(' + L.V('x') + (c ? (c > 0 ? ' + ' : ' − ') + Math.abs(c) : '') + ') = ' + L.terms([[a, 'x'], [a * c, '']]);
  }
  ch && ch.update();
});
build(); add('x', 1); add('x', 1); add('one', 1);

})();
</script>
</body></html>
