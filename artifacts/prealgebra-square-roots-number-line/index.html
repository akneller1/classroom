<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Square Roots on the Number Line · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Pre-Algebra (8th)", "unit": "Real Numbers and Exponents", "title": "Square Roots on the Number Line", "intro": "A square of area A has side √A. Trap the side between two numbers by squaring them, then zoom in one decimal place at a time."});
/* A square of area A has side √A. Each zoom level traps √A between two neighbors one place value finer,
   by squaring the endpoints. Everything shown is a decimal approximation except for perfect squares. */
var st = { A: 20, zoom: 0, est: null, seen: {} };
function perfect(A) { var r = Math.round(Math.sqrt(A)); return r * r === A; }
/* lower end of the interval of width 10^-k that contains √A, found by exact-ish squaring (integers scaled to avoid float error) */
function lowAt(k) { var s = Math.pow(10, k), n = Math.floor(Math.sqrt(st.A) * s); while ((n + 1) * (n + 1) <= st.A * s * s) n++; while (n * n > st.A * s * s) n--; return n / s; }
function fx(v, k) { return v.toFixed(k); }
function sq(v, k) { return (v * v).toFixed(2 * k); }

var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var sA = L.slider(P.panel, { id: 'square-area', label: 'Area of the square (square units)', min: 1, max: 100, value: st.A, color: 'blue', format: L.num, onInput: function (v) { st.A = v; st.zoom = 0; nA.set(v); draw(); } });
var nA = L.numInput(P.panel, { id: 'area-box', label: 'or type an area (1 to 100)', min: 1, max: 100, step: 1, value: st.A, onChange: function (v) { st.A = Math.round(v); nA.set(st.A); sA.set(st.A, true); st.zoom = 0; draw(); } });
var zr = L.h('div', { class: 'btn-row' }, P.panel);
L.button(zr, '🔍 Zoom in', function () { if (st.zoom < 3) st.zoom++; draw(); });
L.button(zr, 'Zoom out', function () { if (st.zoom > 0) st.zoom--; draw(); }, true);
L.h('h2', null, P.panel, 'Test your own estimate');
var nE = L.numInput(P.panel, { id: 'estimate', label: 'Your estimate of the side length', min: 0, max: 10, step: 'any', value: '', onChange: function (v) { st.est = v; draw(); } });
var fb = L.feedback(P.panel);
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st.A = 20; st.zoom = 0; st.est = null; sA.set(20, true); nA.set(20); nE.set(''); draw(); });
var ch = L.challenges(P.panel, [
  { text: 'Find an area bigger than 50 whose side length is a whole number.', check: function () { return st.A > 50 && perfect(st.A); } },
  { text: 'Choose area 20. Before zooming, predict the two whole numbers its side is between. Then zoom in once to check.', check: function () { return st.A === 20 && st.zoom >= 1; } },
  { text: 'A classmate says √50 = 25 “because half of 50 is 25.” Show where √50 really is, to the nearest tenth.', check: function () { return st.A === 50 && st.zoom >= 1; } },
  { text: 'For an area that is not a perfect square, type an estimate with two decimal places whose square is within 0.05 of the area.', check: function () { return st.seen.est; } },
  { text: 'Zoom all the way in on √2. Does the decimal ever stop? What does zooming show, and what can’t it show?', check: function () { return st.A === 2 && st.zoom === 3; } }
]);
L.notice(P.below, '<p><b>√A is the side length of a square with area A.</b> To place it on the number line, find neighbors whose squares trap A: 4² = 16 &lt; 20 &lt; 25 = 5², so √20 is between 4 and 5. Then do the same with tenths, hundredths, and so on.</p>' +
  '<p>For a perfect square the trapping stops: √49 = 7 exactly. For other whole numbers the decimal never stops and never repeats; √20 is <b>irrational</b>. Every decimal shown is an approximation.</p>' +
  '<p>Zooming shows more digits, but it can’t prove a number is irrational; that takes a different kind of argument. Taking a square root is not dividing by 2.</p>');

var W = 640, H = 420;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Square and number line zoom' }, P.stage);
function t(x, y, s, o) { o = o || {}; var e = L.s('text', { x: x, y: y, 'text-anchor': o.anchor || 'middle', class: o.cls || 'g-label', 'font-size': o.size || 14, fill: o.color || null }, svg); e.textContent = s; return e; }
var draw = L.scheduler(function () {
  var A = st.A, r = Math.sqrt(A), pf = perfect(A);
  svg.innerHTML = ''; svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Math.max(200, 110 + st.zoom * 100));
  /* the square, 18 px per unit, max side 10 */
  var u = 16, sx = 20, sy = 20, side = r * u;
  for (var i = 1; i < Math.ceil(r); i++) { L.s('line', { x1: sx + i * u, x2: sx + i * u, y1: sy, y2: sy + side, stroke: 'var(--line)' }, svg); L.s('line', { y1: sy + i * u, y2: sy + i * u, x1: sx, x2: sx + side, stroke: 'var(--line)' }, svg); }
  L.s('rect', { x: sx, y: sy, width: side, height: side, fill: 'var(--blue-tint)', 'fill-opacity': 0.7, stroke: 'var(--blue)', 'stroke-width': 3 }, svg);
  t(sx + side / 2, sy + side / 2 + 5, 'area ' + A, { size: Math.max(11, Math.min(16, side / 4)) });
  t(sx + side / 2, sy + side + 18, 'side √' + A, { color: 'var(--blue)', size: 14 });
  /* number lines: level 0 (0..10), then zoom levels */
  var X0 = 220, X1 = 620, levels = [];
  levels.push({ lo: 0, hi: 10, k: 0, y: 50, step: 1 });
  for (var k = 1; k <= st.zoom; k++) { var lo = lowAt(k - 1); levels.push({ lo: lo, hi: lo + Math.pow(10, -(k - 1)), k: k, y: 50 + k * 100, step: Math.pow(10, -k) }); }
  levels.forEach(function (lv, li) {
    var X = function (v) { return X0 + (v - lv.lo) / (lv.hi - lv.lo) * (X1 - X0); };
    L.s('line', { x1: X0, x2: X1, y1: lv.y, y2: lv.y, stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
    for (var j = 0; j <= 10; j++) {
      var v = lv.lo + j * lv.step, big = li === 0 || j === 0 || j === 10;
      L.s('line', { x1: X(v), x2: X(v), y1: lv.y - (big ? 9 : 6), y2: lv.y + (big ? 9 : 6), stroke: 'var(--ink)', 'stroke-width': big ? 2.2 : 1.2 }, svg);
      if (li === 0 || j === 0 || j === 10 || (lv.k <= 2 && j % 5 === 0)) t(X(v), lv.y + 26, li === 0 ? String(j) : fx(v, lv.k), { cls: 'g-tick', size: li === 0 ? 13 : 12 });
    }
    if (li > 0) {
      t(X0, lv.y - 16, fx(lv.lo, lv.k - 1 === -1 ? 0 : lv.k - 1) + '² = ' + sq(lv.lo, lv.k - 1), { anchor: 'start', size: 12, color: 'var(--ink-soft)' });
      t(X1, lv.y - 16, fx(lv.hi, lv.k - 1) + '² = ' + sq(lv.hi, lv.k - 1), { anchor: 'end', size: 12, color: 'var(--ink-soft)' });
    }
    if (r >= lv.lo - 1e-12 && r <= lv.hi + 1e-12) L.s('circle', { cx: X(r), cy: lv.y, r: 8, fill: 'var(--orange)', stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
    if (li < levels.length - 1) {
      var nx = levels[li + 1];
      L.s('path', { d: 'M' + X(nx.lo) + ' ' + (lv.y + 10) + ' L' + X0 + ' ' + (nx.y - 28) + ' M' + X(nx.hi) + ' ' + (lv.y + 10) + ' L' + X1 + ' ' + (nx.y - 28), stroke: 'var(--purple)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4', fill: 'none' }, svg);
      L.s('rect', { x: X(nx.lo), y: lv.y - 6, width: Math.max(2, X(nx.hi) - X(nx.lo)), height: 12, fill: 'var(--purple)', opacity: 0.3 }, svg);
    }
  });
  if (st.zoom === 0) t((X0 + X1) / 2, 120, 'Press Zoom in to look between two neighbors.', { size: 14, color: 'var(--ink-soft)' });
  /* readout */
  var lo0 = lowAt(st.zoom), hi0 = lo0 + Math.pow(10, -st.zoom);
  if (pf) read.innerHTML = '√' + A + ' = ' + Math.round(r) + ' exactly<div class="sub" style="margin-top:6px">' + Math.round(r) + '² = ' + A + ': a perfect square, so its square root is rational' + (st.zoom ? ', and zooming finds nothing new.' : '.') + '</div>';
  else if (st.zoom === 0) read.innerHTML = '√' + A + '<div class="sub" style="margin-top:6px">the side of a square with area ' + A + '. Which two whole numbers is it between? Zoom in to check.</div>';
  else read.innerHTML = fx(lo0, st.zoom) + ' &lt; √' + A + ' &lt; ' + fx(hi0, st.zoom) +
    '<div class="sub" style="margin-top:6px">because ' + fx(lo0, st.zoom) + '² = ' + sq(lo0, st.zoom) + ' &lt; ' + A + ' &lt; ' + sq(hi0, st.zoom) + ' = ' + fx(hi0, st.zoom) + '²</div>' +
    '<div class="sub">√' + A + ' ≈ ' + fx(lo0, st.zoom) + '… is irrational: its decimal never ends or repeats, so any decimal is an approximation.</div>';
  if (st.est == null) fb.set('Type an estimate to test it by squaring.');
  else {
    var e = st.est, e2 = e * e, dp = (String(e).split('.')[1] || '').length;
    fb.set(L.num(e, 6) + '² = ' + L.num(e2, 6) + (Math.abs(e2 - A) < 1e-9 ? ' — exactly ' + A + '!' : e2 > A ? ', which is <b>more</b> than ' + A + ': your estimate is too big.' : ', which is <b>less</b> than ' + A + ': your estimate is too small.') +
      ' Off by ' + L.num(Math.abs(e2 - A), 4) + '.', Math.abs(e2 - A) < 0.05 ? 'good' : '');
    if (!pf && dp === 2 && Math.abs(e2 - A) < 0.05) st.seen.est = true;
  }
  ch.update();
});
draw();

})();
</script>
</body></html>
