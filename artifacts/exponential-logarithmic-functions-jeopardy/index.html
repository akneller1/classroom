/* Layout: a single-screen game-show board — scoreboard strip on top, 3×5 tile grid, full-screen clue card on click.
   Deliberately one dark look (stage lighting), so no light theme. */
:root{
  --stage:#0b1626;      /* page ground */
  --tile:#173a63;       /* clue tile */
  --tile-hi:#215089;    /* tile hover */
  --tile-used:#101f33;  /* answered tile */
  --gold:#f3c24f;       /* point values, highlights */
  --chalk:#eef3f9;      /* main text */
  --muted:#93a8c0;      /* secondary text */
  --line:#2a4466;       /* borders */
  --shade:#62d3bf;      /* number-line solution */
  --shade2:#f08a6c;     /* second ray (for "no solution" picture) */
  --good:#4fcf8a; --bad:#ef6b6b;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}

<script>
/*FM-START*/
/* Math mini-syntax -> HTML.
   <= >= != -> ≤ ≥ ≠     - -> −     * -> ·     -> -> →     ' -> ′
   [[top ; bottom]]       stacked fraction (nestable)
   x^2  x^-3  x^{n+1}     superscript (after ^: optional -, then digits or ONE letter, or a {group})
   x_1  x_{ab}            subscript
   rt{...}  cbrt{...}     square / cube root
   ov{AB}                 overline (segment)
   sys{eq1 ;; eq2}        system of equations with a left brace
   tbl{x&&0&&1 ;; y&&3&&5} horizontal table, rows split by ;; cells by &&
   @{text}                upright text, no formatting
   v{Ipr}                 each letter italic (variable run the automatic rules would treat as a word)
   Single letters are italic variables. 2-4 capital letters are italic point names (AB, ABC)
   except known names (SSS, SAS, ASA, AAS, HL, AA, CPCTC, SOH, CAH, TOA ...). Runs of 2 lowercase
   letters are products of variables (xy) except unit words (cm, ft, in, ln ...). Longer words are upright.
   "or" and "and" become connector words. "pi" becomes π. */
const FM_UPRIGHT_CAPS=new Set(['SSS','SAS','ASA','AAS','HL','AA','SSA','SAA','CPCTC','SOH','CAH','TOA','LL','LA','HA','AAA','NO','IF','OR','AND','II','III','IV','QI','ZPP','FOIL','GCF','LCD','LCM','PEMDAS','SA','RHS','RSH','SOHCAHTOA','AM','PM']);
const FM_UNITS=new Set(['cm','mm','km','ft','in','yd','mi','ln','if','is','no','of','to','at','or','as','by','on','so','up','it','be','we','my','us','am','pm','mph','sq','cu']);
function fmEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmMatch(s,i,open,close){ /* s[i..] starts with open; return index just after the matching close */
  let d=0;
  for(let j=i;j<s.length;){
    if(s.startsWith(open,j)){d++;j+=open.length;}
    else if(s.startsWith(close,j)){d--;j+=close.length;if(d===0)return j;}
    else j++;
  }
  return s.length;
}
function fmSplit(s,sep){ /* split at top level only */
  const out=[];let d=0,b=0,last=0;
  for(let j=0;j<s.length;j++){
    if(s.startsWith('[[',j)){d++;j++;}
    else if(s.startsWith(']]',j)){d--;j++;}
    else if(s[j]==='{')b++;
    else if(s[j]==='}')b--;
    else if(!d&&!b&&s.startsWith(sep,j)){
      if(sep===';'&&(s[j+1]===';'||s[j-1]===';'))continue;
      out.push(s.slice(last,j));last=j+sep.length;j+=sep.length-1;
    }
  }
  out.push(s.slice(last));return out;
}
function fm(s){
  s=String(s);let out='',i=0;const n=s.length;
  const grp=(open)=>{ /* read a {group} starting at s[i]==='{' */
    const e=fmMatch(s,i,'{','}');const inner=s.slice(i+1,e-1);i=e;return inner;};
  while(i<n){
    const c=s[i];
    if(s.startsWith('[[',i)){
      const e=fmMatch(s,i,'[[',']]'),inner=s.slice(i+2,e-2),parts=fmSplit(inner,';');
      out+=`<span class="fr"><span class="fn">${fm(parts[0].trim())}</span><span class="fd">${fm((parts[1]||'').trim())}</span></span>`;i=e;continue;
    }
    if(s.startsWith('rt{',i)){i+=2;out+=`<span class="rt"><span class="rts">√</span><span class="rtc">${fm(grp())}</span></span>`;continue;}
    if(s.startsWith('cbrt{',i)){i+=4;out+=`<span class="rt"><sup class="rti">3</sup><span class="rts">√</span><span class="rtc">${fm(grp())}</span></span>`;continue;}
    if(s.startsWith('v{',i)&&!/[A-Za-z]/.test(s[i-1]||' ')){i+=1;out+=grp().split('').map(ch=>/[A-Za-z]/.test(ch)?`<i>${ch}</i>`:fmEsc(ch)).join('');continue;}
    if(s.startsWith('ov{',i)){i+=2;out+=`<span class="ov">${fm(grp())}</span>`;continue;}
    if(s.startsWith('@{',i)){i+=1;out+=`<span class="tx">${fmEsc(grp())}</span>`;continue;}
    if(s.startsWith('sys{',i)){i+=3;const rows=fmSplit(grp(),';;');
      out+=`<span class="sys"><span class="eqs">${rows.map(r=>`<span>${fm(r.trim())}</span>`).join('')}</span></span>`;continue;}
    if(s.startsWith('tbl{',i)){i+=3;const rows=fmSplit(grp(),';;');
      out+=`<table class="tbl">${rows.map((r,k)=>`<tr>${r.split('&&').map(x=>k?`<td>${fm(x.trim())}</td>`:`<th>${fm(x.trim())}</th>`).join('')}</tr>`).join('')}</table>`.replace(/<tr>(<t[hd]>.*?<\/t[hd]>)/g,(m,a)=>'<tr>'+a.replace(/<td>/,'<th scope="row">').replace(/<\/td>/,'</th>'));continue;}
    if(c==='^'||c==='_'){
      i++;let inner='';
      if(s[i]==='{')inner=grp();
      else{let m=/^-?(?:\d+(?:\.\d+)?|[A-Za-z])/.exec(s.slice(i));if(m){inner=m[0];i+=inner.length;}}
      out+=`<${c==='^'?'sup':'sub'} class="s">${fm(inner)}</${c==='^'?'sup':'sub'}>`;continue;
    }
    if(/[A-Za-z]/.test(c)){
      let m=/^[A-Za-z]+/.exec(s.slice(i))[0];
      /* a trailing digit-free run; handle special words */
      if(m==='or'||m==='and'){out+=`<span class="w">${m}</span>`;}
      else if(m==='pi'){out+='π';}
      else if(m.length===1){out+=`<i>${m}</i>`;}
      else if(m==='ln'||m==='log'){out+=`<span class="lg">${m}</span>`;}
      else if(FM_UPRIGHT_CAPS.has(m)||FM_UNITS.has(m)){out+=`<span class="tx">${m}</span>`;}
      else if(/^[A-Z]{2,4}$/.test(m)){out+=`<i>${m}</i>`;}
      else if(/^[a-z]{2}$/.test(m)||/^[a-z]{3,4}$/.test(m)&&!/[aeiouy]/.test(m)){out+=m.split('').map(ch=>`<i>${ch}</i>`).join('');}
      else{out+=`<span class="tx">${m}</span>`;}
      i+=m.length;continue;
    }
    if(s.startsWith('<=',i)){out+='≤';i+=2;continue;}
    if(s.startsWith('>=',i)){out+='≥';i+=2;continue;}
    if(s.startsWith('!=',i)){out+='≠';i+=2;continue;}
    if(s.startsWith('->',i)){out+='→';i+=2;continue;}
    if(c==='<'){out+='&lt;';i++;continue;}
    if(c==='>'){out+='&gt;';i++;continue;}
    if(c==='&'){out+='&amp;';i++;continue;}
    if(c==='-'){out+='−';i++;continue;}
    if(c==='*'){out+='·';i++;continue;}
    if(c==="'"){out+='′';i++;continue;}
    if(c==='\n'){out+='<br>';i++;continue;}
    if(c===' '&&s[i+1]===' '){out+='&ensp;';i+=2;continue;}
    out+=c;i++;
  }
  return out;
}
/* plain text with inline math in {{ ... }} */
function inl(s){
  s=String(s);let out='',i=0;
  while(i<s.length){
    const j=s.indexOf('{{',i);
    if(j<0){out+=fmEsc(s.slice(i));break;}
    out+=fmEsc(s.slice(i,j));
    let k=j+2,d=0,end=-1;
    for(;k<s.length;k++){
      if(s[k]==='{')d++;
      else if(s[k]==='}'){if(d===0&&s[k+1]==='}'){end=k;break;}d--;}
    }
    if(end<0){out+=fmEsc(s.slice(j));break;}
    out+=`<span class="m">${fm(s.slice(j+2,end))}</span>`;i=end+2;
  }
  return out;
}

const VALUES = [100, 200, 300, 400, 500];
let KEY = "mrk-jeop-exponential-logarithmic-functions";
document.getElementById("board").style.setProperty("--cols", CATS.length);

/* ---------- State ---------- */
let state = load() || fresh();
function fresh(){ return { used:{} }; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); return s&&s.used?s:null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ---------- Board ---------- */
const $=id=>document.getElementById(id);
function renderBoard(){
  let h=CATS.map(c=>`<div class="cat">${fmEsc(c.name)}</div>`).join("");
  VALUES.forEach((v,r)=>{
    CATS.forEach((c,ci)=>{
      const k=ci+"-"+r, used=state.used[k];
      h+=`<button class="tile ${used?"used":""}" data-k="${k}" aria-label="${fmEsc(c.name)} for ${v}${used?", already played":""}">${used?"review":v}</button>`;
    });
  });
  $("board").innerHTML=h;
}
$("board").addEventListener("click",e=>{ const t=e.target.closest(".tile"); if(t) openClue(t.dataset.k); });

/* ---------- Clue card ---------- */
let current=null, lastFocus=null;
function openClue(k){
  const [ci,r]=k.split("-").map(Number), c=CATS[ci], q=c.qs[r];
  current={k,ci,r,q,v:VALUES[r]}; lastFocus=document.activeElement;
  $("cardCat").innerHTML=`${fmEsc(c.name)}<b>${VALUES[r]}</b>`;
  $("prompt").innerHTML=inl(q.p||"");
  $("story").hidden=!q.s; if(q.s) $("story").innerHTML=inl(q.s);
  $("problem").hidden=!q.q; $("problem").innerHTML=q.q?fm(q.q):"";
  $("figbox").hidden=!q.fig; $("figbox").innerHTML=q.fig?figSvg(q.fig):"";
  $("solution").hidden=true; $("revealBtn").hidden=false;
  $("overlay").hidden=false; $("overlay").scrollTop=0;
  $("revealBtn").focus();
}
function reveal(){
  if(!current||!$("solution").hidden) return;
  const q=current.q;
  let h=`<div class="answer"><span class="label">Answer</span><span class="m" style="font-size:clamp(26px,4.5vw,40px);font-weight:700">${fm(q.a)}</span></div>`;
  if(q.afig) h+=`<div class="figbox">${figSvg(q.afig)}</div>`;
  h+=`<div><div class="label" style="margin-bottom:8px">How to solve it</div><ol class="steps">`+q.steps.map(s=>
    `<li><div class="say">${inl(s.say)}</div>${s.m?`<div class="step-m m">${fm(s.m)}</div>`:"<div></div>"}</li>`).join("")+`</ol></div>`;
  if(q.tip) h+=`<div class="tip"><b>Tip:</b> ${inl(q.tip)}</div>`;
  $("solution").innerHTML=h; $("solution").hidden=false; $("revealBtn").hidden=true;
}
$("revealBtn").addEventListener("click",reveal);
function closeClue(){
  if(!current) return;
  state.used[current.k]=true; save();
  $("overlay").hidden=true; current=null; renderBoard();
  if(lastFocus&&document.body.contains(lastFocus)) lastFocus.focus();
}
$("closeBtn").addEventListener("click",closeClue);
$("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) closeClue(); });
document.addEventListener("keydown",e=>{
  if($("overlay").hidden) return;
  if(e.key==="Escape") closeClue();
  else if((e.key===" "||e.key==="Enter") && $("solution").hidden){ e.preventDefault(); reveal(); }
});

/* ---------- Reset (two-tap confirm) ---------- */
let armed=null;
$("resetBtn").addEventListener("click",()=>{
  if(!armed){ $("resetBtn").textContent="Tap again to reset"; armed=setTimeout(()=>{armed=null;$("resetBtn").textContent="Reset board";},3000); return; }
  clearTimeout(armed); armed=null; $("resetBtn").textContent="Reset board";
  state=fresh(); save(); renderBoard(); toast("Board reset: all tiles are open again");
});
let tt=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1600); }

TeacherSkills.bank(CATS, c=>c.name, selected=>{
if(selected.length!==CATS.length)KEY+='|skills|'+JSON.stringify(selected.map(c=>c.name));
CATS.splice(0,CATS.length,...selected); state=load()||fresh(); save();
document.getElementById("board").style.setProperty("--cols",CATS.length);
renderBoard();
});
</script>
