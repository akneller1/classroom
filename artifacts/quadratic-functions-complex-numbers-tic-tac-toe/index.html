<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadratic Functions & Complex Numbers Tic-Tac-Toe</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light;--bg:#eef3fc;--ink:#162640;--muted:#536782;--line:#d3def2;--navy:#16233f;--a:#345bd5;--b:#e4752a;--green:#1f7a4d;--red:#b83a31;--gold:#f2a33a}
*{box-sizing:border-box}
sub,sup{line-height:0}
body{margin:0;background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:16px 24px;margin-bottom:16px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(1.5rem,3.2vw,2.2rem);margin:3px 0 0;font-family:"Courier New",ui-monospace,monospace}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 25px #1c366014;padding:22px}
button{font:inherit;font-weight:700;border-radius:11px;border:1px solid #bccbe8;background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer}
button:hover:not(:disabled){background:#eef3ff}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}button.primary:hover:not(:disabled){background:#24365e}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}.fr>span:last-child{padding:0 .2em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.score{display:grid;gap:12px}
.team{border:3px solid var(--line);border-radius:16px;padding:14px;background:#fff;transition:all .25s}
.team.A{--c:var(--a)}.team.B{--c:var(--b)}
.team.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.team .nm{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem}
.team .nm svg{width:28px;height:28px;flex:none}
.team .pts{font-size:2.3rem;font-weight:900;color:var(--c);line-height:1.1;margin-top:4px}
.team .tag{font-size:.8rem;color:var(--muted)}
.turn{text-align:center;font-weight:800;font-size:1.15rem;margin-bottom:12px;min-height:28px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto}
.sq{aspect-ratio:1;border-radius:18px;border:3px solid #cbd8f0;background:#f6f9ff;display:grid;place-items:center;padding:0;font-size:2.4rem;font-weight:900;color:#9fb2d6;position:relative;transition:transform .12s}
.sq:hover:not(:disabled){transform:scale(1.03);background:#eaf1ff;border-color:var(--navy)}
.sq:disabled{opacity:1;cursor:default}
.sq svg{width:62%;height:62%}
.sq.A{background:#e6edff;border-color:var(--a)}.sq.B{background:#ffeede;border-color:var(--b)}
.sq.win{animation:glow .8s ease infinite alternate;border-width:5px}
@keyframes glow{from{box-shadow:0 0 0 0 #f2a33a}to{box-shadow:0 0 0 10px #f2a33a55}}
.sq.drop svg{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.modal{position:fixed;inset:0;background:#0b1530bb;display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.card{background:#fff;border-radius:22px;max-width:640px;width:100%;padding:24px;border-top:10px solid var(--c);box-shadow:0 20px 60px #0008}
.card.A{--c:var(--a)}.card.B{--c:var(--b)}.card.N{--c:var(--navy)}
.card .who{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--c);font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;gap:10px}
.steal{background:#fff3c9;color:#7a4a00;border-radius:9px;padding:4px 10px;font-size:.82rem}
.q .instr{color:var(--muted);margin:0 0 8px;line-height:1.45}
.q .prob{font-size:1.6rem;font-weight:700;margin:6px 0 14px;line-height:1.6;overflow-wrap:anywhere}
.q input{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border:2px solid #bccbe8;border-radius:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font-size:1.25rem;font-weight:600;padding:12px 14px;border:3px solid #cbd8f0;border-radius:14px;background:#f8faff;min-height:64px}
.opt .ltr{flex:none;width:32px;height:32px;border-radius:50%;background:#e1e9fa;display:grid;place-items:center;font-weight:900;font-size:.95rem;color:var(--navy)}
.opt .ot{overflow-wrap:anywhere;line-height:1.5}
.opt.sel{border-color:var(--c);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}.opt.sel .ltr{background:var(--c);color:#fff}
.opt.dead{opacity:.4;text-decoration:line-through;border-style:dashed}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.msg{min-height:22px;margin-top:10px;font-weight:700;color:var(--red);line-height:1.4}
.bar{height:10px;border-radius:6px;background:#e3eaf7;overflow:hidden;margin:2px 0 12px}.bar i{display:block;height:100%;width:100%;background:var(--c)}
.res{font-size:1.3rem;font-weight:900;margin:2px 0 10px}.res.good{color:var(--green)}.res.bad{color:var(--red)}
.sol{background:#fffdf5;border:1px solid #ecdda4;border-radius:13px;padding:12px 14px;margin:10px 0}
.sol div{padding:4px 0;border-top:1px dashed #ecdda4}.sol div:first-child{border-top:0}
.setup label{display:block;font-weight:700;margin:12px 0 4px}
.setup input[type=text]{width:100%;font:inherit;padding:10px 12px;border:2px solid #bccbe8;border-radius:10px}
.setup select{font:inherit;padding:10px;border-radius:10px;border:2px solid #bccbe8}
.rules{background:#f2f6ff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:14px 0}.rules ol{margin:4px 0 0;padding-left:20px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{font-size:2.2rem;font-weight:900;text-align:center;margin:4px 0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:860px){.layout{grid-template-columns:1fr}.score{grid-template-columns:1fr 1fr;order:-1}.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gfx{display:block;margin:4px auto;width:min(100%,360px);height:auto}
</style>
<script src="../../worksheet-generator/games/skill-setup.js?v=student-skills-2"></script>
</head>

o find the vertex of the parabola. Write the vertex as an ordered pair.", "html": "<i>y</i> = 2<i>x</i><sup>2</sup> + 6<i>x</i> + 1", "steps": ["Factor 2 out of the <i>x</i>-terms: <i>y</i> = 2(<i>x</i><sup>2</sup> + 3<i>x</i>) + 1.", "Half of 3 is <span class=\"fr\"><span>3</span><span>2</span></span>, and (<span class=\"fr\"><span>3</span><span>2</span></span>)<sup>2</sup> = <span class=\"fr\"><span>9</span><span>4</span></span>. Adding <span class=\"fr\"><span>9</span><span>4</span></span> inside the parentheses really adds 2 · <span class=\"fr\"><span>9</span><span>4</span></span> = <span class=\"fr\"><span>9</span><span>2</span></span>, so subtract <span class=\"fr\"><span>9</span><span>2</span></span> outside: <i>y</i> = 2(<i>x</i><sup>2</sup> + 3<i>x</i> + <span class=\"fr\"><span>9</span><span>4</span></span>) + 1 − <span class=\"fr\"><span>9</span><span>2</span></span>.", "<i>y</i> = 2(<i>x</i> + <span class=\"fr\"><span>3</span><span>2</span></span>)<sup>2</sup> − <span class=\"fr\"><span>7</span><span>2</span></span>, so the vertex is (−<span class=\"fr\"><span>3</span><span>2</span></span>, −<span class=\"fr\"><span>7</span><span>2</span></span>)"], "options": [{"h": "(−<span class=\"fr\"><span>3</span><span>2</span></span>, −<span class=\"fr\"><span>7</span><span>2</span></span>)", "ok": true}, {"h": "(<span class=\"fr\"><span>3</span><span>2</span></span>, −<span class=\"fr\"><span>7</span><span>2</span></span>)", "ok": false}, {"h": "(−<span class=\"fr\"><span>3</span><span>2</span></span>, −<span class=\"fr\"><span>5</span><span>4</span></span>)", "ok": false}, {"h": "(−3, 1)", "ok": false}]}, {"instr": "Solve with the quadratic formula. Give the exact solutions in simplest radical form.", "html": "3<i>x</i><sup>2</sup> − 6<i>x</i> − 2 = 0", "steps": ["Here <i>a</i> = 3, <i>b</i> = −6 and <i>c</i> = −2. The discriminant is <i>b</i><sup>2</sup> − 4<i>a</i><i>c</i> = (−6)<sup>2</sup> − 4(3)(−2) = 36 + 24 = 60.", "<i>x</i> = <span class=\"fr\"><span>−(−6) ± √60</span><span>2(3)</span></span> = <span class=\"fr\"><span>6 ± √60</span><span>6</span></span>. Simplify √60 = √4 · √15 = 2√15, so <i>x</i> = <span class=\"fr\"><span>6 ± 2√15</span><span>6</span></span>.", "Divide every term in the numerator and the denominator by 2: <i>x</i> = <span class=\"fr\"><span>3 ± √15</span><span>3</span></span>"], "options": [{"h": "<i>x</i> = <span class=\"fr\"><span>3 ± √15</span><span>3</span></span>", "ok": true}, {"h": "<i>x</i> = <span class=\"fr\"><span>3 ± √3</span><span>3</span></span>", "ok": false}, {"h": "<i>x</i> = 6 ± <span class=\"fr\"><span>√15</span><span>3</span></span>", "ok": false}, {"h": "<i>x</i> = <span class=\"fr\"><span>6 ± 2√15</span><span>3</span></span>", "ok": false}]}, {"instr": "Use the discriminant to decide how many solutions the equation has and whether they are real or complex.", "html": "4<i>x</i><sup>2</sup> − 12<i>x</i> + 9 = 0", "steps": ["Here <i>a</i> = 4, <i>b</i> = −12 and <i>c</i> = 9. Square <i>b</i> first: (−12)<sup>2</sup> = 144, not −144.", "<i>b</i><sup>2</sup> − 4<i>a</i><i>c</i> = 144 − 4(4)(9) = 144 − 144 = 0.", "A discriminant of 0 means the two solutions are the same real number: one real solution (a repeated root)"], "options": [{"h": "one real solution (a repeated root)", "ok": true}, {"h": "two real solutions", "ok": false}, {"h": "two complex solutions", "ok": false}, {"h": "no solutions", "ok": false}]}, {"instr": "Write the expression in <b>a + bi</b> form.", "html": "(3 − 2<i>i</i>)(4 + 5<i>i</i>) + <i>i</i><sup>27</sup>", "steps": ["Multiply with FOIL: 12 + 15<i>i</i> − 8<i>i</i> − 10<i>i</i><sup>2</sup>. Since <i>i</i><sup>2</sup> = −1, the last term is +10, so the product is 22 + 7<i>i</i>.", "Powers of <i>i</i> repeat every 4: <i>i</i><sup>27</sup> = <i>i</i><sup>24 + 3</sup> = (<i>i</i><sup>4</sup>)<sup>6</sup> · <i>i</i><sup>3</sup> = −<i>i</i>.", "(22 + 7<i>i</i>) + (−<i>i</i>) = 22 + 6<i>i</i>"], "options": [{"h": "22 + 6<i>i</i>", "ok": true}, {"h": "22 + 8<i>i</i>", "ok": false}, {"h": "21 + 7<i>i</i>", "ok": false}, {"h": "2 + 6<i>i</i>", "ok": false}]}, {"instr": "Divide. Write the quotient in <b>a + bi</b> form with real and imaginary parts as fractions.", "html": "<span class=\"fr\"><span>7 + <i>i</i></span><span>2 − 3<i>i</i></span></span>", "steps": ["Multiply the top and bottom by the conjugate of the denominator, 2 + 3<i>i</i>: <span class=\"fr\"><span>(7 + <i>i</i>)(2 + 3<i>i</i>)</span><span>(2 − 3<i>i</i>)(2 + 3<i>i</i>)</span></span>.", "Top: 14 + 21<i>i</i> + 2<i>i</i> + 3<i>i</i><sup>2</sup> = 11 + 23<i>i</i>. Bottom: 4 − 9<i>i</i><sup>2</sup> = 4 + 9 = 13.", "<span class=\"fr\"><span>11 + 23<i>i</i></span><span>13</span></span> = <span class=\"fr\"><span>11</span><span>13</span></span> + <span class=\"fr\"><span>23</span><span>13</span></span><i>i</i>"], "options": [{"h": "<span class=\"fr\"><span>11</span><span>13</span></span> + <span class=\"fr\"><span>23</span><span>13</span></span><i>i</i>", "ok": true}, {"h": "−<span class=\"fr\"><span>11</span><span>5</span></span> − <span class=\"fr\"><span>23</span><span>5</span></span><i>i</i>", "ok": false}, {"h": "<span class=\"fr\"><span>11</span><span>13</span></span> + 23<i>i</i>", "ok": false}, {"h": "<span class=\"fr\"><span>17</span><span>13</span></span> − <span class=\"fr\"><span>19</span><span>13</span></span><i>i</i>", "ok": false}]}, {"instr": "Solve over the complex numbers. Write both solutions in <b>a + bi</b> form.", "html": "2<i>x</i><sup>2</sup> + 4<i>x</i> + 5 = 0", "steps": ["<i>a</i> = 2, <i>b</i> = 4, <i>c</i> = 5. The discriminant is 4<sup>2</sup> − 4(2)(5) = 16 − 40 = −24.", "<i>x</i> = <span class=\"fr\"><span>−4 ± √(−24)</span><span>4</span></span>. Since √(−24) = <i>i</i>√24 = 2<i>i</i>√6, <i>x</i> = <span class=\"fr\"><span>−4 ± 2<i>i</i>√6</span><span>4</span></span>.", "Divide each term by 4 (the 4 and the 2 both reduce): <i>x</i> = −1 ± <span class=\"fr\"><span>√6</span><span>2</span></span><i>i</i>"], "options": [{"h": "<i>x</i> = nd (5, 6)"], "options": [{"h": "(1, −2) and (5, 6)", "ok": true}, {"h": "(−1, −6) and (−5, −14)", "ok": false}, {"h": "(5, 6)", "ok": false}, {"h": "(−2, 1) and (6, 5)", "ok": false}]}, {"instr": "Solve the inequality. Write your answer in interval notation.", "html": "2<i>x</i><sup>2</sup> − 5<i>x</i> − 3 ≤ 0", "steps": ["Find the boundary points: 2<i>x</i><sup>2</sup> − 5<i>x</i> − 3 = (2<i>x</i> + 1)(<i>x</i> − 3) = 0, so <i>x</i> = −<span class=\"fr\"><span>1</span><span>2</span></span> or <i>x</i> = 3.", "The parabola opens upward (the <i>x</i><sup>2</sup> coefficient 2 is positive), so it is at or below the <i>x</i>-axis between the two roots.", "The inequality is ≤, so both endpoints are included: [−<span class=\"fr\"><span>1</span><span>2</span></span>, 3]"], "options": [{"h": "[−<span class=\"fr\"><span>1</span><span>2</span></span>, 3]", "ok": true}, {"h": "(−∞, −<span class=\"fr\"><span>1</span><span>2</span></span>] ∪ [3, ∞)", "ok": false}, {"h": "(−<span class=\"fr\"><span>1</span><span>2</span></span>, 3)", "ok": false}, {"h": "[−3, <span class=\"fr\"><span>1</span><span>2</span></span>]", "ok": false}]}, {"instr": "A film crew fires a confetti canister straight up from a 64-foot soundstage roof. Its height in feet after <i>t</i> seconds is <i>h</i> = −16<i>t</i><sup>2</sup> + 48<i>t</i> + 64. How many seconds after launch does the canister hit the ground?", "html": "Ground level is <i>h</i> = 0", "steps": ["Set the height to 0: −16<i>t</i><sup>2</sup> + 48<i>t</i> + 64 = 0. Divide every term by −16: <i>t</i><sup>2</sup> − 3<i>t</i> − 4 = 0.", "Factor: (<i>t</i> − 4)(<i>t</i> + 1) = 0, so <i>t</i> = 4 or <i>t</i> = −1.", "A time of −1 second is before the launch, so it does not fit the situation. The canister lands after 4 seconds"], "options": [{"h": "4 seconds", "ok": true}, {"h": "1.5 seconds", "ok": false}, {"h": "−1 seconds", "ok": false}, {"h": "100 seconds", "ok": false}]}]};
if(CFG.navy)document.documentElement.style.setProperty('--navy',CFG.navy);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const XS='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 20L80 80M80 20L20 80" stroke="#345bd5" stroke-width="16" stroke-linecap="round" fill="none"/></svg>';
const OS='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" stroke="#e4752a" stroke-width="15" fill="none"/></svg>';
const MARK={A:XS,B:OS};
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const other=t=>t==='A'?'B':'A';
let G={names:{A:'Team A',B:'Team B'},timer:0,score:{A:0,B:0,D:0},screen:'setup'};
let B,turn,starter='A',Q=null,quiz=null,order=[],deckPos=0,winLine=null,over=false,lastDrop=-1,tmr=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(){if(deckPos>=order.length){order=shuffle(CFG.questions.map((_,i)=>i));deckPos=0;}return CFG.questions[order[deckPos++]];}
function newGame(){B=Array(9).fill(null);turn=starter;winLine=null;over=false;quiz=null;lastDrop=-1;clearTimer();G.screen='play';render();}
function winner(){for(const l of LINES){const [a,b,c]=l;if(B[a]&&B[a]===B[b]&&B[a]===B[c])return {t:B[a],l};}return null;}
function clearTimer(){if(tmr){clearInterval(tmr);tmr=null;}}
function startTimer(){clearTimer();if(!G.timer||!quiz||quiz.stage==='result')return;const t0=Date.now(),tot=G.timer*1000;tmr=setInterval(()=>{const f=1-(Date.now()-t0)/tot;const b=$('#bar');if(b)b.style.width=Math.max(0,f*100)+'%';if(f<=0){clearTimer();submit(true);}},120);}
function pick(i){if(over||B[i]||quiz)return;const q=draw();quiz={sq:i,q,stage:'ans',who:turn,msg:'',stolen:false,ok:false,opts:shuffle(q.options.map((_,k)=>k)),sel:null,dead:[]};render();startTimer();}
function submit(timeout){
  if(!quiz||quiz.stage==='result')return;
  let ok=false;
  if(!timeout){if(quiz.sel===null){quiz.msg='Pick an answer first.';const m=$('#msg');if(m)m.textContent=quiz.msg;return;}
    ok=quiz.q.options[quiz.sel].ok;}
  clearTimer();
  if(ok){B[quiz.sq]=quiz.who;lastDrop=quiz.sq;quiz.stage='result';quiz.ok=true;}
  else if(quiz.stage==='ans'){if(quiz.sel!==null)quiz.dead.push(quiz.sel);quiz.sel=null;quiz.stage='steal';quiz.who=other(quiz.who);quiz.stolen=true;quiz.first=timeout?'Time is up!':'That answer is not correct.';quiz.missed=G.names[other(quiz.who)];}
  else{quiz.stage='result';quiz.ok=false;}
  render();if(quiz.stage==='steal')startTimer();
}
function afterQuiz(){ // turn passes to the other team from whoever started this turn
  const w=winner();const full=B.every(Boolean);
  turn=other(turn);quiz=null;
  if(w){over=true;winLine=w.l;G.score[w.t]++;starter=other(starter);}
  else if(full){over=true;G.score.D++;starter=other(starter);}
  render();if(w)confetti();
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#f2a33a','#345bd5','#e4752a','#1f7a4d','#7a3fb0'];for(let k=0;k<70;k++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[k%5];e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.6+'s';c.appendChild(e);}document.body.appendChild(c);setTimeout(()=>c.remove(),5200);}
function teamCard(t){return `<div class="team ${t}${!over&&turn===t&&G.screen==='play'?' on':''}"><div class="nm">${MARK[t]}${esc(G.names[t])}</div><div class="pts">${G.score[t]}</div><div class="tag">games won</div></div>`;}
function header(){return `<header class="top"><div><div class="eyebrow">${esc(CFG.eyebrow)}</div><h1>${esc(CFG.title)}</h1></div><span style="color:#c8d3ea">${esc(CFG.tagline)}</span></header>`;}
function modal(){
  if(!quiz)return '';const q=quiz.q;const t=quiz.who;
  if(quiz.stage==='result'){
    const nm=esc(G.names[quiz.who]);const right=q.options.find(o=>o.ok).h;
    return `<div class="modal"><div class="card ${quiz.ok?quiz.who:'N'}"><div class="res ${quiz.ok?'good':'bad'}">${quiz.ok?(quiz.stolen?`✔ Steal! ${nm} takes the square!`:`✔ Correct! ${nm} gets the square.`):'✖ Nobody got it. The square stays open.'}</div>
    <p style="margin:0 0 6px">Correct answer: <b>${right}</b></p>
    <div class="sol">${q.steps.map(s=>`<div>${s}</div>`).join('')}</div>
    <div style="text-align:right"><button class="primary" id="go">Continue</button></div></div></div>`;
  }
  return `<div class="modal"><div class="card ${t}"><div class="who"><span>${MARK[t].replace('<svg','<svg width="22" height="22" style="vertical-align:-4px;margin-right:6px"')}${esc(G.names[t])}: square ${quiz.sq+1}</span>${quiz.stage==='steal'?'<span class="steal">STEAL CHANCE</span>':''}</div>
  ${G.timer?'<div class="bar"><i id="bar"></i></div>':''}
  <div class="q"><p class="instr">${q.instr}</p>${q.html?`<div class="prob">${q.html}</div>`:''}
  <div class="opts" role="radiogroup" aria-label="Answer choices">${quiz.opts.map((k,n)=>`<button type="button" class="opt${quiz.dead.includes(k)?' dead':''}${quiz.sel===k?' sel':''}" data-k="${k}" role="radio" aria-checked="${quiz.sel===k}" ${quiz.dead.includes(k)?'disabled':''}><span class="ltr">${'ABCD'[n]}</span><span class="ot">${q.options[k].h}</span></button>`).join('')}</div>
  <div class="msg" id="msg" role="status">${quiz.stage==='steal'?esc(quiz.missed)+': '+esc(quiz.first)+' '+esc(G.names[t])+', you can steal it! (That choice is crossed out.)':''}</div>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button id="check" class="primary">Lock in answer</button></div></div></div></div>`;
}
function render(){
  const app=$('#app');
  if(G.screen==='setup'){
    app.innerHTML=header()+`<div class="panel setup"><p style="margin:0;line-height:1.55">${CFG.intro}</p>
    <div class="rules"><b>How to play</b><ol>${CFG.rules.map(r=>`<li>${r}</li>`).join('')}</ol></div>
    <div class="row2"><div><label for="na">Team A (X)</label><input type="text" id="na" value="${esc(G.names.A)}" maxlength="18"></div><div><label for="nb">Team B (O)</label><input type="text" id="nb" value="${esc(G.names.B)}" maxlength="18"></div></div>
    <label for="tm">Answer timer</label><select id="tm">${[[0,'No timer'],[30,'30 seconds'],[60,'60 seconds'],[90,'90 seconds']].map(([v,l])=>`<option value="${v}"${G.timer===v?' selected':''}>${l}</option>`).join('')}</select>
    <div style="margin-top:18px"><button class="primary" id="start">Start game</button></div></div>`;
    $('#start').onclick=()=>{G.names.A=$('#na').value.trim()||'Team A';G.names.B=$('#nb').value.trim()||'Team B';G.timer=+$('#tm').value;order=shuffle(CFG.questions.map((_,i)=>i));deckPos=0;starter='A';newGame();};
    return;
  }
  let status='';
  if(over){const w=winner();status=w?`🎉 ${esc(G.names[w.t])} wins!`:'It is a draw!';}
  else status=`${MARK[turn].replace('<svg','<svg width="22" height="22" style="vertical-align:-4px"')} ${esc(G.names[turn])}: pick a square`;
  app.innerHTML=header()+`<div class="layout"><div class="panel"><div class="turn">${status}</div>
   <div class="board" role="grid">${B.map((v,i)=>`<button class="sq ${v||''}${winLine&&winLine.includes(i)?' win':''}${i===lastDrop?' drop':''}" data-i="${i}" ${v||over||quiz?'disabled':''} aria-label="square ${i+1}${v?' taken by '+esc(G.names[v]):''}">${v?MARK[v]:i+1}</button>`).join('')}</div>
   <div class="ctl">${over?'<button class="primary" id="again">Play again</button>':''}<button id="newsetup">Change teams or timer</button><button id="resetsc">Reset scores</button></div></div>
   <div class="score">${teamCard('A')}${teamCard('B')}<div class="team" style="text-align:center"><b>${G.score.D}</b> draw${G.score.D===1?'':'s'}</div></div></div>`+modal();
  document.querySelectorAll('.sq').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const g=$('#go');if(g){g.onclick=afterQuiz;g.focus();}
  const c=$('#check');if(c){c.onclick=()=>submit(false);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{quiz.sel=+b.dataset.k;document.querySelectorAll('.opt').forEach(o=>{const s=o===b;o.classList.toggle('sel',s);o.setAttribute('aria-checked',s);});const m=$('#msg');if(m&&quiz.stage==='ans')m.textContent='';});}
  const ag=$('#again');if(ag)ag.onclick=newGame;
  $('#newsetup').onclick=()=>{clearTimer();quiz=null;G.screen='setup';render();};
  $('#resetsc').onclick=()=>{G.score={A:0,B:0,D:0};starter='A';newGame();};
}
TeacherSkills.bank(CFG.questions, TeacherSkills.questionLabel, selected=>{
CFG.questions=selected; order=[]; deckPos=0;
render();
});
</script>
