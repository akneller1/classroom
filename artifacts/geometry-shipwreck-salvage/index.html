<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipwreck Salvage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kid-friendly bubbles -->
    <div class="bubble" style="left: 10%; animation-duration: 8s;"></div>
    <div class="bubble" style="left: 30%; animation-duration: 6s; width: 30px; height: 30px;"></div>
    <div class="bubble" style="left: 70%; animation-duration: 9s;"></div>
    <div class="bubble" style="left: 85%; animation-duration: 5s; width: 15px; height: 15px;"></div>

    <div class="dashboard">
        <header class="header">
            <h1>⚓ SHIPWRECK SALVAGE ⚓ // LEVEL <span id="level-display">1</span></h1>
        </header>
        
        <div class="main-panel">
            <div class="left-col">
                <div class="briefing-box">
                    <h2>🗺️ Captain's Log</h2>
                    <p id="briefing-text"></p>
                </div>
                
                <div class="input-box">
                    <h2>🧭 Navigation Nav-Computer</h2>
                    <div id="inputs-container">
                        <!-- Inputs generated by JS -->
                    </div>
                    
                    <button id="submit-btn" class="action-btn">DIVE! 🌊</button>
                    <div id="feedback"></div>
                    <button id="next-btn" class="action-btn hidden">NEXT MISSION ➡️</button>
                </div>
            </div>
            
            <div class="right-col">
                <div class="table-container">
                    <canvas id="oceanCanvas" width="700" height="700"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
