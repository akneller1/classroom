<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proportional Relationship Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Pre-Algebra (7th)", "unit": "Linear Functions and Graphing", "title": "Proportional Relationship Explorer", "intro": "Trail mix costs the same amount per pound. Change the price, add a bag fee, and drag a point on the graph to test whether the relationship is still proportional."});
/* Trail mix: price k dollars per pound, plus an optional bag fee b. y = kx + b.
   Proportional exactly when b = 0: the line passes through (0, 0) and y/x = k in every row. Store B (y = 3x) is a fixed comparison. */
var st = { k: 2, b: 0, px: 3, ratios: {}, seen: {} };
var g = L.graph(P.stage, { xmin: -0.6, xmax: 10.5, ymin: -3, ymax: 40, width: 640, height: 520, xstep: 1, ystep: 5, ylabelStep: 10, label: 'Cost of trail mix' });
L.h('div', { class: 'legend', style: 'margin:6px' }, P.stage, '<span><i style="background:var(--blue)"></i>your store</span><span><i style="background:var(--ghost)"></i>Store B: $3 per pound, no fee</span><span><i style="background:var(--purple)"></i>point you drag</span>');
L.h('p', { class: 'sub', style: 'margin:0 6px' }, P.stage, 'Across: pounds of trail mix (' + L.V('x') + '). Up: total cost in dollars (' + L.V('y') + ').');
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var sk = L.slider(P.panel, { id: 'price-per-pound', label: 'Price per pound ($)', min: 0.5, max: 6, step: 0.5, value: st.k, color: 'blue', format: function (v) { return '$' + v.toFixed(2); }, onInput: function (v) { st.k = v; draw(); } });
var sb = L.slider(P.panel, { id: 'bag-fee', label: 'Bag fee charged once per order ($)', min: 0, max: 8, value: st.b, color: 'orange', format: function (v) { return '$' + v; }, onInput: function (v) { st.b = v; draw(); } });
var tbl = L.table(P.panel);
var fb = L.feedback(P.panel);
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st.k = 2; st.b = 0; st.px = 3; sk.set(2, true); sb.set(0, true); draw(); });
var ch = L.challenges(P.panel, [
  { text: 'Drag the purple point to 1 pound. What does its height tell you, and where else does that number appear?', check: function () { return st.seen.one; } },
  { text: 'Make a proportional relationship whose graph passes through (4, 10). Predict the price first.', check: function () { return st.b === 0 && Math.abs(st.k * 4 - 10) < 1e-9; } },
  { text: 'Add a bag fee. The graph is still a straight line. Drag the point to two places: is ' + L.frac(L.V('y'), L.V('x')) + ' still the same?', check: function () { return st.seen.twoRatios; } },
  { text: 'Make your store cost <b>more</b> than Store B for small orders but <b>less</b> for big orders (up to 10 pounds). Where do the lines cross?', check: function () { return st.seen.cross; } },
  { text: 'Make your prices match Store B for <b>every</b> amount of trail mix. What do the two equations and graphs have in common?', check: function () { return st.b === 0 && Math.abs(st.k - 3) < 1e-9; } }
]);
L.notice(P.below, '<p><b>A proportional relationship has a constant ratio:</b> ' + L.frac(L.V('y'), L.V('x')) + ' = ' + L.V('k') + ' for every pair, so its equation is ' + L.V('y') + ' = ' + L.V('kx') + ' and its graph is a straight line through (0, 0).</p>' +
  '<p>The constant of proportionality ' + L.V('k') + ' is the unit rate: the cost of 1 pound, the height of the graph at ' + L.V('x') + ' = 1, and how much ' + L.V('y') + ' goes up each time ' + L.V('x') + ' goes up by 1.</p>' +
  '<p>A straight line is <b>not enough</b>. With a bag fee, the line starts at (0, ' + L.V('b') + '), the ratio ' + L.frac(L.V('y'), L.V('x')) + ' changes from row to row, and doubling the pounds does not double the cost.</p>');
function money(v) { return '$' + v.toFixed(2); }
var draw = L.scheduler(function () {
  var k = st.k, b = st.b, f = function (x) { return k * x + b; };
  var top = Math.max(32, f(10) + 2), ymax = top <= 40 ? 40 : top <= 70 ? 70 : 80;
  g.setView({ ymin: -ymax / 13, ymax: ymax }); g.clear();
  g.fn(function (x) { return 3 * x; }, { color: 'ghost', width: 3, dash: '9 7', from: 0 });
  g.fn(f, { color: 'blue', width: 5, from: 0 });
  g.dot(0, b, { color: b ? 'orange' : 'green', r: 8, stroke: 'ink', strokeWidth: 2 });
  g.text(0, b, '(0, ' + L.num(b) + ')', { dx: 12, dy: b ? -10 : -12, color: b ? 'orange' : 'green' });
  var x = st.px, y = f(x);
  g.line(x, 0, x, y, { color: 'purple', width: 2, dash: '5 5' });
  g.line(0, y, x, y, { color: 'purple', width: 2, dash: '5 5' });
  g.handle(x, y, { color: 'purple', snap: 0.5, label: 'Point on your line', onDrag: function (nx) { st.px = Math.max(0, Math.min(10, nx)); draw(); } });
  g.text(x, y, '(' + L.num(x) + ', ' + L.num(y, 2) + ')', { dx: 14, dy: 20, color: 'purple' });
  /* readout */
  read.innerHTML = L.V('y') + ' = ' + (k === 1 ? '' : L.num(k)) + L.V('x') + (b ? ' + ' + b : '') +
    '<div class="sub" style="margin-top:6px">' + (b === 0 ? '<b class="c-green">proportional</b>: constant of proportionality ' + L.V('k') + ' = ' + L.num(k) : '<b class="c-red">not proportional</b>: the line starts at (0, ' + b + ')') + '</div>';
  var rows = [];
  for (var xi = 0; xi <= 5; xi++) rows.push([xi, money(f(xi)), xi ? '+' + money(k) : '—', xi ? L.num(f(xi) / xi, 3) : 'undefined']);
  tbl.set([L.V('x') + ' (lb)', L.V('y') + ' (cost)', 'change', L.frac(L.V('y'), L.V('x'))], rows);
  var ratio = x > 0 ? y / x : null;
  if (x === 0) fb.set('At 0 pounds the ratio ' + L.frac(L.V('y'), L.V('x')) + ' is undefined (you can’t divide by 0). ' + (b ? 'But you still pay the $' + b + ' fee.' : 'And 0 pounds cost $0.'), b ? 'warn' : '');
  else fb.set('For the purple point: ' + L.frac(L.V('y'), L.V('x')) + ' = ' + L.frac(L.num(y, 2), L.num(x)) + ' = ' + L.num(ratio, 3) + (b ? ' dollars per pound <b>at this point</b>. Move the point: this number changes.' : ' dollars per pound, the same as the price.'), b ? 'warn' : 'good');
  if (Math.abs(x - 1) < 1e-9 && b === 0) st.seen.one = true;
  if (b > 0 && x > 0) { st.ratios[b + ':' + k] = st.ratios[b + ':' + k] || {}; st.ratios[b + ':' + k][L.num(ratio, 6)] = true; if (Object.keys(st.ratios[b + ':' + k]).length >= 2) st.seen.twoRatios = true; }
  if (b > 0 && k < 3 && b / (3 - k) <= 10 + 1e-9) st.seen.cross = true;
  var cx = b > 0 && k < 3 ? b / (3 - k) : null;
  if (cx !== null && cx <= 10) { g.dot(cx, 3 * cx, { color: 'red', r: 7 }); g.text(cx, 3 * cx, 'equal at ' + L.num(cx, 2) + ' lb', { dx: -12, dy: -14, anchor: 'end', color: 'red' }); }
  ch.update();
});
draw();

})();
</script>
</body></html>
