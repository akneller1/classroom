function answerFor(q){

 if(key==='laser'){const x=(q.b2-q.b1)/(q.m1-q.m2);return [x,q.m1*x+q.b1]}

async function loadAuthoredBank(){

  const response=await fetch('../../question-banks/algebra2/functions-transformations.json',{cache:'no-store'});

}
function newBankQuestion(){
 bankQuestion=null;
 if(key==='portal'){
  if(!algebra2Bank)return false;
  const skills=[...new Set(algebra2Bank.map(q=>q.skillId))];

  let eligible=algebra2Bank.filter(q=>q.level===level&&q.format==='multiple-choice'&&q.options?.length>=2&&q.options.some(o=>o.correct)&&skills.slice(0,start+1).includes(q.skillId));
  if(!eligible.length)eligible=algebra2Bank.filter(q=>q.level===level&&q.format==='short-answer'&&q.answer!==undefined);
  eligible=eligible.filter(q=>!bankUsed.keys.has(q.id));
  if(!eligible.length)return false;
  const q=eligible[Math.floor(Math.random()*eligible.length)];
  bankUsed.keys.add(q.id);
  bankQuestion={id:q.id,skillName:q.skillId,q:{prompt:q.prompt,ask:''},steps:(q.solutionSteps||[]).map(t=>({t})),
    options:q.format==='multiple-choice'?q.options.map(o=>({a:o.text,ok:o.correct})):null,

 }

 if(!set||!window.MKGAMES)return false;

 for(let shift=0;shift<skills.length;shift++){
  const skill=skills[(start+shift)%skills.length];
  for(let attempt=0;attempt<12;attempt++){
   const items=MKGAMES.makeItems(spec.set,skill,c,{intOnly:bankLevel!=='honors',level:bankLevel},key+'-'+Date.now()+'-'+turn+'-'+shift+'-'+attempt,bankUsed);
