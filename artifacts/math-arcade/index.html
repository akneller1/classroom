const clean=n=>Number(n.toFixed(3)),approx=(x,y,t=.12)=>Math.abs(Number(x)-y)<=t;

function answerFor(q){
 if(key==='rocket')return [(q.c-q.b)/q.a];

 if(key==='laser'){const x=(q.b2-q.b1)/(q.m1-q.m2);return [x,q.m1*x+q.b1]}
 if(key==='mirror'){const {x,y,t}=q;return ({'reflect-x':[x,-y],'reflect-y':[-x,y],rotate90:[-y,x],rotate180:[-x,-y],rotate270:[y,-x],translate:[x+q.dx,y+q.dy]})[t]}

 if(key!=='portal'||algebra2Bank)return;

  algebra2Bank=json.questions;

}
function effectiveBankLevel(){const order=['cp2','cp1','honors'],base=Math.max(0,order.indexOf(bankLevel)),stage=Math.min(2,Math.floor(turn*3/total));return order[Math.min(2,base+stage)];}
function newBankQuestion(){
 bankQuestion=null;
 if(key==='portal'){
  if(!algebra2Bank)return false;
  const allSkills=[...new Set(algebra2Bank.map(q=>q.skillId))].sort();
  const stage=Math.min(allSkills.length-1,Math.floor(turn*allSkills.length/total));
  const skill=allSkills[stage];
  const formats=turn<2?['short-answer','multiple-choice']:turn<4?['multiple-choice','short-answer']:['short-answer','multiple-choice'];
  const targetLevel=effectiveBankLevel();
  const pool=algebra2Bank.filter(q=>q.level===targetLevel&&!bankUsed.keys.has(q.id)
    &&(q.format==='multiple-choice'&&q.options?.some(o=>o.correct)||q.format==='short-answer'&&q.answer!=null));
  const sorted=pool.sort((a,b)=>{
    const score=q=>(q.skillId===skill?10:0)+(formats.indexOf(q.format)===0?4:0)
      -(q.skillId===bankQuestion?.skillName?3:0);
    return score(b)-score(a);
  });
  if(!sorted.length)return false;
  const topScore=sorted[0].skillId===skill;
  const candidates=sorted.filter(q=>(q.skillId===skill)===topScore&&q.format===sorted[0].format);
  const q=candidates[Math.floor(Math.random()*Math.min(5,candidates.length))];
  bankUsed.keys.add(q.id);
  bankQuestion={id:q.id,skillName:q.skillId,q:{prompt:q.prompt,ask:''},steps:(q.solutionSteps||[]).map(t=>({t})),
    options:q.format==='multiple-choice'?q.options.map(o=>({a:o.text,ok:o.correct})):null,

}
function renderArcadeMath(value){
 const raw=String(value==null?'':value);
 const escape=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const render=tex=>window.katex?katex.renderToString(tex,{throwOnError:false,trust:false,output:'html'}):escape(tex);

 while((m=delimiter.exec(rest))){
  out+=renderLooseMath(rest.slice(0,m.index),escape,render);
  out+=render(m[1]||m[2]||m[3]);
  rest=rest.slice(m.index+m[0].length);
 }
 return out+renderLooseMath(rest,escape,render);
}
function renderLooseMath(text,escape,render){
 const command=/\\(?:d?frac|sqrt|left|right|cdot|times|leq|geq|neq|angle|overline|pi|theta|circ|text|sum|ge|le)\b/;
 let out='',rest=String(text),m;
 while((m=command.exec(rest))){
  out+=window.MK_MATH_DISPLAY?MK_MATH_DISPLAY.html(rest.slice(0,m.index)):escape(rest.slice(0,m.index));
  const fragment=rest.slice(m.index),end=/(?:[.!?](?=\s|$)|\n)/.exec(fragment);
  let math=end?fragment.slice(0,end.index):fragment;
  let trailing='';
  while(math.endsWith(')')&&(math.match(/\(/g)||[]).length<(math.match(/\)/g)||[]).length){math=math.slice(0,-1);trailing=')'+trailing;}
  out+=render(math.trim())+escape(trailing);
  rest=fragment.slice((end?end.index:fragment.length));
  if(!rest.length)break;
  // Retain punctuation as prose, rather than repeatedly attempting to render it.
  if(end){out+=escape(rest[0]);rest=rest.slice(1);}
 }
 return out+(window.MK_MATH_DISPLAY?MK_MATH_DISPLAY.html(rest):escape(rest));
}
