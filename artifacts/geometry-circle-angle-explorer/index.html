<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circle Angle Explorer · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/geo.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Geometry", "unit": "Circles", "title": "Circle Angle Explorer", "intro": "Drag points around a circle to compare central and inscribed angles. Then find arc lengths and sector areas as a fraction of the whole circle."});
var Gm = L.geo;
var st = { mode: 'inscribed', a: 210, b: 330, p: 100, r: 6, th: 90, seen: { pos: {} } };
L.tabs(P.stage, [{ id: 'inscribed', label: 'Central & inscribed angles' }, { id: 'sector', label: 'Arc length & sector area' }], function (id) { st.mode = id; build(); draw(); });
var g = L.graph(P.stage, { xmin: -8, xmax: 8, ymin: -8, ymax: 8, width: 580, height: 580, noGrid: true, label: 'Circle' });
var gg = L.geoGraph(g);
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var info = L.h('dl', { class: 'kv' }, P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Make the central angle 100°. What is the inscribed angle?', check: function () { return st.seen.c100; } },
  { text: 'Slide P to three different places on the major arc. Does the inscribed angle change?', check: function () { return Object.keys(st.seen.pos).length >= 3; } },
  { text: 'Make AB a diameter. What is the inscribed angle?', check: function () { return st.seen.diam; } },
  { text: 'Find the area of a quarter circle with radius 4.', check: function () { return st.mode === 'sector' && st.r === 4 && st.th === 90; } },
  { text: 'Make the arc length equal to the radius. About how many degrees is that?', check: function () { return st.seen.rad; } }
]);
function build() {
  ctrl.innerHTML = '';
  if (st.mode === 'inscribed') L.h('p', { class: 'sub' }, ctrl, 'Drag A and B (orange) to set the arc, and P (purple) to move the inscribed angle. Points snap to every 5°.');
  else {
    L.slider(ctrl, { id: 'r', label: 'Radius r', min: 1, max: 7, step: 1, value: st.r, color: 'blue', format: L.num, onInput: function (v) { st.r = v; draw(); } });
    L.slider(ctrl, { id: 'th', label: 'Central angle', min: 5, max: 360, step: 5, value: st.th, color: 'orange', format: L.deg, onInput: function (v) { st.th = v; draw(); } });
  }
}
function onCircle(name, deg, color) {
  var Pt = Gm.polar([0, 0], 6, deg);
  g.handle(Pt[0], Pt[1], { color: color, label: 'Point ' + name, onDrag: function (x, y) { var d = Math.round(Gm.dir([0, 0], [x, y]) / 5) * 5; st[name.toLowerCase()] = (d + 360) % 360; draw(); } });
  var lp = Gm.polar([0, 0], 7, deg); g.text(lp[0], lp[1], name, { anchor: 'middle', dy: 6, size: 18, color: color });
  return Pt;
}
function piFrac(n, d) { // n/d · π as a stacked fraction
  var f = L.toFrac(n / d, 720); if (!f) return L.num(n / d, 3) + 'π';
  if (f[0] === 0) return '0'; if (f[1] === 1) return (f[0] === 1 ? '' : f[0]) + 'π';
  return L.frac((f[0] === 1 ? '' : f[0]) + 'π', f[1]);
}
var draw = L.scheduler(function () {
  g.clear();
  if (st.mode === 'inscribed') {
    var O = [0, 0], A = Gm.polar(O, 6, st.a), B = Gm.polar(O, 6, st.b), Pp = Gm.polar(O, 6, st.p);
    gg.circle(O, 6, { stroke: 'ink', width: 3 });
    // arc AB intercepted: the one that does not contain P
    var ccwAB = ((st.b - st.a) % 360 + 360) % 360, pOnCcw = ((st.p - st.a) % 360 + 360) % 360 < ccwAB;
    var arc = pOnCcw ? 360 - ccwAB : ccwAB, start = pOnCcw ? st.b : st.a;
    if (arc > 0) g.param(function (t) { return 6 * Math.cos((start + t * arc) * Math.PI / 180); }, function (t) { return 6 * Math.sin((start + t * arc) * Math.PI / 180); }, 0, 1, { color: 'orange', width: 8 });
    g.line(O[0], O[1], A[0], A[1], { color: 'blue', width: 3 }); g.line(O[0], O[1], B[0], B[1], { color: 'blue', width: 3 });
    g.line(Pp[0], Pp[1], A[0], A[1], { color: 'purple', width: 3 }); g.line(Pp[0], Pp[1], B[0], B[1], { color: 'purple', width: 3 });
    var same = st.a === st.b || st.p === st.a || st.p === st.b;
    if (!same) {
      var central = arc <= 180 ? arc : null;
      if (central != null) gg.angle(A, O, B, { r: 1.1, color: 'blue', fill: true, label: L.num(arc) + '°' });
      gg.angle(A, Pp, B, { r: 1.1, color: 'purple', fill: true, label: L.num(arc / 2) + '°' });
    }
    g.dot(0, 0, { r: 5 }); g.text(0, 0, 'O', { dx: -10, dy: 18, anchor: 'end' });
    onCircle('A', st.a, 'orange'); onCircle('B', st.b, 'orange'); onCircle('P', st.p, 'purple');
    if (same) { read.innerHTML = 'Move the points apart.'; info.innerHTML = ''; ch.update(); return; }
    read.innerHTML = 'Inscribed ∠APB = ' + L.frac(1, 2) + ' × arc AB = ' + L.frac(1, 2) + ' × ' + L.num(arc) + '° = <b>' + L.num(arc / 2) + '°</b>';
    info.innerHTML = '<dt>Intercepted arc AB</dt><dd>' + L.num(arc) + '° (' + (arc < 180 ? 'minor arc' : arc === 180 ? 'semicircle' : 'major arc') + ')</dd><dt>Central ∠AOB</dt><dd>' + (arc <= 180 ? L.num(arc) + '°, equal to its arc' : 'the reflex angle ' + L.num(arc) + '° (P is on the minor arc)') + '</dd>';
    if (arc === 100) st.seen.c100 = true; if (arc === 180) st.seen.diam = true;
    if (!pOnCcw || pOnCcw) st.seen.pos[st.a + ',' + st.b + ',' + st.p] = true;
    var key = st.a + ',' + st.b; Object.keys(st.seen.pos).forEach(function (k) { if (k.indexOf(key + ',') !== 0) delete st.seen.pos[k]; });
  } else {
    var r = st.r, th = st.th, O2 = [0, 0];
    g.setView({ xmin: -8, xmax: 8, ymin: -8, ymax: 8 });
    gg.circle(O2, r, { stroke: 'ink', width: 2, dash: '6 5' });
    var pts = [O2]; for (var i = 0; i <= 120; i++) pts.push(Gm.polar(O2, r, th * i / 120));
    gg.polygon(pts, { stroke: 'none', fill: 'blue', fillOpacity: 0.25, width: 0 });
    g.param(function (t) { return r * Math.cos(t * th * Math.PI / 180); }, function (t) { return r * Math.sin(t * th * Math.PI / 180); }, 0, 1, { color: 'orange', width: 7 });
    var E = Gm.polar(O2, r, th); g.line(0, 0, r, 0, { color: 'ink', width: 3 }); g.line(0, 0, E[0], E[1], { color: 'ink', width: 3 });
    g.text(r / 2, 0, 'r = ' + r, { anchor: 'middle', dy: 20 });
    var len = th / 360 * 2 * Math.PI * r, area = th / 360 * Math.PI * r * r;
    read.innerHTML = 'Arc length = ' + L.frac(th + '°', '360°') + ' × 2π(' + r + ') = ' + piFrac(th * 2 * r, 360) + ' ≈ ' + L.num(len, 2) +
      '<br>Sector area = ' + L.frac(th + '°', '360°') + ' × π(' + r + ')² = ' + piFrac(th * r * r, 360) + ' ≈ ' + L.num(area, 2);
    info.innerHTML = '<dt>Fraction of the circle</dt><dd>' + L.nice(th / 360, 72) + '</dd><dt>Whole circumference</dt><dd>' + piFrac(2 * r, 1) + '</dd><dt>Whole area</dt><dd>' + piFrac(r * r, 1) + '</dd>';
    if (Math.abs(len - r) / r < 0.05) st.seen.rad = true;
  }
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
