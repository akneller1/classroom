<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solids Volume Lab · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/geo.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Geometry", "unit": "Area, Surface Area and Volume", "title": "Solids Volume Lab", "intro": "Change the dimensions of prisms, cylinders, pyramids, cones and spheres and watch the volume and surface area formulas work."});
var SOLIDS = {
  prism: { label: 'Rectangular prism', dims: [['l', 'length ℓ', 5], ['w', 'width w', 3], ['h', 'height h', 4]] },
  cylinder: { label: 'Cylinder', dims: [['r', 'radius r', 3], ['h', 'height h', 6]] },
  pyramid: { label: 'Square pyramid', dims: [['s', 'base side s', 6], ['h', 'height h', 4]] },
  cone: { label: 'Cone', dims: [['r', 'radius r', 3], ['h', 'height h', 6]] },
  sphere: { label: 'Sphere', dims: [['r', 'radius r', 3]] }
};
var st = { solid: 'cylinder', v: {}, k: 1, seen: {}, compare: false };
Object.keys(SOLIDS).forEach(function (k) { SOLIDS[k].dims.forEach(function (d) { st.v[k + d[0]] = d[2]; }); });
var W = 600, H = 520;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Solid figure' }, P.stage);
L.chips(P.panel, { label: 'Solid', value: st.solid, options: Object.keys(SOLIDS).map(function (k) { return { value: k, label: SOLIDS[k].label }; }), onChange: function (v) { st.solid = v; build(); draw(); } });
var read = L.h('div', { class: 'readout small', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var info = L.h('dl', { class: 'kv' }, P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Make a rectangular prism with a volume of 60 cubic units.', check: function () { return st.seen.p60; } },
  { text: 'Compare a cone with a cylinder that has the same radius and height. What fraction is the cone?', check: function () { return st.seen.cmp; } },
  { text: 'Set the scale factor to 2. How many times bigger is the volume? The surface area?', check: function () { return st.k === 2; } },
  { text: 'Find the volume of a sphere with radius 3.', check: function () { return st.solid === 'sphere' && st.v.spherer === 3; } },
  { text: 'Make a cylinder whose volume is exactly 72π.', check: function () { return st.seen.c72; } }
]);
function build() {
  ctrl.innerHTML = '';
  SOLIDS[st.solid].dims.forEach(function (d) { var key = st.solid + d[0]; L.slider(ctrl, { id: key, label: d[1], min: 1, max: 8, value: st.v[key], color: 'blue', format: L.num, onInput: function (x) { st.v[key] = x; draw(); } }); });
  L.slider(ctrl, { id: 'k', label: 'Scale factor k (multiplies every dimension)', min: 1, max: 3, step: 0.5, value: st.k, color: 'orange', format: L.nice, onInput: function (x) { st.k = x; draw(); } });
  if (st.solid === 'cone') L.chips(ctrl, { label: 'Compare with the cylinder', value: st.compare, options: [{ value: false, label: 'off' }, { value: true, label: 'on' }], onChange: function (x) { st.compare = x; draw(); } });
}
function piTxt(c) { var f = L.toFrac(c, 12); if (!f) return L.num(c, 2) + 'π'; return (f[1] === 1 ? (f[0] === 1 ? '' : f[0]) : L.frac(f[0], f[1])) + 'π'; }
function path(d, p) { return L.s('path', Object.assign({ d: d, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, p || {}), svg); }
function txt(x, y, s, c) { var t = L.s('text', { x: x, y: y, class: 'g-label', 'text-anchor': 'middle', fill: c || null, 'font-size': 16 }, svg); t.textContent = s; }
var draw = L.scheduler(function () {
  var k = st.k, v = function (n) { return st.v[st.solid + n] * k; };
  svg.innerHTML = '';
  var u = Math.min(30, 380 / Math.max.apply(null, SOLIDS[st.solid].dims.map(function (d) { return st.v[st.solid + d[0]] * k; }).concat([6]))), cx = W / 2, base = H - 70;
  var V, S, vf, sf, Vtxt, Stxt;
  if (st.solid === 'prism') {
    var l = v('l'), w = v('w'), h = v('h'), dx = w * u * 0.5, dy = w * u * 0.35, x0 = cx - (l * u + dx) / 2, y0 = base;
    var F = [[x0, y0], [x0 + l * u, y0], [x0 + l * u, y0 - h * u], [x0, y0 - h * u]], Bk = F.map(function (p) { return [p[0] + dx, p[1] - dy]; });
    path('M' + F.map(function (p) { return p.join(' '); }).join(' L') + ' Z', { fill: 'var(--blue-tint)' });
    path('M' + F[3].join(' ') + ' L' + Bk[3].join(' ') + ' L' + Bk[2].join(' ') + ' L' + Bk[1].join(' ') + ' L' + F[1].join(' ') + ' M' + F[2].join(' ') + ' L' + Bk[2].join(' '), { fill: 'none' });
    path('M' + F[0].join(' ') + ' L' + Bk[0].join(' ') + ' L' + Bk[1].join(' ') + ' M' + Bk[0].join(' ') + ' L' + Bk[3].join(' '), { 'stroke-dasharray': '6 5', 'stroke-width': 2 });
    txt((F[0][0] + F[1][0]) / 2, y0 + 24, 'ℓ = ' + L.num(l)); txt(F[1][0] + dx / 2 + 26, y0 - dy / 2 + 6, 'w = ' + L.num(w)); txt(x0 - 34, y0 - h * u / 2, 'h = ' + L.num(h));
    V = l * w * h; S = 2 * (l * w + l * h + w * h); Vtxt = 'V = ℓwh = ' + L.num(l) + ' · ' + L.num(w) + ' · ' + L.num(h) + ' = <b>' + L.num(V) + '</b>'; Stxt = 'SA = 2(ℓw + ℓh + wh) = <b>' + L.num(S) + '</b>';
    if (k === 1 && V === 60) st.seen.p60 = true;
  } else if (st.solid === 'cylinder' || st.solid === 'cone') {
    var r = v('r'), hh = v('h'), rx = r * u, ry = rx * 0.32, top = base - hh * u, cone = st.solid === 'cone';
    if (cone && st.compare) { path('M' + (cx - rx) + ' ' + base + ' L' + (cx - rx) + ' ' + top + ' M' + (cx + rx) + ' ' + base + ' L' + (cx + rx) + ' ' + top, { 'stroke-dasharray': '6 5', 'stroke-width': 2, stroke: 'var(--orange)' }); L.s('ellipse', { cx: cx, cy: top, rx: rx, ry: ry, fill: 'none', stroke: 'var(--orange)', 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg); st.seen.cmp = true; }
    if (cone) path('M' + (cx - rx) + ' ' + base + ' L' + cx + ' ' + top + ' L' + (cx + rx) + ' ' + base, { fill: 'var(--blue-tint)' });
    else { path('M' + (cx - rx) + ' ' + base + ' L' + (cx - rx) + ' ' + top + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + (cx + rx) + ' ' + top + ' L' + (cx + rx) + ' ' + base + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + (cx - rx) + ' ' + base, { fill: 'var(--blue-tint)' }); L.s('ellipse', { cx: cx, cy: top, rx: rx, ry: ry, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3 }, svg); }
    path('M' + (cx - rx) + ' ' + base + ' A ' + rx + ' ' + ry + ' 0 0 0 ' + (cx + rx) + ' ' + base, {});
    path('M' + (cx - rx) + ' ' + base + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + (cx + rx) + ' ' + base, { 'stroke-dasharray': '6 5', 'stroke-width': 2 });
    path('M' + cx + ' ' + base + ' L' + (cx + rx) + ' ' + base, { stroke: 'var(--orange)' }); txt(cx + rx / 2, base + ry + 24, 'r = ' + L.num(r), 'var(--orange)');
    path('M' + cx + ' ' + base + ' L' + cx + ' ' + top, { 'stroke-dasharray': '6 5', 'stroke-width': 2, stroke: 'var(--green)' }); txt(cx - 34, (base + top) / 2, 'h = ' + L.num(hh), 'var(--green)');
    if (cone) { var sl = Math.sqrt(r * r + hh * hh); vf = r * r * hh / 3; sf = r * r + r * sl; Vtxt = 'V = ' + L.frac(1, 3) + 'πr²h = ' + L.frac(1, 3) + 'π(' + L.num(r) + ')²(' + L.num(hh) + ') = <b>' + piTxt(vf) + '</b> ≈ ' + L.num(vf * Math.PI, 1); Stxt = 'SA = πr² + πrℓ = <b>' + L.num(sf * Math.PI, 1) + '</b> (slant ℓ ≈ ' + L.num(sl, 2) + ')'; }
    else { vf = r * r * hh; sf = 2 * r * r + 2 * r * hh; Vtxt = 'V = πr²h = π(' + L.num(r) + ')²(' + L.num(hh) + ') = <b>' + piTxt(vf) + '</b> ≈ ' + L.num(vf * Math.PI, 1); Stxt = 'SA = 2πr² + 2πrh = <b>' + piTxt(sf) + '</b> ≈ ' + L.num(sf * Math.PI, 1); if (k === 1 && vf === 72) st.seen.c72 = true; }
    V = vf * Math.PI; S = sf * Math.PI;
    if (cone && st.compare) Vtxt += '<div class="sub">Cylinder with the same r and h: ' + piTxt(r * r * hh) + '. The cone is ' + L.frac(1, 3) + ' of it.</div>';
  } else if (st.solid === 'pyramid') {
    var s = v('s'), h2 = v('h'), half = s * u / 2, dpx = s * u * 0.32, apex = [cx + dpx / 2, base - h2 * u - dpx / 2];
    var b0 = [cx - half, base], b1 = [cx + half, base], b2 = [cx + half + dpx, base - dpx], b3 = [cx - half + dpx, base - dpx];
    path('M' + b0.join(' ') + ' L' + b1.join(' ') + ' L' + apex.join(' ') + ' Z', { fill: 'var(--blue-tint)' });
    path('M' + b1.join(' ') + ' L' + b2.join(' ') + ' L' + apex.join(' '), { fill: 'var(--blue-tint)' });
    path('M' + b0.join(' ') + ' L' + b3.join(' ') + ' L' + b2.join(' ') + ' M' + b3.join(' ') + ' L' + apex.join(' '), { 'stroke-dasharray': '6 5', 'stroke-width': 2 });
    path('M' + (cx + dpx / 2) + ' ' + (base - dpx / 2) + ' L' + apex.join(' '), { 'stroke-dasharray': '6 5', 'stroke-width': 2, stroke: 'var(--green)' });
    txt(cx, base + 24, 's = ' + L.num(s)); txt(apex[0] + 40, (base + apex[1]) / 2, 'h = ' + L.num(h2), 'var(--green)');
    var slant = Math.sqrt(h2 * h2 + (s / 2) * (s / 2));
    V = s * s * h2 / 3; S = s * s + 2 * s * slant; Vtxt = 'V = ' + L.frac(1, 3) + 'Bh = ' + L.frac(1, 3) + '(' + L.num(s) + '²)(' + L.num(h2) + ') = <b>' + L.nice(V) + '</b>'; Stxt = 'SA = s² + 4 · ' + L.frac(1, 2) + 'sℓ = <b>' + L.num(S, 1) + '</b> (slant ℓ ≈ ' + L.num(slant, 2) + ')';
  } else {
    var r3 = v('r'), R3 = r3 * u;
    L.s('circle', { cx: cx, cy: base - R3 - 10, r: R3, fill: 'var(--blue-tint)', stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
    L.s('ellipse', { cx: cx, cy: base - R3 - 10, rx: R3, ry: R3 * 0.3, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
    path('M' + cx + ' ' + (base - R3 - 10) + ' L' + (cx + R3) + ' ' + (base - R3 - 10), { stroke: 'var(--orange)' }); txt(cx + R3 / 2, base - R3 - 18, 'r = ' + L.num(r3), 'var(--orange)');
    vf = 4 / 3 * r3 * r3 * r3; sf = 4 * r3 * r3; V = vf * Math.PI; S = sf * Math.PI;
    Vtxt = 'V = ' + L.frac(4, 3) + 'πr³ = ' + L.frac(4, 3) + 'π(' + L.num(r3) + ')³ = <b>' + piTxt(vf) + '</b> ≈ ' + L.num(V, 1); Stxt = 'SA = 4πr² = <b>' + piTxt(sf) + '</b> ≈ ' + L.num(S, 1);
  }
  read.innerHTML = Vtxt + '<div style="margin-top:6px">' + Stxt + '</div>';
  info.innerHTML = '<dt>Scale factor k</dt><dd>' + L.nice(k) + '</dd><dt>Volume grows by</dt><dd>k³ = ' + L.nice(k * k * k) + '</dd><dt>Surface area grows by</dt><dd>k² = ' + L.nice(k * k) + '</dd>';
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
