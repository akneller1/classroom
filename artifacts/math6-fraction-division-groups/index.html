<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fraction Division: How Many Groups? · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "6th Grade Math", "unit": "Operations of Fractions and Decimals", "title": "Fraction Division: How Many Groups?", "intro": "Division asks how many groups of one size fit into an amount. Build the groups, then look closely at what is left over."});
/* Measurement division: how many groups of size d fit into a? Both are fractions n/m with small whole numbers.
   Everything is computed exactly with integers: cut each whole into L = lcm(denominators) equal pieces. */
var st = { an: 3, ad: 1, dn: 3, dd: 2, seen: {} };
function lcm(x, y) { return x / L.gcd(x, y) * y; }
function F(n, d) { var g = L.gcd(n, d); n /= g; d /= g; return [n, d]; }
function fracHTML(n, d) { var f = F(n, d); return f[1] === 1 ? String(f[0]) : L.frac(f[0], f[1]); }
function mixed(n, d) { var f = F(n, d); n = f[0]; d = f[1]; if (d === 1) return String(n); var w = Math.floor(n / d), r = n - w * d; return (w ? w + ' ' : '') + L.frac(r, d); }
function calc() {
  var Lc = lcm(st.ad, st.dd), A = st.an * Lc / st.ad, D = st.dn * Lc / st.dd;   // pieces of size 1/Lc
  var full = Math.floor(A / D), left = A - full * D;
  return { Lc: Lc, A: A, D: D, full: full, left: left, qn: A, qd: D, a: st.an / st.ad, d: st.dn / st.dd };
}
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
L.h('h2', { class: 'c-blue' }, P.panel, 'Amount you have (dividend)');
var s1 = L.slider(P.panel, { id: 'dividend-numerator', label: 'numerator', min: 1, max: 24, value: st.an, color: 'blue', format: L.num, onInput: function (v) { st.an = v; clampA(); draw(); } });
var s2 = L.slider(P.panel, { id: 'dividend-denominator', label: 'denominator', min: 1, max: 8, value: st.ad, color: 'blue', format: L.num, onInput: function (v) { st.ad = v; clampA(); draw(); } });
L.h('h2', { class: 'c-orange' }, P.panel, 'Size of one group (divisor)');
var s3 = L.slider(P.panel, { id: 'divisor-numerator', label: 'numerator', min: 1, max: 12, value: st.dn, color: 'orange', format: L.num, onInput: function (v) { st.dn = v; clampD(); draw(); } });
var s4 = L.slider(P.panel, { id: 'divisor-denominator', label: 'denominator', min: 1, max: 8, value: st.dd, color: 'orange', format: L.num, onInput: function (v) { st.dd = v; clampD(); draw(); } });
var note = L.h('p', { class: 'lp-mini' }, P.panel, 'Both amounts are kept at 6 or less so the model fits on the screen.');
function clampA() { if (st.an / st.ad > 6) { st.an = 6 * st.ad; s1.set(st.an, true); } }
function clampD() { if (st.dn / st.dd > 6) { st.dn = 6 * st.dd; s3.set(st.dn, true); } }
var fb = L.feedback(P.panel);
var btns = L.h('div', { class: 'btn-row' }, P.panel);
L.reset(btns, function () { st.an = 3; st.ad = 1; st.dn = 3; st.dd = 2; s1.set(3, true); s2.set(1, true); s3.set(3, true); s4.set(2, true); draw(); });
var ch = L.challenges(P.panel, [
  { text: 'Build a division with a fraction divisor less than 1 whose answer is exactly 6.', check: function () { return st.seen.six; } },
  { text: 'A classmate says “dividing always makes a number smaller.” Build a <b>counterexample</b>.', check: function () { return st.seen.bigger; } },
  { text: 'Build a division where only <b>part</b> of a group fits at the end. Is the leftover a fraction of a whole or of a group?', check: function () { return st.seen.partial; } },
  { text: 'Build a division whose answer is <b>less than 1</b>. What has to be true about the divisor?', check: function () { return st.seen.lessOne; } },
  { text: 'Find a different division with the same answer as 2 ÷ ' + L.frac(3, 4) + '. Predict the answer first.', check: function () { return st.seen.same; } }
]);
L.notice(P.below, '<p><b>a ÷ d asks “how many groups of size d fit into a?”</b> Count the full groups, then ask what fraction of one more group the leftover fills.</p>' +
  '<p>The leftover is measured in <b>groups</b>: in 2 ÷ ' + L.frac(3, 4) + ', the leftover ' + L.frac(1, 2) + ' of a whole is ' + L.frac(2, 3) + ' of a group, so the answer is 2' + L.frac(2, 3) + ', not 2' + L.frac(1, 2) + '.</p>' +
  '<p>Cutting every whole into the same small pieces turns any fraction division into whole-number division: (pieces in a) ÷ (pieces in d). That is why a ÷ ' + L.frac(L.V('n'), L.V('m')) + ' = a × ' + L.frac(L.V('m'), L.V('n')) + '. Dividing by a number less than 1 gives an answer bigger than a.</p>');

var W = 640, H = 300, X0 = 30, X1 = 610;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Bar model of the division' }, P.stage);
var cap = L.h('p', { class: 'readout small', style: 'margin:8px 0 0', 'aria-live': 'polite' }, P.stage);
function t(x, y, s, o) { o = o || {}; var e = L.s('text', { x: x, y: y, 'text-anchor': o.anchor || 'middle', class: 'g-label', 'font-size': o.size || 15, fill: o.color || null }, svg); e.textContent = s; return e; }
var draw = L.scheduler(function () {
  var c = calc(), R = Math.max(1, Math.ceil(Math.max(c.a, c.d) - 1e-9));
  var XU = function (pieces) { return X0 + pieces / (R * c.Lc) * (X1 - X0); };   // x for a length given in small pieces
  svg.innerHTML = '';
  /* dividend bar */
  var lab = L.s('foreignObject', { x: X0, y: 0, width: 400, height: 38 }, svg);
  lab.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--blue);font-size:15px">You have ' + mixed(st.an, st.ad) + ' &nbsp;·&nbsp; <span style="color:var(--orange)">one group is ' + mixed(st.dn, st.dd) + '</span></div>';
  L.s('rect', { x: X0, y: 40, width: XU(c.A) - X0, height: 40, rx: 6, fill: 'var(--blue-tint)', stroke: 'var(--blue)', 'stroke-width': 3 }, svg);
  /* groups */
  var colors = ['orange', 'purple'], y = 110, hgt = 40;
  for (var i = 0; i < c.full; i++) {
    var gx = XU(i * c.D), gw = XU((i + 1) * c.D) - gx;
    L.s('rect', { x: gx + 1, y: y, width: gw - 2, height: hgt, rx: 5, fill: 'var(--' + colors[i % 2] + '-tint)', stroke: 'var(--' + colors[i % 2] + ')', 'stroke-width': 3 }, svg);
    if (gw > 20) t(gx + gw / 2, y + 26, String(i + 1), { size: gw > 34 ? 16 : 12 });
  }
  if (c.left) {
    var px = XU(c.full * c.D), pw = XU(c.full * c.D + c.left) - px, ew = XU((c.full + 1) * c.D) - px;
    L.s('rect', { x: px + 1, y: y, width: ew - 2, height: hgt, rx: 5, fill: 'none', stroke: 'var(--red)', 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, svg);
    L.s('rect', { x: px + 1, y: y, width: Math.max(1, pw - 2), height: hgt, rx: 5, fill: 'var(--red-tint)', stroke: 'var(--red)', 'stroke-width': 3 }, svg);
    t(px + 2, y + hgt + 18, 'part of a group: ' + c.left + ' of ' + c.D + ' pieces', { anchor: px > W - 220 ? 'end' : 'start', size: 13, color: 'var(--red)' }).setAttribute('x', px > W - 220 ? Math.min(W - 6, px + ew) : px + 2);
  }
  /* number line with whole numbers and small pieces */
  var yl = 230;
  L.s('line', { x1: X0, x2: X1, y1: yl, y2: yl, stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
  var showPieces = R * c.Lc <= 96;
  for (var p = 0; p <= R * c.Lc; p++) {
    var whole = p % c.Lc === 0;
    if (!whole && !showPieces) continue;
    L.s('line', { x1: XU(p), x2: XU(p), y1: yl - (whole ? 12 : 6), y2: yl + (whole ? 12 : 6), stroke: 'var(--ink)', 'stroke-width': whole ? 2.5 : 1.2 }, svg);
    if (!whole && c.Lc > 1) L.s('line', { x1: XU(p), x2: XU(p), y1: 40, y2: 150, stroke: 'var(--ink-soft)', 'stroke-width': 0.8, opacity: 0.45 }, svg);
    if (whole) t(XU(p), yl + 32, String(p / c.Lc), { size: 15 });
  }
  t(X1, yl + 54, c.Lc > 1 ? 'small ticks: each whole is cut into ' + c.Lc + ' equal pieces' : '', { anchor: 'end', size: 13, color: 'var(--ink-soft)' });

  /* readouts */
  var q = F(c.qn, c.qd), qv = c.A / c.D;
  read.innerHTML = fracHTML(st.an, st.ad) + ' ÷ ' + fracHTML(st.dn, st.dd) + ' = ' + mixed(c.qn, c.qd) +
    '<div class="sub" style="margin-top:6px">' + fracHTML(st.an, st.ad) + ' × ' + fracHTML(st.dd, st.dn) + ' = ' + fracHTML(c.qn, c.qd) + '</div>';
  cap.innerHTML = 'In pieces of size ' + L.frac(1, c.Lc) + ': you have <b class="c-blue">' + c.A + '</b> pieces and one group is <b class="c-orange">' + c.D + '</b> piece' + (c.D === 1 ? '' : 's') + '. ' +
    c.A + ' ÷ ' + c.D + ' = ' + mixed(c.A, c.D) + ' groups.';
  if (c.full === 0) fb.set('Not even one full group fits. The amount you have is ' + fracHTML(c.A, c.D) + ' of one group, so the answer is less than 1.', 'warn');
  else if (c.left) fb.set('<b>' + c.full + '</b> full group' + (c.full > 1 ? 's' : '') + ' fit, and the leftover fills <b>' + fracHTML(c.left, c.D) + ' of a group</b>. (As part of a whole, that leftover is ' + fracHTML(c.left, c.Lc) + ', which is a different number.)', '');
  else fb.set('Exactly <b>' + c.full + '</b> group' + (c.full > 1 ? 's' : '') + ' fit with nothing left over.', 'good');

  if (Math.abs(qv - 6) < 1e-9 && c.d < 1) st.seen.six = true;
  if (qv > c.a + 1e-9) st.seen.bigger = true;
  if (c.full >= 1 && c.left > 0) st.seen.partial = true;
  if (qv < 1 - 1e-9) st.seen.lessOne = true;
  if (q[0] === 8 && q[1] === 3 && !(st.dn * 4 === st.dd * 3)) st.seen.same = true;
  ch.update();
});
draw();

})();
</script>
</body></html>
