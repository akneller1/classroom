<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sampling Distribution Lab · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script src="../interactive-math/lab-stats.js?v=20261108"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Statistics", "unit": "Anticipating Patterns", "title": "Sampling Distribution Lab", "intro": "Take many random samples from a population and record one statistic from each. Compare the population, a single sample, and the distribution of the statistic."});
/* Sampling distributions. Means: a fixed population of 1,000 values (built from a fixed seed so μ and σ never change);
   each sample is n values drawn at random WITH replacement, so the SD of x̄ is exactly σ/√n in theory.
   Proportions: each draw is a success with probability p. Statistics are collected over many samples. */
var S = L.stats, R = S.rng(S.seedFromURL());
function makePop(kind) {
  var r = S.rng(20261108), v = [], i, x;
  for (i = 0; i < 1000; i++) {
    if (kind === 'skew') { do { x = 1 + -6 * Math.log(1 - r()); } while (x > 39); }
    else if (kind === 'uniform') x = 2 + 20 * r();
    else if (kind === 'bimodal') x = (i % 2 ? 6 : 18) + 1.6 * S.randNormal(r);
    else x = 12 + 3 * S.randNormal(r);
    v.push(Math.max(0.05, Math.round(x * 10) / 10));
  }
  return v;
}
var POPS = { skew: { label: 'Strongly right-skewed', xmax: 40 }, uniform: { label: 'Uniform', xmax: 24 }, bimodal: { label: 'Bimodal', xmax: 24 }, normal: { label: 'Roughly normal', xmax: 24 } };
Object.keys(POPS).forEach(function (k) { var v = makePop(k); POPS[k].v = v; POPS[k].mu = S.mean(v); POPS[k].sigma = S.sd(v, true); });
var st = { stat: 'mean', pop: 'skew', p: 0.3, n: 5, stats: [], last: null, overlay: false, seen: {}, runs: {} };
function key() { return st.stat === 'mean' ? 'mean:' + st.pop + ':' + st.n : 'prop:' + st.p + ':' + st.n; }
function draw1() {
  var s = [], i;
  if (st.stat === 'mean') { var v = POPS[st.pop].v; for (i = 0; i < st.n; i++) s.push(v[Math.floor(R() * v.length)]); st.last = s; st.stats.push(S.mean(s)); }
  else { var c = 0; for (i = 0; i < st.n; i++) if (R() < st.p) c++; st.last = c; st.stats.push(c / st.n); }
}
function drawK(k) { for (var i = 0; i < k; i++) draw1(); var rk = key(); st.runs[rk] = { count: st.stats.length, sd: S.sd(st.stats), skew: skewness(st.stats), mean: S.mean(st.stats) }; check(); draw(); }
function clearAll() { st.stats = []; st.last = null; draw(); }
function skewness(a) { if (a.length < 3) return 0; var m = S.mean(a), s = S.sd(a, true), t = 0; if (!s) return 0; a.forEach(function (x) { t += Math.pow((x - m) / s, 3); }); return t / a.length; }

/* stage: three graphs that share one horizontal scale */
var GP = { xmin: 0, xmax: 40, ymin: 0, ymax: 1, width: 640, height: 170, noYAxis: true, label: 'Population' };
var GS = { xmin: 0, xmax: 40, ymin: 0, ymax: 1, width: 640, height: 90, noYAxis: true, noGrid: true, label: 'Latest sample' };
var GD = { xmin: 0, xmax: 40, ymin: 0, ymax: 1, width: 640, height: 230, noYAxis: true, yfmt: function () { return ''; }, label: 'Distribution of the sample statistic' };
function cap(t) { return L.h('p', { class: 'sub', style: 'margin:6px 6px 0;font-weight:700' }, P.stage, t); }
var c1 = cap('1. Population'), gP = L.graph(P.stage, GP);
var c2 = cap('2. The latest sample'), gS = L.graph(P.stage, GS);
var c3 = cap('3. Sampling distribution: one value of the statistic from each sample'), gD = L.graph(P.stage, GD);

L.chips(P.panel, { label: 'Statistic', value: st.stat, options: [{ value: 'mean', label: 'Sample mean x̄' }, { value: 'prop', label: 'Sample proportion p̂' }], onChange: function (v) { st.stat = v; build(); clearAll(); } });
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var sn = L.slider(P.panel, { id: 'sample-size', label: 'Sample size n', min: 1, max: 100, value: st.n, color: 'purple', format: L.num, onInput: function (v) { st.n = v; clearAll(); } });
L.h('p', { class: 'lp-mini' }, P.panel, 'Changing the population or n clears the collected samples.');
var row = L.h('div', { class: 'btn-row' }, P.panel);
L.button(row, 'Draw 1 sample', function () { drawK(1); });
L.button(row, 'Draw 100', function () { drawK(100); }, true);
L.button(row, 'Draw 1,000', function () { drawK(1000); }, true);
var row2 = L.h('div', { class: 'btn-row' }, P.panel);
var bO = L.button(row2, 'Overlay normal model', function () { st.overlay = !st.overlay; bO.textContent = st.overlay ? 'Hide normal model' : 'Overlay normal model'; draw(); }, true);
L.button(row2, 'Clear samples', clearAll, true);
L.reset(row2, function () { st.stat = 'mean'; st.pop = 'skew'; st.p = 0.3; st.n = 5; st.overlay = false; bO.textContent = 'Overlay normal model'; sn.set(5, true); P.panel.querySelector('.chips button').click(); clearAll(); });
var tbl = L.table(P.panel);
var fb = L.feedback(P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Predict, then test: with <b>n = 1</b>, draw at least 500 samples from the skewed population. What does the distribution of x̄ look like?', check: function () { return st.seen.n1; } },
  { text: 'Find a sample size that makes the distribution of x̄ approximately normal even though the population is strongly skewed (500 or more samples).', check: function () { return st.seen.clt; } },
  { text: 'For one population, collect 500+ samples at some n, then at <b>4 times</b> that n. How did the SD of x̄ change?', check: function () { return st.seen.quad; } },
  { text: 'Draw one sample of n ≥ 50 from the <b>bimodal</b> population. Is the <b>sample</b> normal, or is the <b>sampling distribution</b>?', check: function () { return st.seen.bimodalSample; } },
  { text: 'With p̂ and p = 0.1, collect 500+ samples at n = 20 and at the smallest n that meets the Large Counts condition. Compare the shapes.', check: function () { return st.seen.largeCounts; } }
]);
L.notice(P.below, '<p><b>A sampling distribution is the distribution of a statistic over many samples</b> of the same size. It is not the distribution of one sample (graph 2 looks like the population) and not the population (graph 1).</p>' +
  '<p>Its center is the parameter: the mean of x̄ is μ and the mean of p̂ is p, so these statistics are <b>unbiased</b>. Its spread shrinks as n grows: SD(x̄) = σ/√n and SD(p̂) = √(p(1 − p)/n). Quadrupling n halves the spread.</p>' +
  '<p><b>Central Limit Theorem:</b> for large enough n, the distribution of x̄ is approximately normal whatever the population’s shape. The more skewed the population, the larger n must be. For p̂, check the Large Counts condition: np ≥ 10 and n(1 − p) ≥ 10.</p>' +
  '<p>The table’s simulated values are estimates; they change a little every time.</p>');
function build() {
  ctrl.innerHTML = '';
  if (st.stat === 'mean') L.chips(ctrl, { label: 'Population', value: st.pop, options: Object.keys(POPS).map(function (k) { return { value: k, label: POPS[k].label }; }), onChange: function (v) { st.pop = v; clearAll(); } });
  else L.slider(ctrl, { id: 'population-p', label: 'Population proportion of successes p', min: 0.05, max: 0.95, step: 0.05, value: st.p, color: 'orange', format: function (v) { return L.num(v, 2); }, onInput: function (v) { st.p = v; clearAll(); } });
  c3.textContent = '3. Sampling distribution: one ' + (st.stat === 'mean' ? 'x̄' : 'p̂') + ' from each sample';
}
function check() {
  var r = st.runs, k = key();
  if (st.stat === 'mean' && st.pop === 'skew' && st.n === 1 && st.stats.length >= 500) st.seen.n1 = true;
  if (st.stat === 'mean' && st.pop === 'skew' && st.stats.length >= 500 && Math.abs(skewness(st.stats)) < 0.35 && st.n >= 15) st.seen.clt = true;
  if (st.stats.length >= 500) Object.keys(r).forEach(function (o) { var a = o.split(':'), b = k.split(':'); if (a[0] === b[0] && a[1] === b[1] && r[o].count >= 500 && (+b[2] === 4 * +a[2] || +a[2] === 4 * +b[2])) st.seen.quad = true; });
  if (st.stat === 'mean' && st.pop === 'bimodal' && st.n >= 50 && st.last) st.seen.bimodalSample = true;
  if (st.stat === 'prop' && Math.abs(st.p - 0.1) < 1e-9) { var a20 = r['prop:0.1:20'], a100 = r['prop:0.1:100']; if (a20 && a20.count >= 500 && a100 && a100.count >= 500) st.seen.largeCounts = true; }
}
var draw = L.scheduler(function () {
  var mean = st.stat === 'mean', P0 = POPS[st.pop];
  var xmax = mean ? P0.xmax : 1, xmin = 0;
  [[gP, GP], [gS, GS], [gD, GD]].forEach(function (q) { L.setNiceView(q[0], q[1], { xmin: xmin - xmax * 0.02, xmax: xmax * 1.02 }, 0, 10); q[0].clear(); });
  /* population */
  if (mean) {
    var w = xmax / 40, counts = []; for (var i = 0; i < 40; i++) counts.push(0);
    P0.v.forEach(function (x) { counts[Math.min(39, Math.floor(x / w))]++; });
    var top = Math.max.apply(null, counts); gP.setView({ ymin: -top * 0.08, ymax: top * 1.15 });
    counts.forEach(function (c, i) { if (c) gP.rect(i * w, 0, w, c, { fill: 'blue', opacity: 0.45, stroke: 'ink', width: 1 }); });
    gP.line(P0.mu, 0, P0.mu, top * 1.1, { color: 'red', width: 3 }); gP.text(P0.mu, top * 1.05, 'μ = ' + L.num(P0.mu, 2), { dx: 6, color: 'red', size: 13 });
  } else {
    gP.setView({ ymin: -0.08, ymax: 1.15 });
    gP.rect(0, 0, st.p, 1, { fill: 'green', opacity: 0.45, stroke: 'ink', width: 1 }); gP.rect(st.p, 0, 1 - st.p, 1, { fill: 'ghost', opacity: 0.35, stroke: 'ink', width: 1 });
    gP.text(st.p / 2, 0.5, 'successes ' + L.num(st.p * 100) + '%', { anchor: 'middle', size: 13 }); gP.line(st.p, 0, st.p, 1.1, { color: 'red', width: 3 }); gP.text(st.p, 1.05, 'p = ' + L.num(st.p, 2), { dx: 6, color: 'red', size: 13 });
  }
  /* latest sample */
  gS.setView({ ymin: 0, ymax: 1 });
  if (st.last !== null) {
    if (mean) { st.last.forEach(function (x, j) { gS.dot(x, 0.25 + 0.5 * ((j * 0.618) % 1), { color: 'purple', r: st.n > 50 ? 3.5 : 5 }); }); var xb = S.mean(st.last); gS.line(xb, 0, xb, 1, { color: 'orange', width: 3 }); gS.text(xb, 0.85, 'x̄ = ' + L.num(xb, 2), { dx: 6, color: 'orange', size: 13 }); }
    else { var ph = st.last / st.n; gS.rect(0, 0.3, ph, 0.4, { fill: 'green', opacity: 0.5 }); gS.line(ph, 0, ph, 1, { color: 'orange', width: 3 }); gS.text(ph, 0.85, st.last + ' of ' + st.n + ': p̂ = ' + L.num(ph, 3), { dx: 6, color: 'orange', size: 13 }); }
  } else gS.text(xmax / 2, 0.5, 'Draw a sample', { anchor: 'middle', color: 'ink-soft', size: 14 });
  /* sampling distribution */
  var vals = st.stats, theoMean = mean ? P0.mu : st.p, theoSD = mean ? P0.sigma / Math.sqrt(st.n) : Math.sqrt(st.p * (1 - st.p) / st.n);
  var bw = mean ? xmax / 80 : (1 / st.n <= 0.0125 ? 0.0125 : 1 / st.n), x0 = mean ? 0 : -bw / 2, nb = Math.ceil((xmax - x0) / bw) + 1;
  var cnt = []; for (i = 0; i < nb; i++) cnt.push(0); vals.forEach(function (x) { var k = Math.floor((x - x0) / bw + 1e-9); if (k >= 0 && k < nb) cnt[k]++; });
  var dens = cnt.map(function (c) { return vals.length ? c / (vals.length * bw) : 0; }), topD = Math.max(1e-9, Math.max.apply(null, dens), st.overlay ? S.normPdf(0) / theoSD : 0);
  gD.setView({ ymin: -topD * 0.08, ymax: topD * 1.15 });
  dens.forEach(function (d, i) { if (d) gD.rect(x0 + i * bw, 0, bw, d, { fill: 'orange', opacity: 0.6, stroke: 'ink', width: 0.8 }); });
  gD.line(theoMean, 0, theoMean, topD * 1.1, { color: 'red', width: 2, dash: '6 5' });
  if (st.overlay) gD.fn(function (x) { return S.normPdf((x - theoMean) / theoSD) / theoSD; }, { color: 'purple', width: 3, samples: 500 });
  if (!vals.length) gD.text(xmax / 2, topD * 0.5, 'Statistics from your samples pile up here', { anchor: 'middle', color: 'ink-soft', size: 14 });
  /* table */
  var sym = mean ? 'x̄' : 'p̂', simSD = vals.length > 1 ? S.sd(vals) : NaN;
  tbl.set(['', 'Center', 'Spread'], [
    ['Population', (mean ? 'μ = ' : 'p = ') + L.num(theoMean, 3), mean ? 'σ = ' + L.num(P0.sigma, 3) : '—'],
    ['Simulated ' + sym + ' (' + vals.length.toLocaleString() + ' samples)', vals.length ? L.num(S.mean(vals), 3) : '—', vals.length > 1 ? L.num(simSD, 3) : '—'],
    ['Theory', L.num(theoMean, 3), (mean ? 'σ/√n = ' : '√(p(1−p)/n) = ') + L.num(theoSD, 3)]]);
  var lc = st.n * st.p, lf = st.n * (1 - st.p);
  if (!mean) fb.set('Large Counts: np = ' + L.num(lc, 1) + ', n(1 − p) = ' + L.num(lf, 1) + (lc >= 10 && lf >= 10 ? '. Both are at least 10, so a normal model is reasonable.' : '. At least one is below 10, so the distribution of p̂ may be too skewed or lumpy for a normal model.'), lc >= 10 && lf >= 10 ? 'good' : 'warn');
  else if (vals.length >= 100) { var sk = skewness(vals); fb.set('Skewness of the ' + vals.length.toLocaleString() + ' sample means ≈ ' + L.num(sk, 2) + (Math.abs(sk) < 0.35 ? ': close to symmetric, so a normal model fits well.' : ': still noticeably skewed. A larger n would help.'), Math.abs(sk) < 0.35 ? 'good' : ''); }
  else fb.set('Collect at least 100 samples to judge the shape of the sampling distribution.', '');
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
