<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parallelogram &amp; Triangle Area Lab · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "6th Grade Math", "unit": "Geometry", "title": "Parallelogram & Triangle Area Lab", "intro": "Lean a parallelogram or a triangle on the grid. Some things change and some don’t: watch which ones decide the area."});
/* Parallelogram (0,0),(b,0),(b+s,h),(s,h) and triangle (0,0),(b,0),(s,h) on a unit grid.
   Leaning the top (changing s) keeps base and height, so the area stays the same. */
var st = { shape: 'para', b: 6, h: 4, s: 0, cut: false, copy: false, seen: {} };
var g = L.graph(P.stage, { xmin: -5, xmax: 17, ymin: -1.2, ymax: 9, width: 640, height: 300, xstep: 1, ystep: 1, noLabels: true, noYAxis: true, label: 'Shape on a grid of unit squares' });
L.h('p', { class: 'sub', style: 'margin:4px 6px 0' }, P.stage, 'Each grid square is 1 square unit. Drag the orange corner to lean the shape or change its height.');
var legend = L.h('div', { class: 'legend', style: 'margin:6px' }, P.stage);
L.chips(P.panel, { label: 'Shape', value: st.shape, options: [{ value: 'para', label: 'Parallelogram' }, { value: 'tri', label: 'Triangle' }], onChange: function (v) { st.shape = v; st.cut = false; st.copy = false; build(); draw(); } });
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var sb = L.slider(P.panel, { id: 'base', label: 'base', min: 1, max: 8, value: st.b, color: 'blue', format: L.num, onInput: function (v) { st.b = v; draw(); } });
var sh = L.slider(P.panel, { id: 'height', label: 'height', min: 1, max: 8, value: st.h, color: 'green', format: L.num, onInput: function (v) { st.h = v; draw(); } });
var ss = L.slider(P.panel, { id: 'lean', label: 'lean (how far the top slides)', min: -4, max: 8, value: st.s, color: 'orange', format: L.num, onInput: function (v) { st.s = v; draw(); } });
var btns = L.h('div', { class: 'btn-row' }, P.panel);
var bCut = L.button(btns, '', function () { if (st.shape === 'para') st.cut = !st.cut; else st.copy = !st.copy; build(); draw(); });
L.reset(btns, function () { st.b = 6; st.h = 4; st.s = 0; st.cut = st.copy = false; sb.set(6, true); sh.set(4, true); ss.set(0, true); build(); draw(); });
var info = L.h('dl', { class: 'kv' }, P.panel);
var fb = L.feedback(P.panel);
var ch = L.challenges(P.panel, [
  { text: 'Lean the parallelogram at least 3 units. Predict first: does its area change?', check: function () { return st.seen.lean; } },
  { text: 'Make a parallelogram with an area of 24 square units that is <b>not</b> a rectangle.', check: function () { return st.seen.p24; } },
  { text: 'A classmate finds area with base × slanted side. Make a parallelogram where that answer is wrong by more than 10.', check: function () { return st.seen.wrong10; } },
  { text: 'Show the copy of a triangle. Explain why a triangle’s area is half of base × height.', check: function () { return st.seen.copy; } },
  { text: 'Make a triangle with an area of 12 whose top vertex is <b>not</b> above the base. Where is its height?', check: function () { return st.seen.t12out; } }
]);
L.notice(P.below, '<p><b>Area depends on the base and the height, not on the slanted sides.</b> Leaning a parallelogram slides its top edge, but the base and the height (the straight-up distance between the bases) stay the same, so the area stays base × height.</p>' +
  '<p>Cut off the triangle on one end and slide it to the other end: the parallelogram becomes a rectangle with the same base and height.</p>' +
  '<p>Two copies of any triangle make a parallelogram with the same base and height, so a triangle is <b>half</b>: ' + L.frac(1, 2) + ' × base × height. When the top vertex is past the end of the base, the height is measured outside the triangle.</p>');
function build() { bCut.textContent = st.shape === 'para' ? (st.cut ? 'Hide cut & slide' : 'Show cut & slide') : (st.copy ? 'Hide the copy' : 'Show the copy');
  legend.innerHTML = '<span><i style="background:var(--blue)"></i>base</span><span><i style="background:var(--green)"></i>height</span><span><i style="background:var(--orange)"></i>slanted side</span>' + (st.shape === 'tri' ? '<span><i style="background:var(--purple)"></i>rotated copy</span>' : ''); }
function areaTxt() {
  var A = st.b * st.h;
  if (st.shape === 'para') return 'Area = ' + L.V('b') + ' × ' + L.V('h') + ' = ' + st.b + ' × ' + st.h + ' = <b>' + A + '</b> square units';
  return 'Area = ' + L.frac(1, 2) + ' × ' + L.V('b') + ' × ' + L.V('h') + ' = ' + L.frac(1, 2) + ' × ' + st.b + ' × ' + st.h + ' = <b>' + L.nice(A / 2) + '</b> square units';
}
var draw = L.scheduler(function () {
  var b = st.b, h = st.h, s = st.s;
  g.clear();
  var pts = st.shape === 'para' ? [[0, 0], [b, 0], [b + s, h], [s, h]] : [[0, 0], [b, 0], [s, h]];
  if (st.shape === 'tri' && st.copy) g.poly([[b, 0], [b + s, h], [s, h]], { fill: 'purple', opacity: 0.18, stroke: 'purple', width: 3 });
  if (st.shape === 'para' && st.cut && s > 0 && s <= b) {
    g.poly([[0, 0], [s, 0], [s, h]], { fill: 'ghost', opacity: 0.25, stroke: 'ghost', width: 2 });
    g.poly([[b, 0], [b + s, 0], [b + s, h]], { fill: 'orange', opacity: 0.35, stroke: 'orange', width: 3 });
    g.rect(s, 0, b, h, { fill: 'none', stroke: 'green', width: 3 });
  } else if (st.shape === 'para' && st.cut && s < 0 && -s <= b) {
    g.poly([[b, 0], [b + s, 0], [b + s, h]], { fill: 'ghost', opacity: 0.25, stroke: 'ghost', width: 2 });
    g.poly([[0, 0], [s, 0], [s, h]], { fill: 'orange', opacity: 0.35, stroke: 'orange', width: 3 });
    g.rect(s, 0, b, h, { fill: 'none', stroke: 'green', width: 3 });
  }
  g.poly(pts, { fill: 'blue', opacity: 0.22, stroke: 'ink', width: 3 });
  g.line(0, 0, b, 0, { color: 'blue', width: 6 });
  var apx = s;   // where the height is drawn
  if (st.shape === 'para') { g.line(0, 0, s, h, { color: 'orange', width: 4 }); g.line(b, 0, b + s, h, { color: 'orange', width: 4 }); }
  else { g.line(0, 0, s, h, { color: 'orange', width: 4 }); g.line(b, 0, s, h, { color: 'orange', width: 4 }); }
  if (apx < 0 || apx > b) g.line(Math.min(0, apx), 0, Math.max(b, apx), 0, { color: 'blue', width: 2, dash: '6 5' });
  g.line(apx, 0, apx, h, { color: 'green', width: 4, dash: '8 6' });
  var sq = 0.45, dir = apx > b / 2 ? -1 : 1;
  g.poly([[apx, 0], [apx + dir * sq, 0], [apx + dir * sq, sq], [apx, sq]], { fill: 'none', stroke: 'green', width: 2 });
  g.text(apx, h / 2, 'h = ' + h, { dx: apx > b / 2 ? 12 : -12, anchor: apx > b / 2 ? 'start' : 'end', color: 'green' });
  g.text(b / 2, 0, 'b = ' + b, { dy: 24, anchor: 'middle', color: 'blue' });
  g.handle(s, h, { color: 'orange', snap: 1, label: 'Top corner (lean and height)', onDrag: function (x, y) {
    st.s = Math.max(-4, Math.min(8, Math.round(x))); st.h = Math.max(1, Math.min(8, Math.round(y))); ss.set(st.s, true); sh.set(st.h, true); draw(); } });

  var side = Math.sqrt(s * s + h * h), A = st.shape === 'para' ? b * h : b * h / 2;
  read.innerHTML = areaTxt();
  info.innerHTML = '<dt>Base</dt><dd>' + b + '</dd><dt>Height</dt><dd>' + h + '</dd><dt>Slanted side</dt><dd>' + (s === 0 ? h : '≈ ' + L.num(side, 2)) + '</dd>' +
    (st.shape === 'para' ? '<dt>base × slanted side</dt><dd>' + (s === 0 ? b * h : '≈ ' + L.num(b * side, 2)) + (s !== 0 ? ' <span class="c-red">(not the area)</span>' : '') + '</dd>' : '');
  if (st.shape === 'para') {
    if (!st.cut) fb.set(s === 0 ? 'With no lean this parallelogram is a rectangle. Lean it and watch the area.' : 'Leaning slides the top edge. The base and the height did not change.', '');
    else if (s === 0) fb.set('It is already a rectangle: nothing to cut.', '');
    else if (Math.abs(s) <= b) fb.set('Cut off the gray triangle and slide it to the orange spot. The pieces make a ' + b + ' by ' + h + ' rectangle, so the area is ' + A + '.', 'good');
    else fb.set('This one leans so far that a single cut is not enough. Cutting it into more slices still rebuilds a ' + b + ' by ' + h + ' rectangle, so the area is still ' + A + '.', 'warn');
  } else fb.set(st.copy ? 'The triangle and its rotated copy fit together into a parallelogram with base ' + b + ' and height ' + h + '. The triangle is half of it.' : (s < 0 || s > b ? 'The top vertex is past the end of the base, so the height is measured outside the triangle.' : 'Drag the top vertex. The area only changes when the base or the height changes.'), st.copy ? 'good' : '');

  if (st.shape === 'para' && Math.abs(s) >= 3) st.seen.lean = true;
  if (st.shape === 'para' && b * h === 24 && s !== 0) st.seen.p24 = true;
  if (st.shape === 'para' && b * side - b * h > 10) st.seen.wrong10 = true;
  if (st.shape === 'tri' && st.copy) st.seen.copy = true;
  if (st.shape === 'tri' && b * h === 24 && (s < 0 || s > b)) st.seen.t12out = true;
  ch.update();
});
build(); draw();

})();
</script>
</body></html>
