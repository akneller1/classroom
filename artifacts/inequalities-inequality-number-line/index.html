<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inequality Number Line · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Algebra 1", "unit": "Linear Inequalities", "title": "Inequality Number Line", "intro": "Test numbers against an inequality and watch the graph. Then multiply both sides by a negative and see what has to happen to the symbol."});
var SYM = { lt: '<', le: '≤', gt: '>', ge: '≥' };
var FLIP = { lt: 'gt', le: 'ge', gt: 'lt', ge: 'le' };
function holds(a, s, b) { return s === 'lt' ? a < b : s === 'le' ? a <= b : s === 'gt' ? a > b : a >= b; }
var st = { mode: 'graph', sym: 'ge', bound: 2, test: 5, falseFound: false, seen: {}, A: 4, B: 1, op: 'mul', k: -2, flipped: false, brokeIt: false, fixedIt: false, keptTrue: false };
L.tabs(P.stage, [{ id: 'graph', label: 'Graph and test' }, { id: 'flip', label: 'Why does the symbol flip?' }], function (id) { st.mode = id; build(); draw(); });
var W = 640, H = 300;
var svg = L.s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Number line' }, P.stage);
var read = L.h('div', { class: 'readout', 'aria-live': 'polite' }, P.panel);
var ctrl = L.h('div', { style: 'display:grid;gap:12px' }, P.panel);
var chBox = L.h('div', null, P.panel), ch;
var X0 = 40, X1 = W - 40, LO = -10, HI = 10;
function X(v) { return X0 + (v - LO) / (HI - LO) * (X1 - X0); }
function axis(y) {
  L.s('line', { x1: X0 - 20, x2: X1 + 20, y1: y, y2: y, stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
  L.s('path', { d: 'M' + (X1 + 26) + ' ' + y + ' l -12 -7 v 14 z M' + (X0 - 26) + ' ' + y + ' l 12 -7 v 14 z', fill: 'var(--ink)' }, svg);
  for (var v = LO; v <= HI; v++) {
    L.s('line', { x1: X(v), x2: X(v), y1: y - 8, y2: y + 8, stroke: 'var(--ink)', 'stroke-width': v % 5 ? 1.5 : 2.5 }, svg);
    var t = L.s('text', { x: X(v), y: y + 28, 'text-anchor': 'middle', class: 'g-tick', 'font-size': 13 }, svg); t.textContent = L.num(v);
  }
}
function build() {
  ctrl.innerHTML = ''; chBox.innerHTML = '';
  if (st.mode === 'graph') {
    L.chips(ctrl, { label: 'Symbol', value: st.sym, options: Object.keys(SYM).map(function (k) { return { value: k, label: L.V('x') + ' ' + SYM[k] }; }), onChange: function (v) { st.sym = v; draw(); } });
    L.slider(ctrl, { id: 'boundary', label: 'Boundary number', min: -8, max: 8, value: st.bound, color: 'blue', format: L.num, onInput: function (v) { st.bound = v; draw(); } });
    L.slider(ctrl, { id: 'test', label: 'Test point (or drag the orange point)', min: -10, max: 10, step: 0.5, value: st.test, color: 'orange', format: L.nice, onInput: function (v) { st.test = v; draw(); } });
    st.testSlider = ctrl.querySelector('#sl-test');
    ch = L.challenges(chBox, [
      { text: 'Make a graph with an <b>open</b> circle.', check: function () { return st.seen.open; } },
      { text: 'Make a graph with a <b>closed</b> circle shaded to the left.', check: function () { return st.seen.closedLeft; } },
      { text: 'Find a test point that makes the inequality <b>false</b>.', check: function () { return st.falseFound; } },
      { text: 'Graph ' + L.V('x') + ' ≥ −3.', check: function () { return st.sym === 'ge' && st.bound === -3; } },
      { text: 'Test the boundary number itself in ' + L.V('x') + ' &lt; 2 and in ' + L.V('x') + ' ≤ 2. Which one includes it?', check: function () { return st.seen.bLt && st.seen.bLe; } }
    ]);
  } else {
    L.slider(ctrl, { id: 'A', label: 'Left number', min: -6, max: 6, value: st.A, color: 'blue', format: L.num, onInput: function (v) { st.A = v; st.flipped = false; draw(); } });
    L.slider(ctrl, { id: 'B', label: 'Right number', min: -6, max: 6, value: st.B, color: 'purple', format: L.num, onInput: function (v) { st.B = v; st.flipped = false; draw(); } });
    L.chips(ctrl, { label: 'Do this to both sides', value: st.op, options: [{ value: 'add', label: 'Add' }, { value: 'mul', label: 'Multiply by' }, { value: 'div', label: 'Divide by' }], onChange: function (v) { st.op = v; st.flipped = false; draw(); } });
    L.slider(ctrl, { id: 'k', label: 'Number', min: -4, max: 4, value: st.k, color: 'orange', format: L.num, onInput: function (v) { st.k = v; st.flipped = false; draw(); } });
    var row = L.h('div', { class: 'btn-row' }, ctrl);
    L.button(row, 'Flip the symbol', function () { st.flipped = !st.flipped; draw(); });
    ch = L.challenges(chBox, [
      { text: 'Find a true statement and an operation that keeps it true.', check: function () { return st.keptTrue; } },
      { text: 'Find an operation that makes the statement <b>false</b>.', check: function () { return st.brokeIt; } },
      { text: 'Make it true again by flipping the symbol.', check: function () { return st.fixedIt; } },
      { text: 'Multiply by 0. Why can\'t we use 0?', check: function () { return st.op === 'mul' && st.k === 0; } }
    ]);
  }
}
function arrowRay(y, b, dir, closed, color) {
  var end = dir > 0 ? X1 + 18 : X0 - 18;
  L.s('line', { x1: X(b), x2: end, y1: y, y2: y, stroke: color, 'stroke-width': 10, 'stroke-linecap': 'butt', opacity: .85 }, svg);
  L.s('path', { d: dir > 0 ? 'M' + (end + 14) + ' ' + y + ' l -16 -12 v 24 z' : 'M' + (end - 14) + ' ' + y + ' l 16 -12 v 24 z', fill: color }, svg);
  L.s('circle', { cx: X(b), cy: y, r: 11, fill: closed ? color : 'var(--card)', stroke: color, 'stroke-width': 4 }, svg);
}
var draw = L.scheduler(function () {
  svg.innerHTML = '';
  if (st.mode === 'graph') {
    var y = 150, b = st.bound, s = st.sym, closed = s === 'le' || s === 'ge', dir = s === 'gt' || s === 'ge' ? 1 : -1;
    axis(y);
    arrowRay(y, b, dir, closed, 'var(--blue)');
    var ok = holds(st.test, s, b);
    var tx = X(st.test);
    L.s('line', { x1: tx, x2: tx, y1: y - 70, y2: y - 14, stroke: 'var(--orange)', 'stroke-width': 3, 'stroke-dasharray': '6 5' }, svg);
    var hnd = L.s('circle', { cx: tx, cy: y - 80, r: 14, fill: 'var(--orange)', stroke: 'var(--ink)', 'stroke-width': 3, class: 'g-handle', tabindex: 0, role: 'slider', 'aria-label': 'Test point' }, svg);
    var lab = L.s('text', { x: tx, y: y - 104, 'text-anchor': 'middle', class: 'g-label', 'font-size': 18, fill: ok ? 'var(--green)' : 'var(--red)' }, svg);
    lab.textContent = (ok ? '✓ ' : '✗ ') + L.num(st.test);
    hnd.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var mv = function (ev) { var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; var q = pt.matrixTransform(svg.getScreenCTM().inverse()); var v = Math.round(((q.x - X0) / (X1 - X0) * (HI - LO) + LO) * 2) / 2; st.test = Math.max(LO, Math.min(HI, v)); st.testSlider.value = st.test; st.testSlider.dispatchEvent(new Event('input')); };
      var up = function () { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
    if (!ok) st.falseFound = true;
    if (!closed) st.seen.open = true;
    if (closed && dir < 0) st.seen.closedLeft = true;
    if (st.test === b && b === 2) { if (s === 'lt') st.seen.bLt = true; if (s === 'le') st.seen.bLe = true; }
    var t2 = L.s('text', { x: W / 2, y: 262, 'text-anchor': 'middle', class: 'g-label', 'font-size': 16 }, svg);
    t2.textContent = closed ? 'Closed circle: ' + b + ' is included.' : 'Open circle: ' + b + ' is not included.';
    read.innerHTML = L.V('x') + ' ' + SYM[s] + ' ' + L.num(b) + '<div class="sub" style="margin-top:6px">Test ' + L.V('x') + ' = ' + L.nice(st.test) + ': ' + L.nice(st.test) + ' ' + SYM[s] + ' ' + L.num(b) + ' is <b class="' + (ok ? 'c-green">true' : 'c-red">false') + '</b></div>';
  } else {
    var A = st.A, B = st.B, s0 = A < B ? 'lt' : A > B ? 'gt' : null, k = st.k;
    var fa = function (v) { return st.op === 'add' ? v + k : st.op === 'mul' ? v * k : (k === 0 ? NaN : v / k); };
    var A2 = fa(A), B2 = fa(B), s1 = st.flipped && s0 ? FLIP[s0] : s0;
    var true2 = s1 && isFinite(A2) && holds(A2, s1, B2);
    axis(70); axis(210);
    L.s('circle', { cx: X(A), cy: 70, r: 10, fill: 'var(--blue)' }, svg); L.s('circle', { cx: X(B), cy: 70, r: 10, fill: 'var(--purple)' }, svg);
    if (isFinite(A2) && Math.abs(A2) <= 10) L.s('circle', { cx: X(A2), cy: 210, r: 10, fill: 'var(--blue)' }, svg);
    if (isFinite(B2) && Math.abs(B2) <= 10) L.s('circle', { cx: X(B2), cy: 210, r: 10, fill: 'var(--purple)' }, svg);
    if (isFinite(A2) && Math.abs(A2) <= 10) L.s('path', { d: 'M' + X(A) + ' 84 L ' + X(A2) + ' 196', stroke: 'var(--blue)', 'stroke-width': 2, 'stroke-dasharray': '5 5', fill: 'none' }, svg);
    if (isFinite(B2) && Math.abs(B2) <= 10) L.s('path', { d: 'M' + X(B) + ' 84 L ' + X(B2) + ' 196', stroke: 'var(--purple)', 'stroke-width': 2, 'stroke-dasharray': '5 5', fill: 'none' }, svg);
    var t3 = L.s('text', { x: 20, y: 30, class: 'g-label' }, svg); t3.textContent = 'Before';
    var t4 = L.s('text', { x: 20, y: 170, class: 'g-label' }, svg); t4.textContent = 'After';
    var opTxt = st.op === 'add' ? ' + ' + (k < 0 ? '(' + L.num(k) + ')' : L.num(k)) : st.op === 'mul' ? ' · ' + (k < 0 ? '(' + L.num(k) + ')' : L.num(k)) : '';
    var lhs = st.op === 'div' ? L.frac(L.num(A), k < 0 ? '(' + L.num(k) + ')' : L.num(k)) : L.num(A) + opTxt;
    var rhs = st.op === 'div' ? L.frac(L.num(B), k < 0 ? '(' + L.num(k) + ')' : L.num(k)) : L.num(B) + opTxt;
    if (!s0) read.innerHTML = 'Pick two different numbers.';
    else if (!isFinite(A2)) read.innerHTML = L.num(A) + ' ' + SYM[s0] + ' ' + L.num(B) + '<div class="sub c-red" style="margin-top:6px">You can\'t divide by 0.</div>';
    else {
      var zero = st.op === 'mul' && k === 0;
      read.innerHTML = L.num(A) + ' ' + SYM[s0] + ' ' + L.num(B) + ' &nbsp;<span class="c-green">true</span><div style="margin-top:8px">' + lhs + ' ' + SYM[s1] + ' ' + rhs + '</div><div class="sub" style="margin-top:4px">' + L.nice(A2) + ' ' + SYM[s1] + ' ' + L.nice(B2) + ' is <b class="' + (true2 ? 'c-green">true' : 'c-red">false') + '</b>' + (zero ? ' · multiplying by 0 makes both sides 0, so the order is lost.' : '') + '</div>';
      var neg = (st.op === 'mul' || st.op === 'div') && k < 0;
      if (true2 && !st.flipped && !zero) st.keptTrue = true;
      if (!true2 && !st.flipped && neg) st.brokeIt = true;
      if (true2 && st.flipped && neg) st.fixedIt = true;
    }
  }
  ch && ch.update();
});
build(); draw();

})();
</script>
</body></html>
