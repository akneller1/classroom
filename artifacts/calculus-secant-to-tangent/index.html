<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secant to Tangent · Mr. K's Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../interactive-math/lab.css?v=20261105">
</head><body><main id="app"></main><noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<script src="../interactive-math/lab.js?v=20261105"></script>
<script src="../interactive-math/lab-plus.js?v=20261107"></script>
<script>
(function () {
'use strict';
var L = Lab;
var P = L.layout({"course": "Calculus", "unit": "Derivatives", "title": "Secant to Tangent", "intro": "A secant line joins two points on a graph. Slide the second point closer from either side and watch the secant slopes, then build the slope graph f′."});
/* Secant through (a, f(a)) and (a + h, f(a + h)); h can be negative but never 0.
   The tangent slope f'(a) is known exactly for each function (undefined for |x| at 0). Visited (a, f'(a)) points build the derivative graph. */
var HS = [-1, -0.5, -0.1, -0.01, -0.001, 0.001, 0.01, 0.1, 0.5, 1];
var FN = {
  sq: { label: 'x²', f: function (x) { return x * x; }, d: function (x) { return 2 * x; }, v: [-1, 9], dv: [-7, 7], dname: '2' + L.V('x') },
  cub: { label: 'x³ − 3x', f: function (x) { return x * x * x - 3 * x; }, d: function (x) { return 3 * x * x - 3; }, v: [-5, 5], dv: [-4, 24], dname: '3' + L.V('x') + '² − 3' },
  sin: { label: 'sin x', f: Math.sin, d: Math.cos, v: [-1.6, 1.6], dv: [-1.6, 1.6], dname: 'cos ' + L.V('x') },
  exp: { label: 'eˣ', f: Math.exp, d: Math.exp, v: [-1, 12], dv: [-1, 12], dname: 'e<sup>' + L.V('x') + '</sup>' },
  abs: { label: '|x|', f: Math.abs, d: function (x) { return x === 0 ? NaN : x > 0 ? 1 : -1; }, v: [-1, 3.5], dv: [-2, 2], dname: '1 for ' + L.V('x') + ' &gt; 0, −1 for ' + L.V('x') + ' &lt; 0' }
};
var st = { fn: 'sq', a: 1, hi: 8, tan: false, showD: false, traced: {}, sides: {}, seen: {} };
function F() { return FN[st.fn]; }
function h() { return HS[st.hi]; }
var GO = { xmin: -3.5, xmax: 3.5, ymin: -1, ymax: 9, width: 600, height: 420, xstep: 0.5, xlabelStep: 1, label: 'Graph of f with a secant line' }, g = L.graph(P.stage, GO);
L.h('div', { class: 'legend', style: 'margin:6px' }, P.stage, '<span><i style="background:var(--blue)"></i>f</span><span><i style="background:var(--orange)"></i>secant line</span><span><i style="background:var(--green)"></i>tangent line</span><span><i style="background:var(--purple)"></i>slopes you have found (graph of f′)</span>');
var GDO = { xmin: -3.5, xmax: 3.5, ymin: -7, ymax: 7, width: 600, height: 220, xstep: 0.5, xlabelStep: 1, label: 'Slope of f at each point: the derivative graph' }, gd = L.graph(P.stage, GDO);
L.h('p', { class: 'sub', style: 'margin:0 6px' }, P.stage, 'Bottom graph: each purple point is (a, slope of the tangent at a).');
L.chips(P.panel, { label: 'Function f(x)', value: st.fn, options: Object.keys(FN).map(function (k) { return { value: k, label: FN[k].label }; }), onChange: function (v) { st.fn = v; st.traced = {}; st.sides = {}; draw(); } });
var read = L.h('div', { class: 'readout small', 'aria-live': 'polite' }, P.panel);
var sa = L.slider(P.panel, { id: 'point-a', label: 'Point a (or drag the green point)', min: -3, max: 3, step: 0.25, value: st.a, color: 'green', format: L.nice, onInput: function (v) { st.a = v; draw(); } });
var sh = L.slider(P.panel, { id: 'step-h', label: 'Second point: a + h', min: 0, max: HS.length - 1, value: st.hi, color: 'orange', format: function (i) { return 'h = ' + HS[i]; }, onInput: function (i) { st.hi = i; draw(); } });
var btns = L.h('div', { class: 'btn-row' }, P.panel);
var bT = L.button(btns, 'Show tangent line', function () { st.tan = !st.tan; bT.textContent = st.tan ? 'Hide tangent line' : 'Show tangent line'; draw(); }, true);
var bD = L.button(btns, 'Show the whole f′ graph', function () { st.showD = !st.showD; bD.textContent = st.showD ? 'Hide the f′ graph' : 'Show the whole f′ graph'; draw(); }, true);
L.reset(btns, function () { st.a = 1; st.hi = 8; st.tan = false; st.showD = false; st.traced = {}; st.sides = {}; sa.set(1, true); sh.set(8, true); bT.textContent = 'Show tangent line'; bD.textContent = 'Show the whole f′ graph'; draw(); });
var tbl = L.table(P.panel);
var fb = L.feedback(P.panel);
var ch = L.challenges(P.panel, [
  { text: 'For ' + L.V('x') + '² at a = 1, shrink h until the secant slope is within 0.01 of the tangent slope. Why can’t h be 0?', check: function () { return st.seen.close; } },
  { text: 'Approach from the <b>left</b> too: use a negative h of size 0.01 or smaller and a positive one at the same a. Do the slopes agree?', check: function () { return st.seen.both; } },
  { text: 'For ' + L.V('x') + '³ − 3' + L.V('x') + ', find every point a where the tangent line is horizontal.', check: function () { return st.seen.flat1 && st.seen.flatm1; } },
  { text: 'For |' + L.V('x') + '| at a = 0, compare h = −0.01 and h = 0.01. Why is there no tangent slope there?', check: function () { return st.seen.corner; } },
  { text: 'For sin ' + L.V('x') + ', visit at least 8 different points a and build the slope graph. Which function does it look like?', check: function () { return st.fn === 'sin' && Object.keys(st.traced).length >= 8; } },
  { text: 'For e<sup>' + L.V('x') + '</sup>, compare the height of the graph with its slope at three points. What do you notice?', check: function () { return st.fn === 'exp' && Object.keys(st.traced).length >= 3; } }
]);
L.notice(P.below, '<p><b>The slope of the tangent line is the limit of secant slopes:</b> f′(a) = lim<sub>h→0</sub> ' + L.frac('f(a + h) − f(a)', 'h') + '. The secant needs two different points, so h is never 0; the tangent slope is the number the secant slopes approach.</p>' +
  '<p>The secant slopes must approach the <b>same</b> number from the left (h &lt; 0) and the right (h &gt; 0). At a corner like |x| at 0 they don’t, so f is not differentiable there even though it is continuous.</p>' +
  '<p>Recording the tangent slope at many points builds the graph of f′. Where f is increasing, f′ &gt; 0; where f has a horizontal tangent, f′ = 0. The table values are approximations; the tangent slope comes from the limit.</p>');
var draw = L.scheduler(function () {
  var fn = F(), a = st.a, hv = h(), fa = fn.f(a), b = a + hv, fb2 = fn.f(b), q = (fb2 - fa) / hv, d = fn.d(a);
  L.setNiceView(g, GO, { ymin: fn.v[0], ymax: fn.v[1] }, 8); g.clear();
  L.setNiceView(gd, GDO, { ymin: fn.dv[0], ymax: fn.dv[1] }, 4); gd.clear();
  g.fn(fn.f, { color: 'blue', samples: 800 });
  g.fullLine(a, fa, b, fb2, { color: 'orange', width: 3 });
  if (st.tan && isFinite(d)) g.fullLine(a, fa, a + 1, fa + d, { color: 'green', width: 3, dash: '10 6' });
  g.line(a, fa, b, fa, { color: 'orange', width: 2, dash: '3 4', opacity: 0.7 });
  g.line(b, fa, b, fb2, { color: 'orange', width: 2, dash: '3 4', opacity: 0.7 });
  g.dot(b, fb2, { color: 'orange', r: 7, stroke: 'ink', strokeWidth: 2 });
  g.handle(a, fa, { color: 'green', snap: 0.25, label: 'Point a on the graph', onDrag: function (x) { st.a = Math.max(-3, Math.min(3, x)); sa.set(st.a, true); draw(); } });
  /* derivative graph */
  if (st.showD) gd.fn(function (x) { return fn.d(x); }, { color: 'purple', width: 2, dash: '6 6', opacity: 0.6, samples: 800 });
  if (isFinite(d)) st.traced[a] = d;
  Object.keys(st.traced).forEach(function (k) { gd.dot(+k, st.traced[k], { color: 'purple', r: 6 }); });
  gd.line(a, -100, a, 100, { color: 'green', width: 1.5, dash: '4 5' });
  /* readout and table */
  read.innerHTML = 'secant slope = ' + L.frac('f(' + L.num(b, 4) + ') − f(' + L.num(a, 4) + ')', L.num(hv)) + ' = ' + L.num(q, 6) + (Math.abs(hv) < 0.5 ? ' (approx.)' : '') +
    '<div class="sub" style="margin-top:6px">tangent slope f′(' + L.nice(a) + ') = ' + (st.tan ? (isFinite(d) ? L.num(d, 4) : 'does not exist') : '? (show the tangent line)') + '</div>';
  var rows = [-0.1, -0.01, -0.001, 0.001, 0.01, 0.1].map(function (hh) { return [L.num(hh), L.num((fn.f(a + hh) - fa) / hh, 6)]; });
  tbl.set(['h', L.frac('f(a + h) − f(a)', 'h')], rows);
  fb.set(!isFinite(d) ? 'At a corner the secant slopes from the left and from the right approach different numbers (−1 and 1), so there is no single tangent slope.' :
    'Secant slope minus tangent slope: ' + L.num(q - d, 6) + '. ' + (Math.abs(hv) >= 0.1 ? 'Make |h| smaller.' : 'Close: the secant slopes are approaching f′(' + L.nice(a) + ') = ' + L.num(d, 4) + '.'), isFinite(d) && Math.abs(q - d) <= 0.01 + 1e-9 ? 'good' : '');
  if (st.fn === 'sq' && a === 1 && Math.abs(q - 2) <= 0.01 + 1e-9) st.seen.close = true;
  if (Math.abs(hv) <= 0.01) { var key = st.fn + ':' + a; st.sides[key] = st.sides[key] || {}; st.sides[key][hv < 0 ? 'L' : 'R'] = true; if (st.sides[key].L && st.sides[key].R) { st.seen.both = true; if (st.fn === 'abs' && a === 0) st.seen.corner = true; } }
  if (st.fn === 'cub' && a === 1) st.seen.flat1 = true;
  if (st.fn === 'cub' && a === -1) st.seen.flatm1 = true;
  ch.update();
});
draw();

})();
</script>
</body></html>
