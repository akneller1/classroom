name: Verify unified Mr. K's Classroom site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Classroom website
        uses: actions/checkout@v4
        with:
          path: classroom
          fetch-depth: 1
      - name: Check out Grade 5 source repository
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: main
          path: grade5-source
          fetch-depth: 1
      - name: Verify Grade 5 banks and source tests
        run: |
          set -euo pipefail
          node --test classroom/tests/grade5-course-discovery.test.cjs
          (cd grade5-source && node --test tests/grade5-generators.test.mjs tests/grade5-unified.test.mjs tests/grade5-error-analysis.test.mjs)
          (cd grade5-source && node scripts/test-grade5.cjs)
      - name: Assemble and audit the release artifact (validation only)
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='tests/' --exclude='tools/' --exclude='*.zip' \
            classroom/ site/
          GRADE5_SOURCE_DIR=grade5-source GRADE5_OUTPUT_DIR=site node classroom/scripts/integrate-approved-courses.mjs
          node classroom/scripts/test-grade5-deployment.cjs site
          node classroom/scripts/audit-grade5-release.cjs site
          test -f site/grade5/grade5.html
          test ! -f site/grade5/grade4.html
          du -sh site/grade5
# The Deploy site workflow is the sole GitHub Pages publisher.
# Do not deploy from this verification job, or it can overwrite Financial Algebra
# with an older/incomplete artifact while racing the actual production deploy.
