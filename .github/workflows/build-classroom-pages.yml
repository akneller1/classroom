name: Build unified Mr. K's Classroom site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Pull approved Grade 5 source updates from its separate repository nightly.
    - cron: '17 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: classroom-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Classroom website
        uses: actions/checkout@v4
        with:
          path: classroom
          fetch-depth: 1
      - name: Check out separate Grade 5 source repository
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: main
          path: grade5-source
          fetch-depth: 1
      - name: Verify Grade 5 source and production catalog
        shell: bash
        run: |
          set -euo pipefail
          node --test classroom/tests/grade5-course-discovery.test.cjs
          (cd grade5-source && node --test tests/grade5-generators.test.mjs tests/grade5-unified.test.mjs)
          (cd grade5-source && node scripts/test-grade5.cjs)
      - name: Assemble production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/grade5
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='tests/' --exclude='tools/' --exclude='*.zip' \
            classroom/ site/
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='tests/' --exclude='tools/' --exclude='*.zip' \
            grade5-source/ site/grade5/
          # Keep the source repositories separate, but host approved Grade 5
          # games, generators, banks, study guides and diagrams on one domain.
          cp grade5-source/grade5.html site/grade5/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/course-integrations.js')
          source = p.read_text()
          old = "var staging='https://akneller1.github.io/FinancialAlgebra/';"
          if old not in source:
              raise SystemExit('Grade 5 integration staging link marker changed')
          p.write_text(source.replace(old, "var staging='/grade5/';", 1))
          PY
          # Catch missing generator assets before deploying.
          for f in grade5/index.html grade5/worksheet-generator/grade5-generators.html \
            grade5/worksheet-generator/grade5/generators.js \
            grade5/worksheet-generator/grade5/generators-render.js \
            grade5/math5/place-value-number-sense.json \
            grade5/math5/data-line-plots-problem-solving.json; do
            test -f "site/$f" || { echo "Missing required $f" >&2; exit 1; }
          done
          touch site/.nojekyll
          du -sh site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
