name: Algebra 2 printable sections
on:
  push:
    paths:
      - 'worksheet-generator/bank-printable.html'
      - 'worksheet-generator/bank-printable.js'
      - 'scripts/test-algebra2-printable-sections.cjs'
      - '.github/workflows/algebra2-printable-sections.yml'
  workflow_dispatch:
jobs:
  sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-algebra2-printable-sections.cjs
