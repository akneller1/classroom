name: Slope Links Mini Golf
on:
  push:
    paths:
      - 'artifacts/slope-links-mini-golf/**'
      - 'scripts/test-slope-golf.cjs'
      - 'scripts/test-slope-golf-browser.cjs'
      - '.github/workflows/slope-golf.yml'
  workflow_dispatch:
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-slope-golf.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/slope-golf-http.log 2>&1 &
      - run: node scripts/test-slope-golf-browser.cjs
