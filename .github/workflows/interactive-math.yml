name: Interactive Math integration
on:
  push:
    paths:
      - 'data.js'
      - 'student-game-share.js'
      - 'artifacts/**'
      - 'thumbs/**'
      - 'tools/interactive-math-20261107/**'
      - 'tools/calculus-audit-20261118/labs/**'
      - 'scripts/test-calculus-labs.cjs'
      - 'tools/grade7-audit-20261119/labs/**'
      - 'scripts/test-interactive-math-update.cjs'
      - '.github/workflows/interactive-math.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalog resources, course preservation, and student links
        run: node scripts/test-interactive-math-update.cjs
      - name: Independently recompute worksheet answers
        run: python tools/interactive-math-20261107/tests/worksheet-answers.py
      - name: Calculus Related Rates and Particle Motion labs
        run: |
          python tools/calculus-audit-20261118/labs/build.py
          git diff --exit-code -- artifacts/calculus-related-rates-lab/index.html artifacts/calculus-particle-motion-lab/index.html
          node scripts/test-calculus-labs.cjs
          python tools/calculus-audit-20261118/labs/tests/worksheet-answers.py
      - name: Grade 7 Integer Chips and Circles labs
        run: |
          python tools/grade7-audit-20261119/labs/build.py
          git diff --exit-code -- artifacts/grade7-integer-chips-lab/index.html artifacts/grade7-circles-lab/index.html
          python tools/grade7-audit-20261119/labs/tests/worksheet-answers.py
