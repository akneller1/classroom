name: Course catalog integrity
on:
  push:
    paths:
      - 'data.js'
      - 'course-catalog.js'
      - 'scripts/audit-course-catalog.cjs'
      - '.github/workflows/course-catalog.yml'
  workflow_dispatch:
jobs:
  course-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate course IDs, curriculum skills, and resource paths
        run: node scripts/audit-course-catalog.cjs
