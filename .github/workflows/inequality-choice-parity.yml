name: Systems inequality visual-choice parity
on:
  push:
    paths:
      - 'worksheet-generator/menu/engine.js'
      - 'worksheet-generator/menu/render.js'
      - 'worksheet-generator/menu/skills/algebra1-systems-of-equations.js'
      - 'worksheet-generator/menu/tests/inequality-choice-parity.cjs'
      - 'worksheet-generator/games/bank.js'
      - 'worksheet-generator/games/games.js'
      - 'worksheet-generator/games/course-source.js'
      - 'worksheet-generator/games/course-activity.js'
      - 'worksheet-generator/practice/practice.js'
      - '.github/workflows/inequality-choice-parity.yml'
  pull_request:
    paths:
      - 'worksheet-generator/menu/engine.js'
      - 'worksheet-generator/menu/render.js'
      - 'worksheet-generator/menu/skills/algebra1-systems-of-equations.js'
      - 'worksheet-generator/menu/tests/inequality-choice-parity.cjs'
      - 'worksheet-generator/games/bank.js'
      - 'worksheet-generator/games/games.js'
      - 'worksheet-generator/games/course-source.js'
      - 'worksheet-generator/games/course-activity.js'
      - 'worksheet-generator/practice/practice.js'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CP2 CP1 Honors graph and point-check regression
        run: node worksheet-generator/menu/tests/inequality-choice-parity.cjs
      - name: Check modified JavaScript syntax
        run: |
          node --check worksheet-generator/menu/engine.js
          node --check worksheet-generator/menu/render.js
          node --check worksheet-generator/menu/app.js
          node --check worksheet-generator/games/bank.js
          node --check worksheet-generator/games/games.js
          node --check worksheet-generator/games/course-source.js
          node --check worksheet-generator/games/course-activity.js
          node --check worksheet-generator/practice/practice.js
