name: Tarsia across all courses
on:
  push:
    paths:
      - 'worksheet-generator/menu/printables*'
      - 'worksheet-generator/algebra2-bank-native.js'
      - 'question-banks/**'
      - 'scripts/test-tarsia-all-courses.cjs'
      - '.github/workflows/tarsia-fit.yml'
  workflow_dispatch:
jobs:
  tarsia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-tarsia-all-courses.cjs
