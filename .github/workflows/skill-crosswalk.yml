name: Shared curriculum skill crosswalk
on:
  push:
    paths:
      - 'skill-crosswalk.js'
      - 'course-catalog.js'
      - 'scripts/test-skill-crosswalk.cjs'
      - 'legacy-crosswalk-audit.js'
      - 'scripts/test-legacy-crosswalk-audit.cjs'
      - 'scripts/report-legacy-reuse.cjs'
      - 'scripts/test-crosswalk-generator-samples.cjs'
      - 'cross-course-difficulty.js'
      - 'scripts/test-cross-course-difficulty.cjs'
      - 'scripts/test-grade-reuse-samples.cjs'
      - 'legacy-review-samples.js'
      - 'scripts/test-legacy-review-samples.cjs'
      - 'worksheet-generator/legacy-review.*'
      - 'scripts/test-legacy-review-page.cjs'
      - 'scripts/test-legacy-review-browser.cjs'
      - 'scripts/validate-legacy-review.cjs'
      - 'scripts/test-legacy-review-validation.cjs'
      - 'scripts/assess-legacy-authorization.cjs'
      - 'scripts/test-legacy-authorization.cjs'
      - 'staged-legacy-reuse.js'
      - '.github/workflows/skill-crosswalk.yml'
  workflow_dispatch:
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-skill-crosswalk.cjs
      - run: node scripts/test-legacy-crosswalk-audit.cjs
      - run: node scripts/report-legacy-reuse.cjs
      - run: node scripts/test-crosswalk-generator-samples.cjs
      - run: node scripts/test-cross-course-difficulty.cjs
      - run: node scripts/test-grade-reuse-samples.cjs
      - run: node scripts/test-legacy-review-samples.cjs
      - run: node scripts/test-legacy-review-page.cjs
      - run: node scripts/test-legacy-review-validation.cjs
      - run: node scripts/test-legacy-authorization.cjs
      - run: node --check staged-legacy-reuse.js
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/review-http.log 2>&1 &
      - run: node scripts/test-legacy-review-browser.cjs
