name: Shared curriculum skill crosswalk
on:
  push:
    paths:
      - 'skill-crosswalk.js'
      - 'course-catalog.js'
      - 'scripts/test-skill-crosswalk.cjs'
      - 'legacy-crosswalk-audit.js'
      - 'scripts/test-legacy-crosswalk-audit.cjs'
      - 'scripts/report-legacy-reuse.cjs'
      - 'scripts/test-crosswalk-generator-samples.cjs'
      - 'cross-course-difficulty.js'
      - 'scripts/test-cross-course-difficulty.cjs'
      - '.github/workflows/skill-crosswalk.yml'
  workflow_dispatch:
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-skill-crosswalk.cjs
      - run: node scripts/test-legacy-crosswalk-audit.cjs
      - run: node scripts/report-legacy-reuse.cjs
      - run: node scripts/test-crosswalk-generator-samples.cjs
      - run: node scripts/test-cross-course-difficulty.cjs
