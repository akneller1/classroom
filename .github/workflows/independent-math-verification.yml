name: Independent math verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-math-verification.yml'
      - 'scripts/verify-bank-math.py'

permissions:
  contents: read

concurrency:
  group: classroom-independent-math-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent verifier
        run: python -m py_compile scripts/verify-bank-math.py
      - name: Recompute unambiguous answers and check distractors
        run: python scripts/verify-bank-math.py
      - name: Publish summary in GitHub Actions
        if: always()
        run: |
          if test -f math-verification-results/summary.md; then
            cat math-verification-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload independent verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-math-verification
          path: math-verification-results/
          if-no-files-found: warn
