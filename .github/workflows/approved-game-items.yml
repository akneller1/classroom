name: Approved game adapters
on:
  push:
    paths:
      - 'approved-game-items.js'
      - 'question-bank-adapter.js'
      - 'resource-eligibility.js'
      - 'scripts/test-approved-game-items.cjs'
      - '.github/workflows/approved-game-items.yml'
  workflow_dispatch:
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-approved-game-items.cjs
