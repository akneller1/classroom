name: Unit-Specific Math Arcade
on:
  push:
    paths:
      - 'artifacts/math-arcade/**'
      - 'unit-specific-arcade.js'
      - 'thumbs/arcade-*.svg'
      - 'app.js'
      - 'data.js'
      - 'scripts/test-browse-activities-browser.cjs'
      - 'activity.html'
      - 'scripts/test-arcade-links-thumbnails.cjs'
      - 'scripts/test-unit-specific-arcade.cjs'
      - 'scripts/test-unit-specific-arcade-browser.cjs'
      - 'index.html'
      - '.github/workflows/unit-specific-arcade.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-unit-specific-arcade.cjs
      - run: node scripts/test-arcade-links-thumbnails.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/arcade-http.log 2>&1 &
      - run: node scripts/test-unit-specific-arcade-browser.cjs
      - name: Browse Activities category and game tags
        run: node scripts/test-browse-activities-browser.cjs
