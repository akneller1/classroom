name: Interactive practice test checks
on:
  push:
    paths:
      - 'question-banks/**'
      - 'scripts/test-grading-baseline.cjs'
      - 'tests/fixtures/grading-baseline.json'
      - 'worksheet-generator/practice/**'
      - 'scripts/test-precalculus-audit.cjs'
      - 'scripts/test-calculus-grading.cjs'
      - 'worksheet-generator/practice-test.html'
      - 'worksheet-generator/tests/practice-grading-test.js'
      - 'worksheet-generator/menu/mathcheck.js'
      - '.github/workflows/practice-test-checks.yml'
      - 'scripts/test-site-audit.cjs'
      - 'data.js'
  pull_request:
    paths:
      - 'question-banks/**'
      - 'scripts/test-grading-baseline.cjs'
      - 'tests/fixtures/grading-baseline.json'
      - 'worksheet-generator/practice/**'
      - 'scripts/test-precalculus-audit.cjs'
      - 'scripts/test-calculus-grading.cjs'
      - 'worksheet-generator/practice-test.html'
      - 'worksheet-generator/tests/practice-grading-test.js'
      - 'worksheet-generator/menu/mathcheck.js'
      - 'scripts/test-site-audit.cjs'
      - 'data.js'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No course's grading gets worse (cross-course grading baseline)
        run: node scripts/test-grading-baseline.cjs
      - name: Whole-site audit checks (grading, cards, select-all counts)
        run: node scripts/test-site-audit.cjs
      - name: Exact grading regression tests
        run: node worksheet-generator/tests/practice-grading-test.js
      - name: Exact-value grading for bank answers (Precalculus audit)
        run: node scripts/test-precalculus-audit.cjs
      - name: Expression, antiderivative and family grading for bank answers (Calculus audit)
        run: node scripts/test-calculus-grading.cjs
      - name: JavaScript syntax checks
        run: |
          node --check worksheet-generator/practice/practice.js
          node --check worksheet-generator/practice/grading.js
          node --check worksheet-generator/practice/radical-grading.js
          node --check worksheet-generator/practice/exact-grading.js
          node --check worksheet-generator/practice/calculus-grading.js
          node --check worksheet-generator/practice/stat-grading.js
          node --check worksheet-generator/practice/graph-input.js
          node --check worksheet-generator/practice/line-input.js
          node --check worksheet-generator/practice/system-input.js
          node --check worksheet-generator/practice/parabola-input.js
          node --check worksheet-generator/practice/exponential-input.js
