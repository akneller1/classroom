name: Grade 7 audit checks
on:
  push:
    paths:
      - 'question-banks/prealgebra7/**'
      - 'question-banks/assets/prealgebra7/**'
      - 'tools/grade7-audit-20261119/**'
      - 'scripts/test-grade7-audit.cjs'
      - 'scripts/test-grade7-plot.cjs'
      - 'scripts/test-grade7-notes.cjs'
      - 'scripts/test-grade7-g3.cjs'
      - 'scripts/test-grade7-g4.cjs'
      - 'scripts/geo-planning.mjs'
      - 'data.js'
      - 'worksheet-generator/plot-grade7.js'
      - 'worksheet-generator/plot-practice.js'
      - 'worksheet-generator/planner/**'
      - 'worksheet-generator/lesson-planner.html'
      - 'artifacts/grade7-*/**'
      - 'worksheet-generator/practice/**'
      - 'worksheet-generator/practice-test.html'
      - 'worksheet-generator/menu/mathcheck.js'
      - 'worksheet-generator/menu/standards.js'
      - 'worksheet-generator/menu/standards-map.js'
      - 'worksheet-generator/vocabulary-data-middle-grades.js'
      - '.github/workflows/grade7-audit.yml'
  workflow_dispatch:
jobs:
  grade7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the key checker's and figure builder's dependencies
        run: python -m pip install sympy matplotlib==3.11.2   # matplotlib: figures.py, run by run_all.sh (Grade 7 G2)
      - name: Recompute Grade 7 keys from the printed prompts (Grade 7 audit 2026-11-19)
        run: python tools/grade7-audit-20261119/verify_keys.py
      - name: Recompute the keys of the rewritten Standard items (whole-site audit 2 #3)
        run: python tools/grade7-audit-20261119/verify_levels.py
      - name: The bank changes rebuild exactly from the scripts
        run: |
          bash tools/grade7-audit-20261119/run_all.sh
          git diff --exit-code -- question-banks/prealgebra7 worksheet-generator/vocabulary-data-middle-grades.js worksheet-generator/menu/standards-map.js
      - name: Recompute the batch G4 figure-item keys from their figures
        run: python tools/grade7-audit-20261119/verify_g4.py
      - name: Grade 7 audit regression checks
        run: node scripts/test-grade7-audit.cjs
      - name: Graphing Practice for four more Grade 7 units (#14)
        run: node scripts/test-grade7-plot.cjs
      - name: Teaching notes for every Grade 7 skill (#16)
        run: |
          python tools/grade7-audit-20261119/build_notes.py
          git diff --exit-code -- worksheet-generator/planner/notes-teach-prealgebra7.js
          node scripts/test-grade7-notes.cjs
      - name: Practice tests and reference sheet rebuild exactly (#18)
        run: |
          python tools/grade7-audit-20261119/g3_print.py
          git diff --exit-code -- artifacts/grade7-practice-test-a/exam.html artifacts/grade7-practice-test-a/key.html artifacts/grade7-practice-test-b/exam.html artifacts/grade7-practice-test-b/key.html artifacts/grade7-reference-sheet/index.html tools/grade7-audit-20261119/practice-tests.json
      - name: Labs, pacing guide, practice tests and reference sheet (#15, #17, #18)
        run: node scripts/test-grade7-g3.cjs
      - name: Batch G4 (radical grading, 7.EE.A.2, figures, Scale Drawings lab)
        run: node scripts/test-grade7-g4.cjs
