name: Precalculus and Calculus bank integration
on:
  push:
    paths:
      - 'question-banks/manifest.json'
      - 'question-banks/precalculus/**'
      - 'question-banks/calculus/**'
      - 'question-banks/assets/precalculus/**'
      - 'question-banks/assets/calculus/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  pull_request:
    paths:
      - 'question-banks/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: precalculus
            prefix: pc-
          - course: calculus
            prefix: cal-
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every published question bank and its images
        run: node scripts/test-published-question-banks.cjs
      - name: Verify all units, skills, games, printables, flashcards and lesson plans
        run: node scripts/test-hs-bank-integration.cjs
        env:
          MG_COURSE: ${{ matrix.course }}
          MG_PREFIX: ${{ matrix.prefix }}
