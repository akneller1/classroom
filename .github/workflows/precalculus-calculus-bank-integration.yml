name: Precalculus and Calculus bank integration
on:
  push:
    paths:
      - 'question-banks/manifest.json'
      - 'question-banks/precalculus/**'
      - 'question-banks/calculus/**'
      - 'question-banks/assets/precalculus/**'
      - 'question-banks/assets/calculus/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - 'scripts/test-precalculus-*.cjs'
      - 'scripts/geo-planning.mjs'
      - 'tools/precalculus-audit-20261118/**'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  pull_request:
    paths:
      - 'question-banks/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - 'scripts/test-precalculus-*.cjs'
      - 'scripts/geo-planning.mjs'
      - 'tools/precalculus-audit-20261118/**'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: precalculus
            prefix: pc-
          - course: calculus
            prefix: cal-
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every published question bank and its images
        run: node scripts/test-published-question-banks.cjs
      - name: Verify all units, skills, games, printables, flashcards and lesson plans
        run: node scripts/test-hs-bank-integration.cjs
        env:
          MG_COURSE: ${{ matrix.course }}
          MG_PREFIX: ${{ matrix.prefix }}
      - name: Precalculus audit regression checks
        if: matrix.course == 'precalculus'
        run: node scripts/test-precalculus-audit.cjs
      - name: Precalculus teaching notes cover every skill
        if: matrix.course == 'precalculus'
        run: |
          python3 tools/precalculus-audit-20261118/build_notes.py
          git diff --exit-code -- worksheet-generator/planner/notes-teach-precalculus.js
          node scripts/test-precalculus-notes.cjs
      - name: Precalculus standards-gap skills (independent answer check)
        if: matrix.course == 'precalculus'
        run: |
          python3 tools/precalculus-audit-20261118/gaps/verify.py
          node scripts/test-precalculus-gap-skills.cjs
      - name: Precalculus Graphing Practice items (graded by core/plot.js, recomputed from prompts)
        if: matrix.course == 'precalculus'
        run: node scripts/test-precalculus-plot-items.cjs
      - name: Precalculus independent answer check (audit checker, 2,000+ items)
        if: matrix.course == 'precalculus'
        run: |
          python -m pip install --quiet numpy
          python3 tools/precalculus-audit-20261118/checker/pc_verify.py --min 2000
