name: Precalculus and Calculus bank integration
on:
  push:
    paths:
      - 'question-banks/manifest.json'
      - 'question-banks/precalculus/**'
      - 'question-banks/calculus/**'
      - 'question-banks/assets/precalculus/**'
      - 'question-banks/assets/calculus/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - 'scripts/test-precalculus-*.cjs'
      - 'scripts/geo-planning.mjs'
      - 'tools/precalculus-audit-20261118/**'
      - 'artifacts/interactive-math/**'
      - 'tools/calculus-audit-20261118/**'
      - 'scripts/test-calculus-*.cjs'
      - 'artifacts/calculus-ap-practice-exam-*/**'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  pull_request:
    paths:
      - 'question-banks/**'
      - 'worksheet-generator/**'
      - 'course-catalog.js'
      - 'data.js'
      - 'app.js'
      - 'scripts/test-hs-bank-integration.cjs'
      - 'scripts/test-precalculus-*.cjs'
      - 'scripts/geo-planning.mjs'
      - 'tools/precalculus-audit-20261118/**'
      - 'artifacts/interactive-math/**'
      - 'tools/calculus-audit-20261118/**'
      - 'scripts/test-calculus-*.cjs'
      - 'artifacts/calculus-ap-practice-exam-*/**'
      - '.github/workflows/precalculus-calculus-bank-integration.yml'
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: precalculus
            prefix: pc-
          - course: calculus
            prefix: cal-
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every published question bank and its images
        run: node scripts/test-published-question-banks.cjs
      - name: Verify all units, skills, games, printables, flashcards and lesson plans
        run: node scripts/test-hs-bank-integration.cjs
        env:
          MG_COURSE: ${{ matrix.course }}
          MG_PREFIX: ${{ matrix.prefix }}
      - name: Precalculus audit regression checks
        if: matrix.course == 'precalculus'
        run: node scripts/test-precalculus-audit.cjs
      - name: Precalculus teaching notes cover every skill
        if: matrix.course == 'precalculus'
        run: |
          python3 tools/precalculus-audit-20261118/build_notes.py
          git diff --exit-code -- worksheet-generator/planner/notes-teach-precalculus.js
          node scripts/test-precalculus-notes.cjs
      - name: Precalculus standards-gap skills (independent answer check)
        if: matrix.course == 'precalculus'
        run: |
          python3 tools/precalculus-audit-20261118/gaps/verify.py
          python3 tools/site-audit-20261120/honors_standards/verify.py
          node scripts/test-precalculus-gap-skills.cjs
      - name: Precalculus Graphing Practice items (graded by core/plot.js, recomputed from prompts)
        if: matrix.course == 'precalculus'
        run: node scripts/test-precalculus-plot-items.cjs
      - name: Precalculus independent answer check (audit checker, 2,000+ items)
        if: matrix.course == 'precalculus'
        run: |
          python -m pip install --quiet numpy
          python3 tools/precalculus-audit-20261118/checker/pc_verify.py --min 2000
      - name: Precalculus audit items 12-20 (levels, select-all, notation, rounding, option order, labs)
        if: matrix.course == 'precalculus'
        run: node scripts/test-precalculus-audit-next10.cjs
      - name: Calculus audit regression checks
        if: matrix.course == 'calculus'
        run: node scripts/test-calculus-audit.cjs
      - name: Calculus graphing practice and free-response problems
        if: matrix.course == 'calculus'
        run: |
          node --check worksheet-generator/plot-calculus.js
          node scripts/test-calculus-plot.cjs
      - name: Calculus teaching notes cover every skill
        if: matrix.course == 'calculus'
        run: |
          python3 tools/calculus-audit-20261118/build_notes.py
          git diff --exit-code -- worksheet-generator/planner/notes-teach-calculus.js
          node scripts/test-calculus-notes.cjs
      - name: Recompute Calculus keys independently (sympy)
        if: matrix.course == 'calculus'
        run: |
          python3 -m pip install --quiet sympy==1.14.0
          python3 tools/calculus-audit-20261118/verify_keys.py
      - name: Calculus AP practice exams match the banks
        if: matrix.course == 'calculus'
        run: |
          python3 tools/calculus-audit-20261118/exams.py
          git diff --exit-code -- artifacts/calculus-ap-practice-exam-a artifacts/calculus-ap-practice-exam-b
          node scripts/test-calculus-exams.cjs
