name: Grade 6 audit checks
on:
  push:
    paths:
      - 'question-banks/math6/**'
      - 'question-banks/assets/math6/**'
      - 'tools/grade6-audit-20261119/**'
      - 'tools/grade7-audit-20261119/verify_keys.py'
      - 'scripts/test-grade6-*.cjs'
      - 'scripts/geo-planning.mjs'
      - 'data.js'
      - 'worksheet-generator/plot-grade6.js'
      - 'worksheet-generator/plot-practice.js'
      - 'worksheet-generator/planner/**'
      - 'worksheet-generator/lesson-planner.html'
      - 'artifacts/grade6-*/**'
      - 'worksheet-generator/practice/**'
      - 'worksheet-generator/practice-test.html'
      - 'worksheet-generator/menu/mathcheck.js'
      - 'worksheet-generator/menu/standards.js'
      - 'worksheet-generator/menu/standards-map.js'
      - 'worksheet-generator/vocabulary-data-middle-grades.js'
      - '.github/workflows/grade6-audit.yml'
  workflow_dispatch:
jobs:
  grade6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the key checker's and the figures' dependencies
        run: pip install sympy matplotlib
      - name: Recompute Grade 6 keys from the printed prompts and check every error-analysis item (Grade 6 audit 2026-11-19)
        run: python tools/grade6-audit-20261119/verify_keys.py
      - name: The bank changes rebuild exactly from the scripts
        run: |
          bash tools/grade6-audit-20261119/run_all.sh
          git diff --exit-code -- question-banks/math6 worksheet-generator/vocabulary-data-middle-grades.js worksheet-generator/menu/standards-map.js
      - name: Recompute the batch 6B Honors and new-item keys
        run: |
          python tools/grade6-audit-20261119/verify_honors.py
          python tools/grade6-audit-20261119/verify_new.py
      - name: Grade 6 audit regression checks
        run: node scripts/test-grade6-audit.cjs
      - name: Graphing Practice for three more Grade 6 units (#11)
        run: node scripts/test-grade6-plot.cjs
      - name: Teaching notes for every Grade 6 skill and extension marks (#12, #19)
        run: |
          python tools/grade6-audit-20261119/build_notes.py
          git diff --exit-code -- worksheet-generator/planner/notes-teach-math6.js
          node scripts/test-grade6-notes.cjs
      - name: Practice tests and reference sheet rebuild exactly (#14)
        run: |
          python tools/grade6-audit-20261119/g6_print.py
          git diff --exit-code -- artifacts/grade6-practice-test-a/exam.html artifacts/grade6-practice-test-a/key.html artifacts/grade6-practice-test-b/exam.html artifacts/grade6-practice-test-b/key.html artifacts/grade6-reference-sheet/index.html tools/grade6-audit-20261119/practice-tests.json
      - name: Labs, pacing guide, practice tests and reference sheet (#13, #14, #16)
        run: node scripts/test-grade6-c.cjs
