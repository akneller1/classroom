name: Algebra 2 bank integration
on:
  push:
    paths:
      - 'question-banks/algebra2/**'
      - 'question-banks/assets/algebra2/**'
      - 'question-banks/manifest.json'
      - 'scripts/*algebra2*.cjs'
      - 'scripts/check-question-bank.cjs'
      - 'worksheet-generator/algebra2-*'
      - 'worksheet-generator/bank-printable.*'
      - 'worksheet-generator/menu/printables*.js'
      - 'worksheet-generator/menu/app.js'
      - 'worksheet-generator/planner/**'
      - 'worksheet-generator/printables.html'
      - 'app.js'
      - 'index.html'
      - 'worksheet-generator/worksheet.html'
      - 'worksheet-generator/menu-assessment.html'
      - 'worksheet-generator/lesson-planner.html'
      - 'data.js'
      - 'resource-eligibility.js'
      - 'resource-standards.js'
      - 'student-game-share.js'
      - 'student-share-cards.js'
      - 'worksheet-generator/course-*.html'
      - 'worksheet-generator/games/**'
      - 'worksheet-generator/core/math-display.*'
      - 'scripts/test-course-parity-browser.cjs'
      - 'scripts/test-classroom-presentation.cjs'
      - '.github/workflows/algebra2-bank-coverage.yml'
  workflow_dispatch:
concurrency:
  group: classroom-activity-parity
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all published banks and image paths
        run: node scripts/test-published-question-banks.cjs
      - run: node scripts/check-algebra2-coverage.cjs
      - run: node scripts/test-algebra2-native.cjs
      - run: node scripts/test-classroom-presentation.cjs
      - run: node worksheet-generator/games/tests/student-share-tests.cjs
      - run: node scripts/test-algebra2-printable-sections.cjs
      - run: node scripts/test-resource-eligibility.cjs
      - run: node scripts/audit-course-catalog.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start local website
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/algebra2-http.log 2>&1 &
      - name: All-unit browser integration matrix
        run: node scripts/test-algebra2-integration-browser.cjs
      - name: Full Detective, Escape Room, stealing and empty-bank class parity
        run: node scripts/test-course-parity-browser.cjs
      - name: Existing generator editing, versions, and print regression
        run: node scripts/test-algebra2-printable-browser.cjs
      - name: Browser diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algebra2-integration-coverage
          path: test-results/
      - name: Publish actual activity preview images
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- . ":(exclude)thumbs/previews" ":(exclude)thumbs/resource-previews.js" ":(exclude)index.html"; then
            echo "Newer source changes exist; their validation run will publish fresh previews."
            exit 0
          fi
          node scripts/publish-resource-previews.cjs
          node scripts/test-classroom-presentation.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs/previews thumbs/resource-previews.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh activity preview images from passing browser tests"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
