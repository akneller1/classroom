name: Partner check coverage
on:
  push:
    paths:
      - 'question-banks/**'
      - 'worksheet-generator/menu/printables*'
      - 'worksheet-generator/algebra2-bank-native.js'
      - 'scripts/test-partner-check-pairs.cjs'
      - 'tools/partner-check-companions-20261107/**'
      - 'tools/statistics-honors-formats-20261107/**'
      - '.github/workflows/partner-checks.yml'
  workflow_dispatch:
jobs:
  partner-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute companion question answers
        run: python tools/partner-check-companions-20261107/apply.py --check
      - name: Recompute Statistics Honors additions
        run: python tools/statistics-honors-formats-20261107/add_honors.py --check
      - name: Check partner pair uniqueness, levels, and coverage
        run: node scripts/test-partner-check-pairs.cjs
