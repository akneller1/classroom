# Publishes only the public site (built by scripts/build-site.mjs) to GitHub Pages.
# Supports branch-based Pages; selecting GitHub Actions as the Pages source avoids a duplicate automatic build.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: public-site-pages
  # Finish an active deployment before starting the next one. Cancelled runs can
  # leave an unfinished Pages deployment behind and cause HTTP 400 conflicts.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public site
        run: node scripts/build-site.mjs
      - name: Validate approved question-bank loading
        run: node scripts/test-question-bank-loader.cjs
      - name: Verify saved-work backup and restore
        run: node scripts/test-backup-tool.cjs
      - name: Check public site
        run: node scripts/test-public-site.cjs
      - name: Audit all dynamic course and unit routes (non-blocking)
        continue-on-error: true
        run: node scripts/test-dynamic-routing.cjs
      - name: Check out approved Grade 5 course sources
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: main
          path: _course_sources/grade5
          persist-credentials: false
      - name: Assemble approved Grade 5 into production artifact
        env:
          GRADE5_SOURCE_DIR: _course_sources/grade5
        run: node scripts/integrate-approved-courses.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Branch-based Pages may also run its automatic build. Publish our filtered
      # artifact last so that build cannot replace it with the unfiltered source.
      - name: Wait for any automatic Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,branch:context.ref.replace('refs/heads/',''),per_page:100});
              const pending = data.workflow_runs.filter(run=>run.id!==context.runId&&run.name==='pages build and deployment'&&run.status!=='completed');
              if (!pending.length) return;
              if (!attempt) core.info('Waiting for automatic Pages deployment before publishing the public build.');
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            core.setFailed('Automatic Pages deployment did not finish within ten minutes.');
      - id: deployment
        uses: actions/deploy-pages@v4
