# Publishes only the public site (built by scripts/build-site.mjs) to GitHub Pages.
# Supports branch-based Pages; selecting GitHub Actions as the Pages source avoids a duplicate automatic build.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # Refresh approved course content daily even if the Classroom repo has not changed.
    - cron: '17 9 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: public-site-pages
  # Finish an active deployment before starting the next one. Cancelled runs can
  # leave an unfinished Pages deployment behind and cause HTTP 400 conflicts.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public site
        run: node scripts/build-site.mjs
      - name: Validate approved question-bank loading
        run: node scripts/test-question-bank-loader.cjs
      - name: Verify saved-work backup and restore
        run: node scripts/test-backup-tool.cjs
      - name: Audit all dynamic course and unit routes (non-blocking)
        continue-on-error: true
        run: node scripts/test-dynamic-routing.cjs
      - name: Check out approved Grade 5 course sources
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: main
          path: _course_sources/grade5
          persist-credentials: false
      - name: Assemble approved Grade 5 into production artifact
        env:
          GRADE5_SOURCE_DIR: _course_sources/grade5
        run: node scripts/integrate-approved-courses.mjs
      - name: Assemble approved Financial Algebra into production artifact
        env:
          FINANCIAL_ALGEBRA_SOURCE_DIR: _course_sources/grade5
        run: node scripts/integrate-financial-algebra.mjs
      - name: Check out approved Grade 4 source
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: 9f29d62f3c0574025064f22e4ef92fb2bf3c4646
          path: _course_sources/grade4
          persist-credentials: false
      - name: Assemble Grade 4 into production artifact
        env:
          GRADE4_SOURCE_DIR: _course_sources/grade4
        run: node scripts/integrate-grade4.mjs
      - name: Verify Grade 4 release structure
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('_site/question-banks/manifest.json'));if(m.banks.filter(x=>x.courseId==='grade4').length!==10)process.exit(1);for(const p of ['grade4-main-catalog.js','grade4/worksheet-generator/grade4-games.html','grade4/worksheet-generator/grade4-understanding-check.html'])if(!fs.existsSync('_site/'+p))process.exit(1)"
      - name: Check out Grade 3 source from the development repository
        uses: actions/checkout@v4
        with:
          repository: akneller1/FinancialAlgebra
          ref: 402cf5889eb62e9202bde814e14f2bb76dcbd554
          path: _course_sources/grade3
          persist-credentials: false
      - name: Assemble Grade 3 into production artifact
        env:
          GRADE3_SOURCE_DIR: _course_sources/grade3
        run: node scripts/integrate-grade3.mjs
      - name: Verify Grade 3 release structure
        run: |
          node -e "const fs=require('fs');const root='_site/',m=JSON.parse(fs.readFileSync(root+'question-banks/manifest.json'));const b=m.banks.filter(x=>x.courseId==='grade3');if(b.length!==11||!b.every(x=>x.approved&&fs.existsSync(root+x.path)))process.exit(1);for(const p of ['grade3-main-catalog.js','grade3/worksheet-generator/grade3-games.html','grade3/worksheet-generator/grade3-understanding-check.html','grade3/worksheet-generator/grade3-flashcards.html','grade3/grade3-native-notes.js'])if(!fs.existsSync(root+p))throw Error('Missing Grade 3 resource: '+p)"
      - name: Check assembled public site and course navigation
        run: node scripts/test-public-site.cjs
      - name: Verify published Grade 5 game question loading
        run: node scripts/test-grade5-deployment.cjs _site
      - name: Audit published Grade 5 resources, banks and navigation
        run: node scripts/audit-grade5-release.cjs _site
      - name: Verify elementary generator feature parity
        run: node scripts/test-elementary-generators.cjs _site
      - name: Install Chromium for elementary course parity
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser-check elementary game routing, student links and course switching
        run: node scripts/test-elementary-browser-parity.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Branch-based Pages may also run its automatic build. Publish our filtered
      # artifact last so that build cannot replace it with the unfiltered source.
      - name: Wait for any automatic Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,branch:context.ref.replace('refs/heads/',''),per_page:100});
              const pending = data.workflow_runs.filter(run=>run.id!==context.runId&&run.name==='pages build and deployment'&&run.status!=='completed');
              if (!pending.length) return;
              if (!attempt) core.info('Waiting for automatic Pages deployment before publishing the public build.');
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            core.setFailed('Automatic Pages deployment did not finish within ten minutes.');
      - id: deployment
        uses: actions/deploy-pages@v4
