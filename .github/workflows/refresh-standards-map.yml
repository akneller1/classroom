name: Regenerate Classroom standards map

on:
  push:
    paths:
      - .github/workflows/refresh-standards-map.yml
      - worksheet-generator/menu/standards.js
      - worksheet-generator/planner/scope-*.js
      - worksheet-generator/planner/lesson-skills*.js
      - question-banks/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical skill-to-standard mappings
        run: |
          node scripts/build_standards_map.cjs
          node scripts/test-standards.cjs
      - name: Commit regenerated file, without modifying source tags
        run: |
          git config user.name "mrks-classroom-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheet-generator/menu/standards-map.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate standards map from current question banks"
            git push origin HEAD:main
          fi
