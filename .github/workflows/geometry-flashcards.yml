name: Geometry flashcard QA
on:
  push:
    paths:
      - 'worksheet-generator/menu/engine.js'
      - 'worksheet-generator/menu/verify.js'
      - 'worksheet-generator/menu/mathcheck.js'
      - 'worksheet-generator/menu/skills/**'
      - 'worksheet-generator/menu/geometry-*.js'
      - 'worksheet-generator/menu/figures.js'
      - 'worksheet-generator/games/bank.js'
      - 'worksheet-generator/games/tests/geometry-flashcard-parity.cjs'
      - '.github/workflows/geometry-flashcards.yml'
  workflow_dispatch:
jobs:
  geometry-flashcards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Geometry curriculum
        run: node worksheet-generator/menu/tests/geometry-curriculum-tests.cjs
      - name: Geometry generated-question regression
        run: node worksheet-generator/menu/tests/geometry-generator-regression.cjs
      - name: Geometry flashcard bank all levels
        run: node worksheet-generator/games/tests/geometry-flashcard-parity.cjs
