name: Import Algebra 2 Partner Checks
on:
  push:
    branches: [main]
    paths:
      - 'incoming/Algebra2_Partner_Check_All.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: algebra2-partner-check-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow
      - run: python scripts/import_algebra2_partner_checks.py
      - name: Commit imported PDFs, thumbnails and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js resource-details.js artifacts thumbs incoming
          if ! git diff --cached --quiet; then
            git commit -m "Add Algebra 2 partner checks across eight units"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
