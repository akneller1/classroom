name: Stop superseded card audit
on:
  push:
    branches: [ci/structural-audit-diagnostics-20261114]
    paths: ['.github/workflows/structural-audit-diagnostics.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-superseded-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = 43646376631;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
            if (run.status !== 'completed') await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
