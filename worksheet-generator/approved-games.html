<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approved Review Games · Mr. K's Classroom</title><link rel="stylesheet" href="../styles.css"><style>
.ag-wrap{max-width:900px;margin:2rem auto;padding:1rem}.ag-settings{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}.ag-settings select,.ag-settings button,.ag-cell,.ag-answer button{padding:.65rem;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}.ag-grid{display:grid;gap:.5rem;max-width:580px;margin:1rem auto}.ag-grid[data-game="connect-4"]{grid-template-columns:repeat(7,1fr)}.ag-grid[data-game="tic-tac-toe"]{grid-template-columns:repeat(3,1fr);max-width:360px}.ag-grid[data-game="picture-reveal"]{grid-template-columns:repeat(4,1fr)}.ag-cell{aspect-ratio:1;cursor:pointer;font-size:1.4rem;font-weight:bold}.ag-cell[disabled]{cursor:default}.ag-cell[data-owner="1"]{background:#cbe7ff;color:#123b6b}.ag-cell[data-owner="2"]{background:#ffe3ce;color:#683000}.ag-cell[data-owner="revealed"]{background:var(--wash);opacity:.3}.ag-question{padding:1rem;border:2px solid var(--edge);border-radius:14px;margin:1rem 0}.ag-answer{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.ag-answer button{cursor:pointer}.ag-answer button:focus-visible,.ag-cell:focus-visible{outline:3px solid var(--blue-bg);outline-offset:2px}.ag-note{color:var(--ink-soft)}[hidden]{display:none!important}</style></head><body><main class="ag-wrap"><a href="../index.html">← Classroom</a><h1>Approved-bank Review Games</h1><p class="ag-note">Only independently approved questions. Existing classroom games are unchanged.</p><p id="agStatus" role="status">Loading approved question banks…</p><div id="agApp" hidden><div class="ag-settings"><label>Game <select id="agGame"><option value="tic-tac-toe">Tic-Tac-Toe</option><option value="connect-4">Connect 4</option><option value="picture-reveal">Picture Reveal</option></select></label><label>Level <select id="agLevel"><option value="cp2">Easy (CP2)</option><option value="cp1" selected>Medium (CP1)</option><option value="honors">Hard (Honors)</option></select></label><label>Skill <select id="agSkill"><option value="">All skills</option></select></label><button id="agReset">New game</button></div><p id="agTurn" role="status"></p><div class="ag-grid" id="agGrid"></div><section id="agQuestion" class="ag-question" hidden><p id="agPrompt"></p><div class="ag-answer" id="agOptions"></div><button id="agReveal" type="button">Show answer / judge</button><p id="agSolution" hidden></p><div class="ag-answer"><button id="agCorrect" hidden>Correct — claim square</button><button id="agWrong" hidden>Incorrect — pass turn</button></div></section></div></main><script src="../data.js"></script><script src="../course-catalog.js"></script><script src="../question-bank-adapter.js"></script><script src="../resource-eligibility.js"></script><script src="../approved-game-items.js"></script><script src="../question-bank-loader.js"></script><script src="approved-games.js?v=1"></script></body></html>
