<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Flashcards preview: Investing &amp; Compound Growth"><rect x="0" y="0" width="720" height="450" rx="0" fill="#fff1d9" stroke="#fff1d9" stroke-width="2"/><rect x="0" y="0" width="720" height="101" rx="0" fill="#b46a18" stroke="#b46a18" stroke-width="2"/><text x="30" y="46" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="white">Flashcards</text><text x="31" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="white">UNIT 6  /  Investing &amp; Compound Growth</text><g transform="rotate(-9 256 265)"><rect x="53" y="150" width="356" height="224" rx="12" fill="#f3d7aa" stroke="#b46a18" stroke-width="2"/><text x="80" y="190" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#b46a18">FINANCIAL VOCABULARY</text></g><g transform="rotate(5 395 284)"><rect x="215" y="169" width="452" height="240" rx="12" fill="white" stroke="#b46a18" stroke-width="2"/><text x="242" y="203" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#b46a18">THINK → FLIP → REMEMBER</text><text x="243" y="247" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#b46a18">Compound growth</text><text x="243" y="318" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#17213a">Growth in which earnings are added to the</text><text x="243" y="340" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#17213a">balance and then earn returns themselves</text></g><g transform="translate(34 270) scale(.72)"><path d="M15 17v116h128" stroke="#b46a18" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="86" width="22" height="27" rx="3" fill="#b46a18" stroke="#b46a18" stroke-width="2"/><rect x="61" y