# OPTIONAL one-time workflow for deleting the retired files from the GitHub website.
# 1. Move this file to .github/workflows/cleanup-old-files.yml and commit it.
# 2. Open the Actions tab, choose "Delete retired files (Nov 5 d)", and click "Run workflow".
# 3. After it finishes, delete this workflow file and the cleanup-20261105d/ folder.
name: Delete retired files (Nov 5 d)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash cleanup-20261105d/delete-old-files.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove retired files (cleanup-20261105d/DELETE-LIST.txt)" || echo "Nothing to remove"
          git push
