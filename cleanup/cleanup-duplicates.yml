# OPTIONAL one-time workflow for deleting the duplicate files from the GitHub website.
# 1. Move this file to .github/workflows/cleanup-duplicates.yml and commit it.
# 2. Open the Actions tab, choose "Delete duplicate root files", and click "Run workflow".
# 3. After it finishes, delete this workflow file and the cleanup/ folder.
name: Delete duplicate root files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash cleanup/delete-duplicates.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicate root files (cleanup/DELETE-LIST.txt)" || echo "Nothing to remove"
          git push
